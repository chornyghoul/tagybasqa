<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Открытый урок — Tagybasqa</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0d1821; --bg2:#111f2c; --bg3:#162636; --bg4:#1c3040;
      --border:rgba(255,255,255,.06); --border2:rgba(255,255,255,.11);
      --text:#fff; --text2:#c8d8e4; --text3:#5f8499;
      --blue:#1cb0f6; --blue2:#0e86c0; --green:#57cc02; --green2:#3a8c01;
      --orange:#ff9600; --red:#ff4b4b; --purple:#ce82ff; --yellow:#ffd900; --teal:#1fe0c0;
      --r:12px; --r2:16px; --font:'Nunito',sans-serif; --mono:'DM Mono',monospace;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

    /* ── LAYOUT ── */
    .app{display:grid;grid-template-columns:1fr 320px;height:100vh;overflow:hidden}

    /* ── MAIN STAGE ── */
    .stage{display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--bg);position:relative}

    /* Topbar */
    .stage-top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);background:rgba(13,24,33,.95);backdrop-filter:blur(20px);flex-shrink:0;z-index:10}
    .lesson-title-display{font-size:15px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pin-badge{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--blue);background:rgba(28,176,246,.12);border:1.5px solid rgba(28,176,246,.25);padding:6px 14px;border-radius:99px;letter-spacing:.1em}
    .timer-display{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--yellow);min-width:56px;text-align:center}
    .timer-display.urgent{color:var(--red);animation:urgentPulse 1s infinite}
    @keyframes urgentPulse{0%,100%{opacity:1}50%{opacity:.5}}
    .btn-sm{background:transparent;border:1.5px solid var(--border2);color:var(--text2);padding:7px 14px;border-radius:99px;font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
    .btn-sm:hover{border-color:var(--blue);color:var(--blue)}
    .btn-blue{background:var(--blue);border-color:var(--blue);color:#fff}
    .btn-blue:hover{filter:brightness(1.1);color:#fff}
    .btn-green{background:var(--green);border-color:var(--green);color:#fff}
    .btn-green:hover{filter:brightness(1.1);color:#fff}
    .btn-red{background:var(--red);border-color:var(--red);color:#fff}

    /* Progress bar */
    .progress-track{height:4px;background:var(--bg3);position:relative;flex-shrink:0}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));transition:width .5s ease;border-radius:0 2px 2px 0}

    /* ── SLIDE AREA ── */
    .slide-area{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:40px;position:relative}

    .slide-card{background:var(--bg2);border:1.5px solid var(--border2);border-radius:24px;width:100%;max-width:860px;max-height:100%;overflow-y:auto;padding:48px 56px;animation:slideIn .35s cubic-bezier(.16,1,.3,1)}
    @keyframes slideIn{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
    .slide-num-pill{font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.15em;margin-bottom:16px;display:block}
    .slide-main-title{font-size:clamp(22px,4vw,38px);font-weight:900;line-height:1.15;letter-spacing:-.5px;margin-bottom:16px}
    .slide-body-text{font-size:clamp(14px,2vw,18px);color:var(--text2);line-height:1.7}
    .slide-emoji-big{font-size:80px;text-align:center;display:block;margin-bottom:20px;filter:drop-shadow(0 8px 24px rgba(0,0,0,.4))}

    /* Quiz slide */
    .quiz-slide-q{font-size:clamp(16px,2.5vw,26px);font-weight:800;margin-bottom:28px;line-height:1.35}
    .quiz-options-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .quiz-opt-btn{background:var(--bg3);border:2px solid var(--border2);border-radius:var(--r2);padding:18px 22px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;text-align:left;display:flex;align-items:center;gap:12px;color:var(--text)}
    .quiz-opt-btn:hover:not(:disabled){border-color:var(--blue);background:rgba(28,176,246,.08)}
    .quiz-opt-btn.revealed-correct{border-color:var(--green);background:rgba(87,204,2,.12);color:var(--green)}
    .quiz-opt-btn.revealed-wrong{border-color:var(--red);background:rgba(255,75,75,.08);color:var(--red);opacity:.5}
    .opt-letter{width:32px;height:32px;border-radius:8px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:700;flex-shrink:0;color:var(--text3)}
    .quiz-opt-btn.revealed-correct .opt-letter{background:var(--green);color:#fff}

    /* Poll slide */
    .poll-bars{display:flex;flex-direction:column;gap:14px;margin-top:20px}
    .poll-bar-row{display:flex;align-items:center;gap:14px}
    .poll-bar-label{font-size:14px;font-weight:700;min-width:120px}
    .poll-bar-track{flex:1;height:36px;background:var(--bg3);border-radius:8px;overflow:hidden;position:relative}
    .poll-bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:8px;transition:width .6s cubic-bezier(.16,1,.3,1)}
    .poll-bar-pct{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--blue);min-width:40px;text-align:right}

    /* Code slide */
    .slide-code-block{background:#050e18;border:1.5px solid var(--border2);border-radius:var(--r);padding:20px;font-family:var(--mono);font-size:14px;line-height:1.7;color:#cdd8dd;margin-top:16px;overflow-x:auto;white-space:pre}
    .code-kw{color:#ff7b93} .code-fn{color:var(--blue)} .code-str{color:var(--green)} .code-cmt{color:var(--text3)}

    /* Callout */
    .slide-callout{display:flex;gap:16px;padding:20px;border-radius:var(--r);margin-top:16px}
    .slide-callout.info{background:rgba(28,176,246,.1);border-left:4px solid var(--blue)}
    .slide-callout.warning{background:rgba(255,150,0,.1);border-left:4px solid var(--orange)}
    .slide-callout.success{background:rgba(87,204,2,.1);border-left:4px solid var(--green)}
    .slide-callout.danger{background:rgba(255,75,75,.1);border-left:4px solid var(--red)}

    /* ── NAV BUTTONS ── */
    .nav-row{display:flex;align-items:center;justify-content:center;gap:16px;padding:16px 24px;border-top:1px solid var(--border);flex-shrink:0;background:rgba(13,24,33,.9)}
    .nav-btn{background:var(--bg3);border:2px solid var(--border2);color:var(--text);padding:12px 28px;border-radius:99px;font-family:var(--font);font-size:14px;font-weight:800;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:8px}
    .nav-btn:hover:not(:disabled){border-color:var(--border2);background:var(--bg4)}
    .nav-btn:disabled{opacity:.3;cursor:not-allowed}
    .nav-btn.main{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 16px rgba(28,176,246,.3)}
    .nav-btn.main:hover:not(:disabled){filter:brightness(1.1)}
    .slide-counter{font-family:var(--mono);font-size:13px;color:var(--text3);min-width:80px;text-align:center}
    .action-row{display:flex;align-items:center;gap:8px;margin-left:auto}
    .reveal-btn{background:rgba(87,204,2,.12);border:1.5px solid rgba(87,204,2,.3);color:var(--green);padding:10px 18px;border-radius:99px;font-family:var(--font);font-size:13px;font-weight:800;cursor:pointer;transition:all .15s}
    .reveal-btn:hover{background:var(--green);color:#fff}

    /* ── SIDEBAR ── */
    .sidebar{border-left:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--bg2)}
    .sidebar-top{padding:16px;border-bottom:1px solid var(--border);flex-shrink:0}
    .sidebar-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);flex-shrink:0}
    .sidebar-tab{flex:1;padding:11px 8px;text-align:center;font-size:10px;font-weight:800;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;letter-spacing:.06em;text-transform:uppercase;border:none;background:none;font-family:var(--font);margin-bottom:-1px}
    .sidebar-tab.active{color:var(--blue);border-bottom-color:var(--blue)}
    .sidebar-panel{display:none;flex:1;overflow-y:auto;padding:14px}
    .sidebar-panel.active{display:flex;flex-direction:column;gap:10px}

    /* PIN join display */
    .pin-join-card{background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r2);padding:18px;text-align:center;margin-bottom:4px}
    .pin-join-label{font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.15em;margin-bottom:10px}
    .pin-join-code{font-family:var(--mono);font-size:32px;font-weight:700;color:var(--blue);letter-spacing:.2em}
    .pin-join-url{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:6px}
    .players-count-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(87,204,2,.1);border:1px solid rgba(87,204,2,.2);border-radius:99px;padding:4px 12px;font-family:var(--mono);font-size:11px;color:var(--green);margin-top:10px}
    .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:livePulse 1.2s infinite}
    @keyframes livePulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.6}}

    /* Players list */
    .player-item{display:flex;align-items:center;gap:10px;padding:9px 10px;background:var(--bg3);border-radius:var(--r);border:1px solid var(--border)}
    .player-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;color:#000}
    .player-name{font-size:13px;font-weight:700;flex:1}
    .player-score{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--yellow)}
    .player-team-badge{font-family:var(--mono);font-size:9px;color:var(--text3);background:var(--bg4);padding:2px 7px;border-radius:99px}

    /* Teams leaderboard */
    .team-score-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg3);border-radius:var(--r);border:1px solid var(--border)}
    .team-rank{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--text3);width:24px;flex-shrink:0;text-align:center}
    .team-emoji{font-size:24px;flex-shrink:0}
    .team-name-sb{font-size:14px;font-weight:800;flex:1}
    .team-score-sb{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--yellow)}
    .team-bar-mini{height:4px;background:var(--bg4);border-radius:99px;margin-top:4px;overflow:hidden}
    .team-bar-fill{height:100%;border-radius:99px;background:var(--blue)}

    /* Answers feed */
    .answer-item{padding:9px 12px;background:var(--bg3);border-radius:var(--r);border-left:3px solid var(--border);font-size:12px;animation:answerIn .3s ease}
    @keyframes answerIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
    .answer-item.correct{border-left-color:var(--green)}
    .answer-item.wrong{border-left-color:var(--red)}
    .answer-who{font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:3px}

    /* Response stats */
    .resp-stats{background:var(--bg3);border-radius:var(--r);padding:12px;display:flex;gap:12px;justify-content:space-around;text-align:center}
    .resp-stat-num{font-family:var(--mono);font-size:20px;font-weight:700;display:block}
    .resp-stat-lbl{font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}

    /* ── LOBBY SCREEN ── */
    .lobby{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:50;padding:32px}
    .lobby.hidden{display:none}
    .lobby-title{font-size:clamp(22px,4vw,36px);font-weight:900;text-align:center;letter-spacing:-.5px}
    .lobby-pin-display{font-family:var(--mono);font-size:clamp(40px,8vw,80px);font-weight:700;color:var(--blue);letter-spacing:.3em;text-align:center}
    .lobby-url{font-family:var(--mono);font-size:14px;color:var(--text3);text-align:center}
    .lobby-players-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:700px;min-height:80px;align-items:center}
    .lobby-player-chip{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1.5px solid var(--border2);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:700;animation:chipIn .3s cubic-bezier(.16,1,.3,1)}
    @keyframes chipIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
    .lobby-teams{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
    .lobby-team-col{background:var(--bg2);border:1.5px solid var(--border2);border-radius:var(--r2);padding:14px 18px;min-width:140px;text-align:center}
    .lobby-team-emoji{font-size:28px;display:block;margin-bottom:6px}
    .lobby-team-name{font-size:13px;font-weight:800;margin-bottom:8px}
    .lobby-team-players{display:flex;flex-direction:column;gap:5px;min-height:40px}
    .lobby-team-player{font-size:11px;color:var(--text3);font-family:var(--mono)}

    /* ── LEADERBOARD OVERLAY ── */
    .leaderboard-overlay{position:absolute;inset:0;background:rgba(13,24,33,.97);display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:40;padding:32px}
    .leaderboard-overlay.show{display:flex;animation:fadeIn .3s ease}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .lb-title{font-size:28px;font-weight:900;letter-spacing:-.5px;margin-bottom:4px}
    .lb-subtitle{font-family:var(--mono);font-size:12px;color:var(--text3);margin-bottom:16px}
    .lb-podium{display:flex;align-items:flex-end;gap:16px;justify-content:center}
    .lb-place{display:flex;flex-direction:column;align-items:center;gap:8px}
    .lb-place-avatar{font-size:32px}
    .lb-place-name{font-size:14px;font-weight:800;text-align:center}
    .lb-place-score{font-family:var(--mono);font-size:13px;color:var(--yellow);font-weight:700}
    .lb-place-block{border-radius:8px 8px 0 0;width:90px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:rgba(0,0,0,.5)}

    @media(max-width:800px){.app{grid-template-columns:1fr}.sidebar{display:none}}
  </style>
</head>
<body>

<!-- LOBBY SCREEN -->
<div class="lobby" id="lobbyScreen">
  <div class="lesson-title-display" id="lobbyLessonTitle" style="font-size:clamp(16px,3vw,24px);font-weight:900;text-align:center;color:var(--text3);letter-spacing:.15em;text-transform:uppercase;font-family:var(--mono)">Открытый урок · Tagybasqa</div>
  <div class="lobby-title" id="lobbyTitleText">Ожидание участников...</div>
  <div class="lobby-pin-display" id="lobbyPin">— — — — — —</div>
  <div class="lobby-url">Заходите на <strong style="color:var(--blue)">tagybasqa.app/join</strong> и вводите PIN</div>

  <div class="lobby-teams" id="lobbyTeamsGrid"></div>
  <div class="lobby-players-grid" id="lobbyPlayerChips" style="margin-top:8px"></div>

  <div style="display:flex;gap:12px;margin-top:8px">
    <button class="nav-btn" onclick="addDemoPlayers()">+ Тест-игроки</button>
    <button class="nav-btn main" onclick="startLesson()" id="startLessonBtn">▶ Начать урок</button>
  </div>
</div>

<!-- LEADERBOARD OVERLAY -->
<div class="leaderboard-overlay" id="leaderboardOverlay">
  <div class="lb-title">🏆 Промежуточные результаты</div>
  <div class="lb-subtitle" id="lbSubtitle">После вопроса 1</div>
  <div class="lb-podium" id="lbPodium"></div>
  <button class="nav-btn main" onclick="closeLeaderboard()" style="margin-top:16px">Продолжить →</button>
</div>

<!-- MAIN APP -->
<div class="app" id="mainApp" style="display:none">

  <!-- STAGE -->
  <div class="stage">
    <!-- Top -->
    <div class="stage-top">
      <button class="btn-sm" onclick="showLobby()">← Лобби</button>
      <div class="lesson-title-display" id="stageLessonTitle">Урок</div>
      <div class="timer-display" id="timerDisplay" style="display:none">—</div>
      <div class="pin-badge" id="stagePinBadge">PIN: ——</div>
      <button class="btn-sm btn-blue" onclick="showLeaderboard()">🏆 Итоги</button>
    </div>

    <!-- Progress -->
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>

    <!-- Slide area -->
    <div class="slide-area" id="slideArea">
      <div class="slide-card" id="slideCard">
        <span class="slide-num-pill">Загрузка...</span>
      </div>
    </div>

    <!-- Nav -->
    <div class="nav-row">
      <button class="nav-btn" onclick="prevSlide()" id="prevBtn" disabled>← Назад</button>
      <div class="slide-counter" id="slideCounter">1 / 1</div>
      <button class="nav-btn main" onclick="nextSlide()" id="nextBtn">Далее →</button>
      <div class="action-row">
        <button class="reveal-btn" id="revealBtn" onclick="revealAnswer()" style="display:none">✓ Показать ответ</button>
        <button class="btn-sm" onclick="startTimer()" id="timerBtn" style="display:none">⏱ Таймер</button>
      </div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="pin-join-card">
        <div class="pin-join-label">PIN для входа</div>
        <div class="pin-join-code" id="sidebarPin">——</div>
        <div class="pin-join-url">tagybasqa.app/join</div>
        <div class="players-count-badge">
          <div class="live-dot"></div>
          <span id="playersCountLabel">0 участников</span>
        </div>
      </div>
    </div>

    <div class="sidebar-tabs">
      <button class="sidebar-tab active" data-panel="players" onclick="switchPanel('players')">Участники</button>
      <button class="sidebar-tab" data-panel="teams" onclick="switchPanel('teams')">Команды</button>
      <button class="sidebar-tab" data-panel="answers" onclick="switchPanel('answers')">Ответы</button>
    </div>

    <!-- PLAYERS PANEL -->
    <div class="sidebar-panel active" id="panel-players">
      <div class="resp-stats" id="respStats">
        <div><span class="resp-stat-num" id="statAnswered">0</span><span class="resp-stat-lbl">Ответили</span></div>
        <div><span class="resp-stat-num" id="statCorrect" style="color:var(--green)">0</span><span class="resp-stat-lbl">Верно</span></div>
        <div><span class="resp-stat-num" id="statWaiting" style="color:var(--orange)">0</span><span class="resp-stat-lbl">Ждут</span></div>
      </div>
      <div id="playersList" style="display:flex;flex-direction:column;gap:6px"></div>
    </div>

    <!-- TEAMS PANEL -->
    <div class="sidebar-panel" id="panel-teams">
      <div id="teamsLeaderboard" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>

    <!-- ANSWERS PANEL -->
    <div class="sidebar-panel" id="panel-answers">
      <div style="font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px">Поступающие ответы</div>
      <div id="answersFeed" style="display:flex;flex-direction:column;gap:6px"></div>
    </div>
  </div>

</div>

<script>
// ── STATE ──
const params = new URLSearchParams(window.location.search);
let lessonData = null;
let blocks = [];
let currentSlide = 0;
let pin = '';
let players = [];
let teams = [];
let scores = {};
let teamScores = {};
let answerRevealed = false;
let timerInterval = null;
let timerSeconds = 0;
let lessonSettings = {};

const TEAM_COLORS = ['#1cb0f6','#ff4b4b','#57cc02','#ffd900','#ff9600','#ce82ff'];
const DEMO_NAMES = ['Алия','Дамир','Нурлан','Айгерим','Арман','Жанар','Берік','Мадина','Тимур','Сабина','Ерлан','Камила'];

// ── INIT ──
window.addEventListener('load', () => {
  // Parse lesson data from URL or use demo
  try {
    const dataParam = params.get('data');
    if (dataParam) {
      lessonData = JSON.parse(decodeURIComponent(dataParam));
      blocks = lessonData.blocks || [];
    }
  } catch(e) {}

  // Demo data if no real data
  if (!blocks.length) {
    blocks = getDemoBlocks();
    lessonData = { title: 'Python: Функции и ООП', emoji: '🐍' };
  }

  pin = params.get('pin') || generatePin();
  lessonSettings = { timer: 30, showLeaderboard: true };

  // Parse teams from settings
  teams = [
    { emoji: '🔵', name: 'Альфа', color: TEAM_COLORS[0] },
    { emoji: '🔴', name: 'Бета',  color: TEAM_COLORS[1] },
    { emoji: '🟢', name: 'Гамма', color: TEAM_COLORS[2] },
  ];

  teams.forEach(t => { teamScores[t.name] = 0; });

  renderLobby();
});

function getDemoBlocks() {
  return [
    { type:'slide', slideTitle:'Открытый урок: Python', slideBody:'Сегодня мы разберём функции, ООП и алгоритмы. Готовы? 🚀', slideLayout:'center' },
    { type:'quiz', questions:[{type:'mcq',q:'Что делает функция print() в Python?',options:['Считывает данные','Выводит текст на экран','Создаёт переменную','Удаляет объект'],answer:1}] },
    { type:'poll', question:'Как вы оцениваете свой уровень Python?', pollOptions:['Новичок','Знаю основы','Средний уровень','Продвинутый'] },
    { type:'slide', slideTitle:'def — объявление функции', slideBody:'def имя_функции(параметры):\n    тело функции\n    return результат', slideLayout:'left' },
    { type:'code', lang:'python', code:'def greet(name):\n    return f"Привет, {name}!"\n\nprint(greet("Python"))' },
    { type:'task', taskText:'Напишите функцию square(n), которая возвращает квадрат числа', answer:'def square(n): return n**2' },
    { type:'quiz', questions:[{type:'mcq',q:'Что вернёт square(4)?',options:['8','16','4','12'],answer:1},{type:'fill',q:'Как создать класс в Python?',answer:'class'}] },
  ];
}

// ── LOBBY ──
function renderLobby() {
  const title = lessonData?.title || 'Открытый урок';
  document.getElementById('lobbyTitleText').textContent = title;
  document.getElementById('lobbyLessonTitle').textContent = (lessonData?.emoji||'📖') + ' ' + title;
  document.getElementById('lobbyPin').textContent = pin.split('').join(' ');
  document.getElementById('stagePinBadge').textContent = 'PIN: ' + pin;
  document.getElementById('sidebarPin').textContent = pin;
  document.getElementById('stageLessonTitle').textContent = title;

  // Teams
  const teamsGrid = document.getElementById('lobbyTeamsGrid');
  teamsGrid.innerHTML = teams.map(t => `
    <div class="lobby-team-col">
      <span class="lobby-team-emoji">${t.emoji}</span>
      <div class="lobby-team-name">${escHtml(t.name)}</div>
      <div class="lobby-team-players" id="lobbyTeam_${escHtml(t.name)}">
        <span class="lobby-team-player" style="opacity:.4">Ожидание...</span>
      </div>
    </div>
  `).join('');
}

function addDemoPlayers() {
  const count = Math.floor(Math.random()*4)+3;
  for (let i=0; i<count; i++) {
    const name = DEMO_NAMES[Math.floor(Math.random()*DEMO_NAMES.length)];
    if (!players.find(p=>p.name===name)) {
      const team = teams[Math.floor(Math.random()*teams.length)];
      addPlayer({ name, team: team.name, emoji: randomEmoji(), score: 0 });
    }
  }
}

function addPlayer(player) {
  if (players.find(p=>p.name===player.name)) return;
  players.push(player);
  scores[player.name] = 0;
  renderLobbyPlayers();
  updatePlayersCount();
}

function renderLobbyPlayers() {
  const chips = document.getElementById('lobbyPlayerChips');
  chips.innerHTML = players.map(p => `
    <div class="lobby-player-chip">
      <span>${p.emoji}</span>
      <span>${escHtml(p.name)}</span>
      <span style="font-family:var(--mono);font-size:10px;color:var(--text3)">${escHtml(p.team||'')}</span>
    </div>
  `).join('');

  // Update team cols
  teams.forEach(t => {
    const col = document.getElementById('lobbyTeam_'+t.name);
    if (!col) return;
    const tp = players.filter(p=>p.team===t.name);
    col.innerHTML = tp.length ? tp.map(p=>`<span class="lobby-team-player">${p.emoji} ${escHtml(p.name)}</span>`).join('') : '<span class="lobby-team-player" style="opacity:.4">Ожидание...</span>';
  });
}

function updatePlayersCount() {
  document.getElementById('playersCountLabel').textContent = players.length + ' участников';
  renderPlayersPanel();
  renderTeamsPanel();
}

// ── START ──
function startLesson() {
  document.getElementById('lobbyScreen').classList.add('hidden');
  document.getElementById('mainApp').style.display = 'grid';
  renderSlide(0);
  updateProgress();
  renderPlayersPanel();
  renderTeamsPanel();
}

function showLobby() {
  document.getElementById('lobbyScreen').classList.remove('hidden');
  document.getElementById('mainApp').style.display = 'none';
  stopTimer();
}

// ── SLIDE NAVIGATION ──
function renderSlide(idx) {
  currentSlide = idx;
  answerRevealed = false;
  clearAnswersFeed();
  stopTimer();

  const block = blocks[idx];
  if (!block) return;

  const card = document.getElementById('slideCard');
  card.innerHTML = buildSlideHTML(block, idx);
  card.style.animation='none'; card.offsetHeight; card.style.animation='';

  document.getElementById('prevBtn').disabled = (idx===0);
  document.getElementById('nextBtn').disabled = (idx===blocks.length-1);
  document.getElementById('nextBtn').textContent = (idx===blocks.length-1) ? '🏁 Финиш' : 'Далее →';
  document.getElementById('slideCounter').textContent = `${idx+1} / ${blocks.length}`;

  const isInteractive = ['quiz','poll','task'].includes(block.type);
  document.getElementById('revealBtn').style.display = isInteractive ? 'flex' : 'none';
  document.getElementById('timerBtn').style.display = isInteractive ? 'flex' : 'none';
  document.getElementById('revealBtn').textContent = '✓ Показать ответ';

  updateProgress();

  // Simulate incoming answers for interactive blocks
  if (isInteractive && players.length) {
    simulateAnswers(block);
  }
}

function buildSlideHTML(block, idx) {
  const num = `<span class="slide-num-pill">Слайд ${idx+1} из ${blocks.length}</span>`;
  switch (block.type) {
    case 'slide': return `
      ${num}
      ${block.slideTitle ? `<div class="slide-main-title">${escHtml(block.slideTitle)}</div>` : ''}
      ${block.slideBody ? `<div class="slide-body-text" style="white-space:pre-line">${escHtml(block.slideBody)}</div>` : ''}`;

    case 'heading': return `${num}<div class="slide-main-title">${escHtml(block.content||'')}</div>`;
    case 'subheading': return `${num}<div class="slide-body-text" style="font-size:22px;font-weight:800">${escHtml(block.content||'')}</div>`;
    case 'text': return `${num}<div class="slide-body-text" style="font-size:18px">${escHtml(block.content||'')}</div>`;

    case 'callout': {
      const em={info:'ℹ️',warning:'⚠️',success:'✅',danger:'❗'};
      const ct=block.calloutType||'info';
      return `${num}<div class="slide-callout ${ct}"><span style="font-size:36px">${em[ct]}</span><div class="slide-body-text">${escHtml(block.content||'')}</div></div>`;
    }

    case 'code': return `
      ${num}
      <div class="slide-main-title" style="font-size:20px">💻 Блок кода — ${block.lang||'python'}</div>
      <div class="slide-code-block">${syntaxHighlight(escHtml(block.code||''))}</div>`;

    case 'image': return `
      ${num}
      <div style="text-align:center"><img src="${escHtml(block.url||'')}" style="max-width:100%;max-height:420px;border-radius:var(--r2)" onerror="this.style.display='none'"></div>
      ${block.caption ? `<div style="text-align:center;font-family:var(--mono);font-size:12px;color:var(--text3);margin-top:8px">${escHtml(block.caption)}</div>` : ''}`;

    case 'video': {
      const ytId=block.url?.match(/(?:v=|youtu\.be\/)([^&?/]+)/)?.[1];
      return `${num}<div style="text-align:center">${ytId?`<iframe style="width:100%;max-width:700px;height:360px;border-radius:var(--r2);border:none" src="https://www.youtube.com/embed/${ytId}?autoplay=0" allowfullscreen></iframe>`:'<div style="color:var(--text3)">Видео недоступно</div>'}</div>`;
    }

    case 'quiz': {
      const qs = block.questions||[];
      if (!qs.length) return `${num}<div class="slide-main-title">❓ Вопрос</div>`;
      const q = qs[0]; // show first question
      const letters = ['A','B','C','D','E','F'];
      return `
        ${num}
        <div class="quiz-slide-q">❓ ${escHtml(q.q||'Вопрос')}</div>
        ${q.type==='fill' ? `<div style="background:var(--bg3);border:2px dashed var(--border2);border-radius:var(--r);padding:20px;text-align:center;font-family:var(--mono);font-size:16px;color:var(--text3)">Студенты вводят ответ на своих устройствах</div>`
        : `<div class="quiz-options-grid">${(q.options||[]).map((o,i)=>`<button class="quiz-opt-btn" id="opt_${i}" onclick="revealOption(${i},${q.answer})"><div class="opt-letter">${letters[i]}</div>${escHtml(o)}</button>`).join('')}</div>`}
        ${qs.length>1?`<div style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:14px;text-align:right">+${qs.length-1} ещё вопросов в этом блоке</div>`:''}`;
    }

    case 'poll': {
      const opts = block.pollOptions||[];
      const barData = opts.map(o=>({label:o,pct:Math.floor(Math.random()*60)+5}));
      return `
        ${num}
        <div class="quiz-slide-q">🗳 ${escHtml(block.question||'Голосование')}</div>
        <div class="poll-bars" id="pollBars">
          ${barData.map((d,i)=>`<div class="poll-bar-row"><div class="poll-bar-label">${escHtml(d.label)}</div><div class="poll-bar-track"><div class="poll-bar-fill" style="width:0%" id="pollBar_${i}"></div></div><div class="poll-bar-pct" id="pollPct_${i}">0%</div></div>`).join('')}
        </div>`;
    }

    case 'task': return `
      ${num}
      <div class="slide-main-title" style="font-size:20px">✏️ Практическое задание</div>
      <div class="slide-body-text" style="font-size:16px;margin-top:16px">${escHtml(block.taskText||'')}</div>
      <div style="background:var(--bg3);border:2px dashed var(--border2);border-radius:var(--r);padding:20px;text-align:center;font-family:var(--mono);font-size:13px;color:var(--text3);margin-top:20px">Студенты пишут ответ на своих устройствах</div>
      <div id="taskAnswerReveal" style="display:none;margin-top:16px;background:rgba(87,204,2,.1);border:1.5px solid rgba(87,204,2,.3);border-radius:var(--r);padding:14px;font-family:var(--mono);font-size:14px;color:var(--green)">✓ Правильный ответ: ${escHtml(block.answer||'—')}</div>`;

    default: return `${num}<div class="slide-main-title">${getTypeLabel(block.type)}</div>`;
  }
}

function revealOption(clicked, correct) {
  document.querySelectorAll('.quiz-opt-btn').forEach((btn,i) => {
    btn.disabled = true;
    if (i===correct) btn.classList.add('revealed-correct');
    else if (i===clicked) btn.classList.add('revealed-wrong');
  });
  answerRevealed = true;
}

function revealAnswer() {
  const block = blocks[currentSlide];
  if (!block) return;
  if (block.type==='quiz') {
    const q = block.questions?.[0];
    if (q?.type==='mcq') revealOption(q.answer, q.answer);
    else if (q?.type==='fill') {
      const el = document.querySelector('.quiz-opt-btn') || document.getElementById('slideCard');
      if (el) el.insertAdjacentHTML('beforeend',`<div style="background:rgba(87,204,2,.1);border:1.5px solid rgba(87,204,2,.3);border-radius:var(--r);padding:12px;font-family:var(--mono);font-size:15px;color:var(--green);margin-top:14px">✓ Ответ: ${escHtml(q.answer)}</div>`);
    }
  } else if (block.type==='task') {
    const el = document.getElementById('taskAnswerReveal');
    if (el) el.style.display='block';
  } else if (block.type==='poll') {
    // Animate poll bars
    const opts = block.pollOptions||[];
    const totals = opts.map(()=>Math.floor(Math.random()*40)+5);
    const total = totals.reduce((a,b)=>a+b,0);
    opts.forEach((_,i)=>{
      const pct = Math.round(totals[i]/total*100);
      setTimeout(()=>{
        const bar=document.getElementById('pollBar_'+i);
        const pctEl=document.getElementById('pollPct_'+i);
        if (bar) bar.style.width=pct+'%';
        if (pctEl) pctEl.textContent=pct+'%';
      },i*120);
    });
  }
  answerRevealed = true;
  document.getElementById('revealBtn').textContent='✅ Показано';
  document.getElementById('revealBtn').style.opacity='.5';
}

function nextSlide() {
  if (currentSlide>=blocks.length-1) {
    showLeaderboard();
    return;
  }
  if (lessonSettings.showLeaderboard && (currentSlide+1)%3===0) {
    showLeaderboard();
  } else {
    renderSlide(currentSlide+1);
  }
}

function prevSlide() {
  if (currentSlide>0) renderSlide(currentSlide-1);
}

function updateProgress() {
  const pct = blocks.length>1 ? (currentSlide/(blocks.length-1))*100 : 100;
  document.getElementById('progressFill').style.width = pct+'%';
}

// ── TIMER ──
function startTimer() {
  stopTimer();
  timerSeconds = lessonSettings.timer || 30;
  const el = document.getElementById('timerDisplay');
  el.style.display='block';
  el.textContent = timerSeconds;
  el.className = 'timer-display';
  timerInterval = setInterval(()=>{
    timerSeconds--;
    el.textContent = timerSeconds;
    if (timerSeconds<=5) el.className='timer-display urgent';
    if (timerSeconds<=0) { stopTimer(); revealAnswer(); }
  },1000);
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval=null; }
  document.getElementById('timerDisplay').style.display='none';
}

// ── LEADERBOARD ──
function showLeaderboard() {
  const overlay = document.getElementById('leaderboardOverlay');
  overlay.classList.add('show');
  document.getElementById('lbSubtitle').textContent = `После слайда ${currentSlide+1}`;
  renderLeaderboardPodium();
}
function closeLeaderboard() {
  document.getElementById('leaderboardOverlay').classList.remove('show');
  if (currentSlide<blocks.length-1) renderSlide(currentSlide+1);
}
function renderLeaderboardPodium() {
  // Sort teams by score
  const sorted = [...teams].sort((a,b)=>(teamScores[b.name]||0)-(teamScores[a.name]||0));
  const places = sorted.slice(0,3);
  const medals = ['🥇','🥈','🥉'];
  const heights = [140,110,90];
  const order = places.length>=3 ? [1,0,2] : [0,1,2];

  document.getElementById('lbPodium').innerHTML = order.slice(0,places.length).map(pi => {
    const t=places[pi];
    if (!t) return '';
    return `<div class="lb-place">
      <div class="lb-place-avatar">${t.emoji}</div>
      <div class="lb-place-name">${escHtml(t.name)}</div>
      <div class="lb-place-score">${teamScores[t.name]||0} очков</div>
      <div class="lb-place-block" style="height:${heights[pi]||80}px;background:${t.color||'var(--bg3)'}30;border:1.5px solid ${t.color||'var(--border2)'}40">${medals[pi]||pi+1}</div>
    </div>`;
  }).join('');
}

// ── PANELS ──
function switchPanel(id) {
  document.querySelectorAll('.sidebar-tab').forEach(t=>t.classList.toggle('active',t.dataset.panel===id));
  document.querySelectorAll('.sidebar-panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+id));
}

function renderPlayersPanel() {
  const list = document.getElementById('playersList');
  const sorted = [...players].sort((a,b)=>(scores[b.name]||0)-(scores[a.name]||0));
  list.innerHTML = sorted.map((p,i) => `
    <div class="player-item">
      <div class="player-avatar" style="background:${getTeamColor(p.team)}">${p.emoji}</div>
      <div style="flex:1"><div class="player-name">${escHtml(p.name)}</div><div class="player-team-badge">${escHtml(p.team||'')}</div></div>
      <div class="player-score">${scores[p.name]||0}</div>
    </div>
  `).join('') || '<div style="font-family:var(--mono);font-size:12px;color:var(--text3);text-align:center;padding:24px">Нет участников</div>';
}

function renderTeamsPanel() {
  const sorted = [...teams].sort((a,b)=>(teamScores[b.name]||0)-(teamScores[a.name]||0));
  const maxScore = Math.max(1,...Object.values(teamScores));
  document.getElementById('teamsLeaderboard').innerHTML = sorted.map((t,i) => {
    const score = teamScores[t.name]||0;
    const pct = Math.round(score/maxScore*100);
    const tp = players.filter(p=>p.team===t.name);
    return `<div class="team-score-row">
      <div class="team-rank">${['🥇','🥈','🥉'][i]||i+1}</div>
      <div class="team-emoji">${t.emoji}</div>
      <div style="flex:1">
        <div class="team-name-sb">${escHtml(t.name)}</div>
        <div style="font-family:var(--mono);font-size:10px;color:var(--text3)">${tp.length} участников</div>
        <div class="team-bar-mini"><div class="team-bar-fill" style="width:${pct}%;background:${t.color}"></div></div>
      </div>
      <div class="team-score-sb">${score}</div>
    </div>`;
  }).join('');
}

// ── SIMULATE ANSWERS (demo) ──
function simulateAnswers(block) {
  const feed = document.getElementById('answersFeed');
  let answered=0, correct=0;

  const delay = players.length ? 1200 : 0;
  if (!players.length) return;

  players.forEach((p,i) => {
    setTimeout(()=>{
      const isCorrect = Math.random()>.35;
      answered++;
      if (isCorrect) {
        correct++;
        const pts = 10 + Math.floor((players.length-i)*2);
        scores[p.name]=(scores[p.name]||0)+pts;
        teamScores[p.team]=(teamScores[p.team]||0)+pts;
      }

      // Update stats
      document.getElementById('statAnswered').textContent=answered;
      document.getElementById('statCorrect').textContent=correct;
      document.getElementById('statWaiting').textContent=players.length-answered;

      // Answer feed entry
      const entry=document.createElement('div');
      entry.className='answer-item '+(isCorrect?'correct':'wrong');
      entry.innerHTML=`<div class="answer-who">${p.emoji} ${escHtml(p.name)} · ${escHtml(p.team)}</div><div>${isCorrect?'✓ Верно':'✗ Неверно'}</div>`;
      feed.insertBefore(entry,feed.firstChild);
      if (feed.children.length>10) feed.lastChild.remove();

      renderPlayersPanel();
      renderTeamsPanel();
    }, delay + i*400 + Math.random()*600);
  });
}

function clearAnswersFeed() {
  document.getElementById('answersFeed').innerHTML='';
  document.getElementById('statAnswered').textContent='0';
  document.getElementById('statCorrect').textContent='0';
  document.getElementById('statWaiting').textContent=players.length;
}

// ── UTILS ──
function generatePin() { return String(Math.floor(100000+Math.random()*900000)); }
function randomEmoji() { return ['😊','🦊','🐼','🦁','🐸','🦄','🐧','🦋','🦅','🦩'][Math.floor(Math.random()*10)]; }
function getTeamColor(name) { const t=teams.find(t=>t.name===name); return t?.color||'#888'; }
function getTypeLabel(type) { const m={heading:'Заголовок',text:'Текст',code:'Код',quiz:'Вопрос',task:'Задание',poll:'Голосование',slide:'Слайд',callout:'Подсказка',image:'Изображение',video:'Видео'}; return m[type]||type; }
function escHtml(str) { return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function syntaxHighlight(code) {
  return code
    .replace(/(def|class|return|if|else|elif|for|while|import|from|as|in|not|and|or|True|False|None|lambda|with|try|except|finally|pass|break|continue)/g,'<span class="code-kw">$1</span>')
    .replace(/(print|len|range|input|int|str|float|list|dict|set|type|super|__init__|self)/g,'<span class="code-fn">$1</span>')
    .replace(/(["'])(?:(?=(\\?))\2.)*?\1/g,'<span class="code-str">$&</span>')
    .replace(/(#.*)/g,'<span class="code-cmt">$1</span>');
}
