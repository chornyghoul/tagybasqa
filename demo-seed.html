// ── SEED FUNCTIONS ─────────────────────────────────────────
window.runSeed = async function() {
  const btn = document.getElementById('seedBtn');
  btn.disabled = true;
  setStatus('running','Создание курса...');
  log('▶ Начинаем создание демо-курса...','info');

  try {
    // Anon auth if needed
    if (!user) {
      log('→ Анонимная авторизация...','info');
      await signInAnonymously(auth);
      await new Promise(r => setTimeout(r, 800));
    }

    log('→ Проверяем существующие курсы...','info');

    // Check if demo already exists
    const existing = await getDocs(query(collection(db,'courses'),where('title','==',DEMO_COURSE.title)));
    if (!existing.empty) {
      createdCourseId = existing.docs[0].id;
      log(`✓ Курс уже существует (ID: ${createdCourseId.slice(0,8)}...)`, 'ok');
    } else {
      log('→ Сохраняем курс в Firestore...','info');
      const courseData = {
        ...DEMO_COURSE,
        uid: user.uid,
        userName: 'Tagybasqa Team',
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp(),
      };
      const ref = await addDoc(collection(db,'courses'), courseData);
      createdCourseId = ref.id;
      log(`✓ Курс создан! ID: ${createdCourseId.slice(0,8)}...`, 'ok');
    }

    log(`\n📚 КУРС: "${DEMO_COURSE.title}"`, 'ok');
    log(`   Модулей: ${DEMO_COURSE.modules.length}`, 'ok');
    log(`   Уроков: ${DEMO_COURSE.modules.reduce((s,m)=>s+m.lessons.length,0)}`, 'ok');
    log(`   Ссылка: /course.html?id=${createdCourseId}`, 'ok');
    log('', '');

    document.getElementById('lessonBtn').disabled = false;
    setStatus('done','Курс создан!');
    btn.textContent = '✓ Курс создан';

  } catch(err) {
    log('✗ Ошибка: '+err.message,'err');
    setStatus('error','Ошибка: '+err.message.slice(0,40));
    btn.disabled = false;
  }
};

window.runDemoLesson = async function() {
  const btn = document.getElementById('lessonBtn');
  btn.disabled = true;
  setStatus('running','Создание урока...');
  log('▶ Создаём интерактивный демо-урок...','info');

  try {
    const existing = await getDocs(query(collection(db,'interactiveLessons'),where('title','==',DEMO_INTERACTIVE_LESSON.title)));
    if (!existing.empty) {
      createdLessonId = existing.docs[0].id;
      log(`✓ Урок уже существует (ID: ${createdLessonId.slice(0,8)}...)`, 'ok');
    } else {
      const lessonData = {
        ...DEMO_INTERACTIVE_LESSON,
        uid: user.uid,
        userName: 'Tagybasqa Team',
        createdAt: serverTimestamp(),
        blocksCount: DEMO_INTERACTIVE_LESSON.blocks.length,
        quizCount: DEMO_INTERACTIVE_LESSON.blocks.filter(b=>b.type==='quiz').reduce((s,b)=>s+(b.questions?.length||0),0),
      };
      const ref = await addDoc(collection(db,'interactiveLessons'), lessonData);
      createdLessonId = ref.id;
      log(`✓ Урок создан! ID: ${createdLessonId.slice(0,8)}...`,'ok');

    log(`\n📖 УРОК: "${DEMO_INTERACTIVE_LESSON.title}"`,'ok');

    log(`   Ссылка: /lesson.html?id=${createdLessonId}`,'ok');

    document.getElementById('openBtn').disabled = false;
    setStatus('done','Урок создан!');

  } catch(err) {
    log('✗ Ошибка: '+err.message,'err');
    setStatus('error','Ошибка');
    btn.disabled = false;
  }
};
