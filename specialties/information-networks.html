<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Информационные сети и системы связи</title>
       <link rel="stylesheet" href="../static/css/styles.css"><link rel="stylesheet" href="../static/css/courses.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
     <header class="site-header hero-header">  
    <div class="header-inner">
      <nav class="hero-header__nav">
        <a href="index.html" class="logo">LearnPlay</a>
        <a class="hero-header__link" href="../index.html">Главная</a>
        <a class="hero-header__link active" href="topics/index.html">Спецальности</a>
        <a class="hero-header__link" href="games/index.html">Игры</a>
        <a class="hero-header__link" href="tests/index.html">Тесты</a>
        <a class="hero-header__link" href="presentations/index.html">Презентации</a>
      </nav>

        <div class="hero-header__actions">
          <a class="hero-header__cabinet" href="profile/index.html" data-auth="true"><i class="fa fa-user"  ></i></a>
          
        </div>
    </div>
  </header>

    <main>
        <div class="container">
            <div class="breadcrumb">
                <a href="index.html">Главная</a>
                <span>/</span>
                <span>Информационные сети и системы связи</span>
            </div>

            <div class="page-header">
                <h1 class="page-title">Информационные сети и системы связи</h1>
                <p class="page-description">Освойте проектирование, настройку и администрирование современных сетевых инфраструктур</p>
            </div>

            <section class="courses-section">
                <div class="courses-grid">
                    <!-- Курсы будут добавлены через JavaScript -->
                </div>
            </section>
        </div>
    </main>

    <!-- Модальное окно обучения -->
    <div id="learningModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-header-top">
                    <h2 class="modal-title">Название курса</h2>
                    <button class="close-modal" onclick="closeModal()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" style="width: 0%"></div>
                </div>
                <div class="lesson-info">
                    <span>Урок 1 из 7</span>
                    <span>0%</span>
                </div>
            </div>

            <div class="modal-body">
                <div class="lessons-container">
                    <!-- Уроки добавляются динамически через JavaScript -->
                </div>

                <div class="completion-screen">
                    <!-- Экран завершения добавляется динамически -->
                </div>
            </div>

            <div class="modal-footer">
                <button id="prevBtn" class="btn btn-secondary" onclick="prevLesson()" style="display: none;">
                    <i class="fas fa-arrow-left"></i> Предыдущий
                </button>
                <button id="nextBtn" class="btn" onclick="nextLesson()" disabled>
                    <i class="fas fa-arrow-right"></i> Следующий урок
                </button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 EduPlatform. Все права защищены.</p>
        </div>
    </footer>

    <script src="../static/js/script.js"></script>
</body>
</html>
