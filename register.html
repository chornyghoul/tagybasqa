<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход и Регистрация</title>
    <style>
        @font-face {
            font-family: 'Alverd';
            src: local('Alverd'), url('../fonts/alverd.woff2') format('woff2'), url('../fonts/alverd.woff') format('woff');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap
        }

        :root {
            --bg: #F8F5FF;
            --card: #FFF;
            --border: #C6A5F9;
            --border-light: #C6A5F944;
            --text: #0D0425;
            --muted: #5E5CE7;
            --primary: #C6A5F9;
            --primary-600: #5E5CE7;
            --secondary: #F8F5FF;
            --accent: #C6A5F9;
            --gradient-start: #C6A5F9;
            --gradient-mid: #5E5CE7;
            --gradient-end: #0D0425;
            --white: #FFF;
            --dark: #0D0425;
            --error: #e74c3c
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: url(./static/img/ezgifcom-gif-maker-e.gif) center/cover no-repeat;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 480px;
            padding: 48px 40px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
        }

        .auth-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 36px;
            color: var(--text);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 10px;
            color: #444;
        }

        .form-input {
            width: 100%;
            padding: 14px 0;
            font-size: 1.05rem;
            border: none;
            border-bottom: 2px solid var(--border);
            background: transparent;
            transition: border-color 0.3s ease;
        }

        .form-input::placeholder {
            color: #aaa;
        }

        .form-input:focus {
            outline: none;
            border-bottom-color: var(--primary);
        }

        .role-selector {
            display: flex;
            gap: 16px;
            margin-bottom: 36px;
        }

        .role-btn {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--card);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .role-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 16px;
            font-size: 1.05rem;
            font-weight: 600;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 14px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background: #b389f0;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background: #f3e8ff;
            transform: translateY(-1px);
        }

        .form-container {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .form-container.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .spinner {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 10;
        }

        @keyframes spin {
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .form-container.loading {
            pointer-events: none;
            opacity: 0.6;
        }

        .form-container.loading .spinner {
            display: block;
        }

        .success-message {
            text-align: center;
            padding: 20px;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: 500;
        }

        #loginMessage {
            min-height: 30px;
            margin-bottom: 16px;
        }

        @media (max-width: 480px) {
            .auth-wrapper {
                padding: 36px 24px;
            }

            .auth-title {
                font-size: 1.75rem;
            }
        }
    </style>
</head>

<body>
