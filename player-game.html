<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Игра — Tagybasqa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Onest:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a; --bg2: #111111; --bg3: #181818; --bg4: #202020;
            --border: rgba(255,255,255,.07); --border2: rgba(255,255,255,.12); --border3: rgba(255,255,255,.22);
            --text: #f5f5f0; --text2: #888880; --text3: #444440;
            --accent: #f5f5f0; --accent-dim: rgba(245,245,240,.06);
            --red: #ef4444; --red-bg: rgba(239,68,68,.08);
            --green: #4ade80; --gold: #fbbf24;
            --btn-blue: #3b82f6; --btn-yellow: #eab308; /* Дополнительные цвета для кнопок */
            --r: 3px; --r2: 5px;
            --font: 'Onest', sans-serif; --mono: 'DM Mono', monospace;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font); background: var(--bg); color: var(--text);
            min-height: 100vh; line-height: 1.5; -webkit-font-smoothing: antialiased;
            display: flex; flex-direction: column; overflow: hidden; /* Без скролла на мобильных */
        }

        .screen { display: none; flex: 1; flex-direction: column; width: 100%; height: 100vh; }
        .screen.active { display: flex; animation: fadeUpSmooth 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes fadeUpSmooth {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ─── ЭКРАН ОЖИДАНИЯ / ЛОББИ ─── */
        .center-content {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            padding: 24px;
        }
        
        .loader {
            width: 40px; height: 40px; border: 3px solid var(--border2);
            border-top-color: var(--text); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 24px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .status-title { font-size: 24px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.5px; }
        .status-sub { color: var(--text2); font-size: 14px; font-family: var(--mono); }
        
        .player-name-badge {
            background: var(--bg3); border: 1px solid var(--border2);
            padding: 10px 20px; border-radius: 99px; font-family: var(--font);
            font-size: 15px; font-weight: 600; margin-top: 32px;
            display: inline-flex; align-items: center; gap: 8px;
        }

        /* ─── ЭКРАН ИГРЫ (КНОПКИ) ─── */
        .game-header {
            padding: 24px 20px; text-align: center; border-bottom: 1px solid var(--border);
            background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(20px);
        }
        .question-counter {
            font-family: var(--mono); font-size: 11px; color: var(--text3);
            text-transform: uppercase; letter-spacing: 0.15em; display: block; margin-bottom: 8px;
        }
        .game-header-title { font-size: 18px; font-weight: 700; color: var(--text); }
        
        .answers-grid {
            flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
            gap: 12px; padding: 12px; background: var(--bg2);
        }
        
        .answer-btn {
            border: none; border-radius: 12px; cursor: pointer;
            box-shadow: 0 6px 0 rgba(0,0,0,0.4);
            transition: transform 0.1s, box-shadow 0.1s, filter 0.2s;
            display: flex; align-items: center; justify-content: center;
            outline: 1px solid rgba(255,255,255,0.1); outline-offset: -1px;
        }
        .answer-btn:active {
            transform: translateY(6px); box-shadow: 0 0 0 rgba(0,0,0,0.4);
        }
        
        .btn-red { background: var(--red); }
        .btn-blue { background: var(--btn-blue); }
        .btn-yellow { background: var(--btn-yellow); }
        .btn-green { background: var(--green); }

        .answer-btn svg {
            width: 56px; height: 56px; fill: #ffffff;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .leave-btn {
            background: transparent; color: var(--text3); border: none;
            font-family: var(--font); font-size: 13px; text-decoration: underline;
            margin-top: 48px; cursor: pointer; transition: color 0.15s;
        }
        .leave-btn:hover { color: var(--red); }

        .finish-btn {
            background: var(--text); color: var(--bg); border: none;
            padding: 12px 24px; font-family: var(--font); font-size: 14px; font-weight: 700;
            border-radius: var(--r2); cursor: pointer; transition: opacity 0.15s;
            text-decoration: none; display: inline-block; margin-top: 30px;
        }
        .finish-btn:hover { opacity: 0.9; }

    </style>
</head>
<body>

    <div id="screen-lobby" class="screen active">
        <div class="center-content">
            <div class="loader" id="lobbyLoader"></div>
            <div class="status-title" id="lobbyTitle">Подключение...</div>
            <div class="status-sub" id="lobbySub">Ищем сессию</div>
            <div class="player-name-badge" id="playerNameBadge" style="display: none;"></div>
            
            <button class="leave-btn" onclick="leaveGame()">Покинуть игру</button>
        </div>
    </div>

    <div id="screen-playing" class="screen">
        <div class="game-header">
            <span class="question-counter">Вопрос <span id="qNum">1</span></span>
            <div class="game-header-title">Выберите правильный ответ на экране</div>
        </div>
        
        <div class="answers-grid" id="answersGrid">
            <button class="answer-btn btn-red" onclick="submitAnswer(0)">
                <svg viewBox="0 0 24 24"><path d="M12 2L22 20H2L12 2Z"/></svg>
            </button>
            <button class="answer-btn btn-blue" onclick="submitAnswer(1)">
                <svg viewBox="0 0 24 24"><path d="M12 2L22 12L12 22L2 12L12 2Z"/></svg>
            </button>
            <button class="answer-btn btn-yellow" onclick="submitAnswer(2)">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
            </button>
            <button class="answer-btn btn-green" onclick="submitAnswer(3)">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
            </button>
        </div>

        <div id="waitNextMsg" class="center-content" style="display: none; background: var(--bg2);">
            <div class="loader" style="border-top-color: var(--green);"></div>
            <div class="status-title" style="color: var(--text);">Ответ принят!</div>
            <div class="status-sub">Ждём остальных игроков...</div>
        </div>
    </div>

    <div id="screen-finished" class="screen">
        <div class="center-content">
            <div style="font-size: 72px; margin-bottom: 16px; filter: drop-shadow(0 4px 12px rgba(251,191,36,0.3));">🏆</div>
            <div class="status-title">Игра завершена!</div>
            <div class="status-sub">Посмотрите свои результаты на экране ведущего</div>
            <button class="finish-btn" onclick="leaveGame()">Вернуться на главную</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, updateDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

        // КОНФИГУРАЦИЯ FIREBASE (Из вашего index.html)
        const firebaseConfig = {
            apiKey: "AIzaSyAywbSZkiReHjTq4oc46Kbw9iZ0iDHVTpY",
            authDomain: "pystart-dd2db.firebaseapp.com",
            projectId: "pystart-dd2db",
            storageBucket: "pystart-dd2db.firebasestorage.app",
            messagingSenderId: "9188811255",
            appId: "1:9188811255:web:6f7280f1f7f67b80d90ef2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Получаем ID сессии из URL или localStorage (сохраненного на главной)
        const urlParams = new URLSearchParams(window.location.search);
        let sessionId = urlParams.get('session') || localStorage.getItem('joinSessionId');

        if (!sessionId) {
            alert("ПИН-код или сессия недействительны.");
            window.location.href = './index.html';
        }

        let currentUser = null;
        let sessionRef = doc(db, "sessions", sessionId);
        let unsubscribe = null;
        let hasAnsweredCurrent = false;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // 1. АВТОРИЗАЦИЯ И ВХОД В ЛОББИ
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                
                // Достаем имя пользователя из кэша (как на главной)
                const cache = JSON.parse(localStorage.getItem('lastKnownProfile') || '{}');
                const pName = cache.name || user.email.split('@')[0];

                const badge = document.getElementById('playerNameBadge');
                badge.innerHTML = `<span style="font-size:18px;">😎</span> ${pName}`;
                badge.style.display = 'inline-flex';

                try {
                    // Добавляем игрока в объект players в документе сессии
                    await updateDoc(sessionRef, {
                        [`players.${currentUser.uid}`]: pName
                    });
                    
                    listenToSession();
                } catch (e) {
                    console.error("Ошибка входа:", e);
                    document.getElementById('lobbyLoader').style.display = 'none';
                    document.getElementById('lobbyTitle').textContent = 'Ошибка доступа';
                    document.getElementById('lobbySub').textContent = 'Сессия не существует или уже завершена';
                }
            } else {
                // Если не авторизован - на страницу входа
                window.location.href = './auth.html';
            }
        });

        // 2. ПРОСЛУШИВАНИЕ СТАТУСА ИГРЫ
        function listenToSession() {
            document.getElementById('lobbyTitle').textContent = 'Вы в игре!';
            document.getElementById('lobbySub').textContent = 'Смотрите на экран ведущего, скоро начнём...';

            unsubscribe = onSnapshot(sessionRef, (docSnap) => {
                if (!docSnap.exists()) {
                    alert("Хост закрыл сессию.");
                    window.location.href = './index.html';
                    return;
                }

                const data = docSnap.data();

                // Лобби
                if (data.status === 'waiting') {
                    showScreen('screen-lobby');
                } 
                // Идет игра
                else if (data.status === 'playing') {
                    showScreen('screen-playing');
                    document.getElementById('qNum').textContent = (data.currentQuestion + 1) || 1;
                    
                    // Если индекс вопроса изменился — сбрасываем интерфейс (возвращаем кнопки)
                    if (window.lastQuestionIndex !== data.currentQuestion) {
                        window.lastQuestionIndex = data.currentQuestion;
                        resetAnswerUI();
                    }
                } 
                // Конец игры
                else if (data.status === 'finished') {
                    showScreen('screen-finished');
                }
            });
        }

        // 3. ОТПРАВКА ОТВЕТА
        window.submitAnswer = async (answerIndex) => {
            if (hasAnsweredCurrent) return;
            hasAnsweredCurrent = true;

            // Скрываем кнопки, показываем экран ожидания следующего вопроса
            document.getElementById('answersGrid').style.display = 'none';
            document.getElementById('waitNextMsg').style.display = 'flex';

            try {
                // Записываем ответ игрока в объект answers внутри сессии
                // Структура: answers.0.uid_игрока = 2 (индекс ответа)
                await updateDoc(sessionRef, {
                    [`answers.${window.lastQuestionIndex}.${currentUser.uid}`]: answerIndex
                });
            } catch (err) {
                console.error("Не удалось отправить ответ:", err);
                resetAnswerUI(); // Если ошибка - возвращаем кнопки
                alert("Ошибка отправки ответа. Попробуйте еще раз.");
            }
        };

        // Возврат интерфейса кнопок при новом вопросе
        function resetAnswerUI() {
            hasAnsweredCurrent = false;
            document.getElementById('answersGrid').style.display = 'grid';
            document.getElementById('waitNextMsg').style.display = 'none';
        }

        // 4. ВЫХОД ИЗ ИГРЫ
        window.leaveGame = async () => {
            if (unsubscribe) unsubscribe();
            if (currentUser && sessionId) {
                try {
                    // Удаляем себя из списка игроков
                    await updateDoc(sessionRef, {
                        [`players.${currentUser.uid}`]: deleteField()
                    });
                } catch (e) { console.error(e); }
            }
            localStorage.removeItem('joinSessionId');
            window.location.href = './index.html';
        };

        // Подчищаем за собой при закрытии вкладки
        window.addEventListener('beforeunload', () => {
            if (currentUser && sessionId) {
                updateDoc(sessionRef, { [`players.${currentUser.uid}`]: deleteField() });
            }
        });
    </script>
</body>
</html>
