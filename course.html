<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Курс — Tagybasqa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg:#131f24; --bg2:#1a2d35; --bg3:#1f3540; --bg4:#243d4a;
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.12); --border3:rgba(255,255,255,.22);
  --text:#fff; --text2:#cdd8dd; --text3:#7a9aaa;
  --duo-blue:#1cb0f6; --duo-blue2:#0e86c0;
  --duo-green:#57cc02; --duo-green2:#3a8c01;
  --duo-orange:#ff9600; --duo-red:#ff4b4b;
  --duo-purple:#ce82ff; --duo-yellow:#ffd900; --duo-teal:#1fe0c0;
  --red:#ff4b4b; --green:#57cc02; --gold:#ffd900;
  --red-bg:rgba(255,75,75,.12); --green-bg:rgba(87,204,2,.12); --blue-bg:rgba(28,176,246,.12);
  --r:12px; --r2:16px; --r3:99px;
  --font:'Nunito',sans-serif; --mono:'DM Mono',monospace;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ── LAYOUT ── */
.app{display:grid;grid-template-columns:268px 1fr 300px;min-height:100vh}

/* ── LEFT SIDEBAR ── */
.sidebar-l{position:sticky;top:0;height:100vh;padding:24px 12px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--bg);overflow-y:auto}
.sidebar-l::-webkit-scrollbar{display:none}

.logo-container{margin-bottom:24px;padding:4px 10px}
.logo{font-size:22px;font-weight:900;color:var(--duo-blue);letter-spacing:-1px;line-height:1;text-decoration:none;display:block}
.logo-sub{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.15em;text-transform:uppercase;margin-top:3px;display:block}

.nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--r);border:none;background:transparent;color:var(--text3);font-family:var(--font);font-size:14px;font-weight:800;cursor:pointer;transition:all .15s;width:100%;text-align:left;text-decoration:none;margin-bottom:4px}
.nav-item svg{width:18px;height:18px;opacity:.5;transition:opacity .15s;flex-shrink:0}
.nav-item:hover{color:var(--text);background:var(--bg3)}
.nav-item:hover svg{opacity:1}

/* ── CURRICULUM ── */
.curriculum-container{display:flex;flex-direction:column;gap:16px;flex:1;overflow-y:auto;padding-bottom:12px}
.sb-module-title{font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;padding:0 12px;margin-bottom:4px;margin-top:4px}
.sb-lesson{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border-radius:var(--r);cursor:pointer;transition:all .15s;color:var(--text2)}
.sb-lesson:hover{background:var(--bg3);color:var(--text)}
.sb-lesson.active-reading{background:rgba(28,176,246,.12);color:var(--duo-blue);border-left:3px solid var(--duo-blue);border-radius:0 var(--r) var(--r) 0;padding-left:9px}
.sb-lesson-icon{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;background:var(--bg3);transition:all .2s;color:var(--text3)}
.sb-lesson-icon svg{width:10px;height:10px}
.sb-lesson-text{font-size:13px;font-weight:700;line-height:1.4;flex:1}
.sb-lesson.done .sb-lesson-icon{background:var(--duo-green);border-color:var(--duo-green);color:var(--bg)}
.sb-lesson.active-node .sb-lesson-icon{border-color:var(--duo-blue);color:var(--duo-blue)}
.sb-lesson.locked{opacity:.4;cursor:not-allowed}
.sb-lesson.locked:hover{background:transparent;color:var(--text2)}
.sb-module-test{border:1px solid rgba(255,217,0,.15);background:rgba(255,217,0,.03);border-radius:var(--r);margin-top:4px}
.sb-module-test:hover{background:rgba(255,217,0,.08);color:var(--gold)}
.sb-module-test .sb-lesson-icon{color:var(--gold);border-color:rgba(255,217,0,.3)}
.sb-module-test.active-reading{background:rgba(255,217,0,.15);border-left:3px solid var(--gold);color:var(--gold)}
.sb-module-test.done .sb-lesson-icon{background:var(--gold);border-color:var(--gold);color:var(--bg)}

/* ── MAIN ── */
.main{overflow-y:auto;position:relative;border-right:1px solid var(--border);display:flex;flex-direction:column}
.lesson-content-wrapper{padding:52px 60px;max-width:780px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;animation:fadeIn .35s ease}

/* ── COURSE INTRO ── */
.course-intro{margin-top:20px}
.course-emoji{font-size:56px;margin-bottom:20px;display:block;line-height:1}
.course-badge{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;color:var(--duo-blue);background:rgba(28,176,246,.12);border:1.5px solid rgba(28,176,246,.25);padding:3px 10px;border-radius:var(--r3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}
.course-title{font-size:34px;font-weight:900;margin-bottom:14px;line-height:1.2;letter-spacing:-.5px}
.course-sub{color:var(--text2);font-size:15px;margin-bottom:28px;line-height:1.7}
.course-outcomes{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);padding:20px 24px;margin-bottom:28px}
.course-outcomes-title{font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
.course-outcomes ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.course-outcomes li{font-size:13px;color:var(--text2);display:flex;align-items:flex-start;gap:10px}
.course-outcomes li::before{content:'✓';color:var(--duo-green);font-weight:900;flex-shrink:0;margin-top:1px}
.start-btn{display:inline-flex;align-items:center;gap:8px;background:var(--duo-blue);color:#fff;border:none;border-bottom:4px solid var(--duo-blue2);border-radius:var(--r3);padding:14px 36px;font-family:var(--font);font-size:16px;font-weight:900;cursor:pointer;transition:all .15s;text-decoration:none;margin-bottom:28px}
.start-btn:hover{filter:brightness(1.1)}
.start-btn:active{transform:translateY(3px);border-bottom-width:1px}
.start-btn.continue-btn{background:var(--duo-green);border-bottom-color:var(--duo-green2)}
.course-meta{display:flex;gap:24px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--text3);border-top:1px solid var(--border);padding-top:20px}
.course-meta-item{display:flex;align-items:center;gap:6px}
.course-meta-item svg{width:13px;height:13px;flex-shrink:0}
.course-meta-item b{color:var(--text2);font-weight:700}

/* ── STEP HEADER ── */
.step-header{display:flex;align-items:center;gap:12px;margin-bottom:24px;font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase}
.step-header svg{width:14px;height:14px;flex-shrink:0}
.step-progress-wrap{flex:1;height:6px;background:var(--bg3);border-radius:99px;overflow:hidden;max-width:220px}
.step-progress-fill{height:100%;border-radius:99px;transition:width .4s ease}

/* ── THEORY ── */
.lesson-title{font-size:28px;font-weight:900;line-height:1.3;margin-bottom:24px;letter-spacing:-.3px}
.theory-body{font-size:15px;color:var(--text2);line-height:1.85;flex:1;margin-bottom:36px}
.theory-body p{margin-bottom:14px}
.theory-body strong{color:var(--text);font-weight:800}
.theory-body em{color:var(--duo-yellow);font-style:normal;font-weight:700}

/* ── CODE BLOCK ── */
.code-block{background:#0d1921;border:1px solid rgba(255,255,255,.1);border-radius:var(--r);padding:18px 20px;margin:16px 0;font-family:var(--mono);font-size:13px;line-height:1.7;color:#c9e8ff;overflow-x:auto;position:relative}
.code-block .kw{color:#ce82ff}
.code-block .fn{color:#1cb0f6}
.code-block .str{color:#57cc02}
.code-block .num{color:#ffd900}
.code-block .cm{color:#5a7a8a;font-style:italic}
.code-label{font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}

/* ── QUIZ ── */
.quiz-q{font-size:22px;font-weight:900;line-height:1.35;margin-bottom:24px;letter-spacing:-.3px}
.answers-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.answer-btn{background:var(--bg2);border:2px solid var(--border2);border-radius:var(--r);color:var(--text2);padding:15px 20px;font-family:var(--font);font-size:15px;font-weight:700;text-align:left;cursor:pointer;transition:all .15s;width:100%}
.answer-btn:hover:not(:disabled){border-color:var(--duo-blue);color:var(--text);background:rgba(28,176,246,.06)}
.answer-btn.selected{border-color:var(--duo-blue);color:var(--text);background:rgba(28,176,246,.08)}
.answer-btn.correct{border-color:var(--duo-green);background:rgba(87,204,2,.1);color:var(--duo-green)}
.answer-btn.wrong{border-color:var(--duo-red);background:var(--red-bg);color:var(--duo-red)}
.answer-btn:disabled{cursor:default}

/* ── FEEDBACK ── */
.feedback-bar{padding:14px 18px;display:none;align-items:flex-start;gap:12px;margin-bottom:20px;border:2px solid transparent;border-radius:var(--r);animation:fadeIn .2s ease}
.feedback-bar.show-correct{display:flex;background:rgba(87,204,2,.1);border-color:rgba(87,204,2,.25)}
.feedback-bar.show-wrong{display:flex;background:var(--red-bg);border-color:rgba(255,75,75,.25)}
.fb-icon{display:flex;align-items:center;justify-content:center;margin-top:2px;flex-shrink:0}
.fb-icon svg{width:18px;height:18px}
.show-correct .fb-icon{color:var(--duo-green)}
.show-wrong   .fb-icon{color:var(--duo-red)}
.fb-text h4{font-size:14px;font-weight:800;margin-bottom:4px}
.fb-text p{font-size:13px;color:var(--text2);line-height:1.5}
.correct-text h4{color:var(--duo-green)}
.wrong-text h4{color:var(--duo-red)}

/* ── BUTTONS ── */
.check-btn{padding:14px 40px;border:none;border-radius:var(--r3);font-family:var(--font);font-size:15px;font-weight:800;cursor:pointer;transition:all .15s;letter-spacing:.02em}
.check-btn.ready{background:var(--duo-blue);color:#fff;border-bottom:4px solid var(--duo-blue2)}
.check-btn.ready:hover:not(:disabled){filter:brightness(1.1)}
.check-btn.ready:active{transform:translateY(3px);border-bottom-width:1px}
.check-btn.disabled,.check-btn:disabled{background:var(--bg3);color:var(--text3);cursor:not-allowed;border-bottom:none}
.check-btn.next{background:var(--duo-green);color:#fff;border-bottom:4px solid var(--duo-green2)}
.check-btn.next:hover{filter:brightness(1.1)}
.check-btn.next:active{transform:translateY(3px);border-bottom-width:1px}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:auto;padding-top:8px}

/* ── COMPLETION ── */
.completion{display:none;flex-direction:column;justify-content:center;padding:20px 0;animation:fadeUpSmooth .5s ease}
.completion.show{display:flex}
.comp-trophy{font-size:64px;margin-bottom:16px;line-height:1;animation:popIn .5s cubic-bezier(.175,.885,.32,1.275)}
@keyframes popIn{from{transform:scale(0) rotate(-10deg)}to{transform:scale(1) rotate(0)}}
.comp-title{font-size:32px;font-weight:900;margin-bottom:8px;letter-spacing:-.5px}
.comp-sub{font-size:15px;color:var(--text2);margin-bottom:8px;line-height:1.6}
.comp-xp{display:inline-flex;align-items:center;gap:8px;background:rgba(255,217,0,.12);border:1.5px solid rgba(255,217,0,.3);color:var(--gold);border-radius:var(--r3);padding:8px 20px;font-family:var(--mono);font-size:15px;font-weight:900;margin-bottom:28px}
.comp-actions{display:flex;gap:12px;flex-wrap:wrap}

/* ── RIGHT SIDEBAR ── */
.sidebar-r{padding:28px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.sidebar-r::-webkit-scrollbar{display:none}
.profile-card{display:flex;align-items:center;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.profile-ava{width:42px;height:42px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background-size:cover;background-position:center;border:2px solid var(--border2);color:var(--text);font-weight:800}
.profile-info h4{font-size:14px;font-weight:800;margin-bottom:2px}
.profile-info span{font-family:var(--mono);font-size:10px;color:var(--text3)}
.widget-title{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--text3);letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px}
.progress-widget{background:var(--bg2);border:2px solid var(--border2);border-radius:var(--r2);padding:18px}
.progress-val{font-size:32px;font-weight:900;color:var(--duo-blue);margin-bottom:2px;line-height:1}
.progress-lbl{font-size:12px;color:var(--text2);margin-bottom:12px}
.progress-bar{height:8px;background:var(--bg3);border-radius:99px;overflow:hidden;margin-bottom:12px}
.progress-fill{height:100%;background:var(--duo-blue);border-radius:99px;transition:width .5s ease}
.stats-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--text3);border-top:1px solid var(--border);padding-top:12px}
.stats-row span{color:var(--duo-blue);font-weight:700}

/* ── RATING ── */
.star-icon{transition:transform .2s,fill .2s,stroke .2s;cursor:pointer}
.star-icon:hover{transform:scale(1.2)}
.reason-options button{padding:6px 12px;font-size:12px;font-weight:700;font-family:var(--font);background:var(--bg3);border:2px solid var(--border2);border-radius:var(--r3);cursor:pointer;transition:all .15s;color:var(--text3)}
.reason-options button.active{background:rgba(87,204,2,.1);border-color:var(--duo-green);color:var(--duo-green)}
#customReason{width:100%;height:80px;padding:12px;background:var(--bg2);border:2px solid var(--border2);border-radius:var(--r);color:var(--text);font-family:var(--font);font-size:13px;resize:vertical;outline:none;transition:border-color .15s}
#customReason:focus{border-color:var(--duo-blue)}
#customReason::placeholder{color:var(--text3)}
#submitRatingBtn{width:100%;padding:12px;border-radius:var(--r3);font-family:var(--font);font-size:14px;font-weight:800;cursor:pointer;transition:all .15s}
#submitRatingBtn.ready{background:var(--duo-blue);color:#fff;border:none;border-bottom:3px solid var(--duo-blue2)}
#submitRatingBtn.ready:hover{filter:brightness(1.1)}
#submitRatingBtn.disabled{background:var(--bg3);color:var(--text3);border:2px solid var(--border2);cursor:not-allowed}

/* ── XP POPUP ── */
.xp-popup{position:fixed;bottom:40px;right:40px;background:var(--bg2);border:2px solid var(--gold);color:var(--gold);font-family:var(--mono);font-size:15px;font-weight:700;padding:10px 24px;z-index:999;opacity:0;transform:translateY(20px);transition:all .4s ease;pointer-events:none;border-radius:var(--r3);box-shadow:0 4px 20px rgba(255,217,0,.2)}
.xp-popup.burst{opacity:1;transform:translateY(0)}
#confettiCanvas{position:fixed;inset:0;pointer-events:none;z-index:998}

/* ── LOADING / ERROR ── */
.loading-state{text-align:center;padding:100px 20px;font-family:var(--mono);color:var(--text3);font-size:12px;letter-spacing:.1em;text-transform:uppercase;width:100%}
.loading-spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--duo-blue);animation:spin .7s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-state{text-align:center;padding:80px 20px;color:var(--duo-red);font-family:var(--mono);font-size:13px;line-height:1.8}

/* ── ANIMATIONS ── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUpSmooth{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ── RESPONSIVE ── */
@media(max-width:1100px){.app{grid-template-columns:250px 1fr}.sidebar-r{display:none}}
@media(max-width:768px){
  .app{display:flex;flex-direction:column}
  .sidebar-l{position:static;height:auto;max-height:45vh;border-right:none;border-bottom:1px solid var(--border);padding:16px}
  .lesson-content-wrapper{padding:28px 20px}
  .check-btn{width:100%;text-align:center}
  .course-title{font-size:26px}
  .course-meta{gap:12px}
  .btn-row{flex-direction:column}
}
</style>
</head>
<body>

<div class="app">
  <!-- LEFT SIDEBAR -->
  <aside class="sidebar-l">
    <div class="logo-container">
      <a href="./index.html" class="logo">Tagybasqa<span class="logo-sub">Platform / 2026</span></a>
    </div>
    <button class="nav-item" onclick="window.location.href='./index.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Курстар тізіміне
    </button>
    <div class="curriculum-container" id="sidebarCurriculum">
      <div style="padding:0 12px;font-family:var(--mono);font-size:11px;color:var(--text3)">Жүктелуде...</div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">
    <div class="lesson-content-wrapper" id="lessonContent">
      <div class="loading-state">
        <div class="loading-spinner"></div>
        Курс жүктелуде...
      </div>
    </div>
  </main>

  <!-- RIGHT SIDEBAR -->
  <aside class="sidebar-r">
    <div class="profile-card">
      <div class="profile-ava" id="userAvatarUi"></div>
      <div class="profile-info">
        <h4 id="userNameUi">Студент</h4>
        <span id="userHandleUi">@студент</span>
      </div>
    </div>

    <div>
      <div class="widget-title">Прогресс</div>
      <div class="progress-widget">
        <div class="progress-val" id="progressPercentUi">0%</div>
        <div class="progress-lbl">Материал өтілді</div>
        <div class="progress-bar"><div class="progress-fill" id="progressBarUi" style="width:0%"></div></div>
        <div class="stats-row">Аяқталды <span id="completedLessonsUi">0 / 0</span></div>
      </div>
    </div>

    <!-- RATING -->
    <div>
      <div class="widget-title">Курсты бағалаңыз</div>
      <div class="progress-widget" style="padding:20px">
        <div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px">
          <svg class="star-icon" data-value="1" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <svg class="star-icon" data-value="2" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <svg class="star-icon" data-value="3" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <svg class="star-icon" data-value="4" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <svg class="star-icon" data-value="5" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </div>
        <div id="ratingStatus" style="font-family:var(--mono);font-size:11px;color:var(--text3);text-align:center;margin-bottom:12px">Жұлдызшаларды басыңыз</div>
        <div id="reasonContainer" style="display:none;margin-bottom:12px">
          <div style="font-size:12px;color:var(--text2);margin-bottom:8px">Себебі?</div>
          <div class="reason-options" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px"></div>
          <textarea id="customReason" placeholder="Өз пікіріңізді жазыңыз..."></textarea>
        </div>
        <button id="submitRatingBtn" class="disabled" onclick="submitCourseRating()">Бағаны жіберу</button>
      </div>
    </div>
  </aside>
</div>

<div class="xp-popup" id="xpPopup">+XP</div>
<canvas id="confettiCanvas"></canvas>

// ── PARAMS ───────────────────────────────────────────────────────

// ── AUTH ─────────────────────────────────────────────────────────
onAuthStateChanged(auth, async (user) => {
  if (!courseId) {
    showError('Курс ID табылмады. URL-де ?id= параметрі болуы керек.');
    return;
  }

  currentUser = user;

  if (user) {
    const snap = await getDoc(doc(db, 'users', user.uid)).catch(() => null);
    if (snap?.exists()) {
      userProfile = snap.data();
      completedSet = new Set(
        (userProfile.courseProgress?.[courseId] || []).map(Number)
      );
    }
    renderUserCard();
    setupRating();
  }

  await loadCourse();
});

// ── LOAD COURSE ───────────────────────────────────────────────────
async function loadCourse() {
  try {
    const snap = await getDoc(doc(db, 'courses', courseId));
    if (!snap.exists()) { showError('Курс табылмады.'); return; }

    courseData = snap.data();

    // Resolve author name
    if (courseData.uid) {
      const authorSnap = await getDoc(doc(db, 'users', courseData.uid)).catch(() => null);
      courseData._authorName = authorSnap?.data()?.name || courseData.userName || 'Автор';
    } else {
      courseData._authorName = courseData.userName || 'Tagybasqa';
    }

    buildFlatLessons();
    renderSidebar();
    renderIntro();
    updateProgressWidget();

  } catch (e) {
    console.error(e);
    showError(`Жүктеу қатесі: ${e.message}`);
  }
}

// ── FLAT LESSONS ──────────────────────────────────────────────────
function buildFlatLessons() {
  flatLessons = [];
  (courseData.modules || []).forEach((mod, mi) => {
    (mod.lessons || []).forEach((lesson, li) => {
      const isLast    = li === (mod.lessons.length - 1);
      const quizOnly  = lesson.quiz?.length > 0 && !lesson.content && !lesson.text;
      lesson._moduleTitle = mod.title || `Модуль ${mi + 1}`;
      lesson._isTest  = lesson.isModuleTest || (isLast && quizOnly);
      flatLessons.push(lesson);
    });
  });
}

// ── SIDEBAR ───────────────────────────────────────────────────────
function renderSidebar() {
  if (!courseData.modules?.length) {
    document.getElementById('sidebarCurriculum').innerHTML =
      '<div style="padding:0 12px;font-size:12px;color:var(--text3)">Сабақтар әлі қосылмаған.</div>';
    return;
  }

  let html = '';
  let gi = 0;

  courseData.modules.forEach((mod, mi) => {
    html += `<div><div class="sb-module-title">Модуль ${mi + 1}: ${esc(mod.title || '')}</div>`;
    (mod.lessons || []).forEach(lesson => {
      const idx = gi;
      const isTest = lesson._isTest;
      html += `<div class="sb-lesson ${isTest ? 'sb-module-test' : ''} locked"
        data-idx="${idx}" onclick="openLesson(${idx})">
        <div class="sb-lesson-icon" id="sb-icon-${idx}">${I.lock}</div>
        <div class="sb-lesson-text">${isTest ? '🏆 ' : `${idx + 1}. `}${esc(lesson.title || 'Сабақ')}</div>
      </div>`;
      gi++;
    });
    html += '</div>';
  });

  document.getElementById('sidebarCurriculum').innerHTML = html;
  syncSidebarState();
}

function syncSidebarState() {
  // Calculate next available lesson
  let nextIdx = 0;
  for (let i = 0; i < flatLessons.length; i++) {
    if (completedSet.has(i)) nextIdx = i + 1;
    else break;
  }
  // nextIdx = first non-completed in sequence

  document.querySelectorAll('.sb-lesson[data-idx]').forEach(el => {
    const idx    = parseInt(el.dataset.idx);
    const icon   = el.querySelector('.sb-lesson-icon');
    const lesson = flatLessons[idx];

    el.classList.remove('done', 'active-node', 'locked', 'active-reading');

    if (completedSet.has(idx)) {
      el.classList.add('done');
      icon.innerHTML = I.check;
    } else if (idx === nextIdx) {
      el.classList.add('active-node');
      icon.innerHTML = lesson._isTest ? I.trophy : I.play;
    } else {
      el.classList.add('locked');
      icon.innerHTML = I.lock;
    }

    if (idx === currentLessonIdx) {
      el.classList.add('active-reading');
      if (!completedSet.has(idx)) {
        icon.innerHTML = lesson._isTest ? I.trophy : I.dot;
      }
    }
  });
}

// ── INTRO ─────────────────────────────────────────────────────────
function renderIntro() {
  const c    = courseData;
  const done = completedSet.size;
  const total = flatLessons.length;

  // Find next lesson to open
  let startIdx = 0;
  for (let i = 0; i < total; i++) {
    if (!completedSet.has(i)) { startIdx = i; break; }
    if (i === total - 1) startIdx = 0; // all done → restart
  }

  const btnText   = done === 0 ? 'Бастау →' : done >= total ? '🔄 Қайталау' : 'Жалғастыру →';
  const btnClass  = done > 0 ? 'start-btn continue-btn' : 'start-btn';

  // Build outcomes from topics of all lessons
  const allTopics = [];
  flatLessons.forEach(l => {
    if (Array.isArray(l.topics)) l.topics.forEach(t => { if (!allTopics.includes(t)) allTopics.push(t); });
  });
  const outcomesHtml = allTopics.length
    ? `<div class="course-outcomes">
        <div class="course-outcomes-title">Не үйренесің</div>
        <ul>${allTopics.slice(0, 8).map(t => `<li>${esc(t)}</li>`).join('')}</ul>
       </div>`
    : '';

  document.getElementById('lessonContent').innerHTML = `
    <div class="course-intro">
      <span class="course-emoji">${c.emoji || '🐍'}</span>
      <div class="course-badge">${esc(c.level || 'Барлықтарға')}</div>
      <div class="course-title">${esc(c.title || '')}</div>
      <div class="course-sub">${esc(c.tagline || c.description || '')}</div>
      ${outcomesHtml}
      <button class="${btnClass}" onclick="openLesson(${startIdx})">${btnText}</button>
      <div class="course-meta">
        <div class="course-meta-item">${I.layers} Модульдер: <b>${c.modules?.length || 0}</b></div>
        <div class="course-meta-item">${I.book} Сабақтар: <b>${total}</b></div>
        <div class="course-meta-item">${I.clock} Ұзақтығы: <b>${c.duration || '—'}</b></div>
        <div class="course-meta-item">${I.user} Автор: <b>${esc(c._authorName)}</b></div>
        ${c.xpReward ? `<div class="course-meta-item">${I.star} XP: <b>${c.xpReward}</b></div>` : ''}
      </div>
    </div>`;

  currentLessonIdx = null;
  syncSidebarState();
}

// ── OPEN LESSON ───────────────────────────────────────────────────
window.openLesson = function(idx) {
  if (idx < 0 || idx >= flatLessons.length) return;

  // Only allow completed lessons or the next one in sequence
  const nextUnlocked = (() => {
    for (let i = 0; i < flatLessons.length; i++) {
      if (!completedSet.has(i)) return i;
    }
    return flatLessons.length; // all done
  })();

  if (!completedSet.has(idx) && idx !== nextUnlocked) {
    shakeSidebarItem(idx);
    return;
  }

  currentLessonIdx = idx;
  currentStepIdx   = 0;
  answered         = false;
  selectedAnswer   = null;

  const lesson = flatLessons[idx];
  lessonSteps = [];

  // Theory step
  if (lesson.content || lesson.text) {
    lessonSteps.push({ type: 'theory', title: lesson.title || 'Теория', content: lesson.content || lesson.text });
  }

  // Quiz steps
  const quizItems = lesson.quiz || lesson.steps || [];
  quizItems.forEach(q => {
    lessonSteps.push({
      type:    'mcq',
      q:       q.question || q.q || 'Дұрыс жауапты таңда',
      options: q.options || [],
      answer:  parseInt(q.answer ?? 0),
      explain: q.explain || '',
    });
  });

  if (lessonSteps.length === 0) {
    lessonSteps = [{ type: 'theory', title: lesson.title || 'Сабақ', content: 'Мазмұн дайындалуда.' }];
  }

  syncSidebarState();
  renderStep();
};

// ── RENDER STEP ───────────────────────────────────────────────────
function renderStep() {
  const step     = lessonSteps[currentStepIdx];
  const total    = lessonSteps.length;
  const progress = (currentStepIdx / total) * 100;
  const lesson   = flatLessons[currentLessonIdx];
  const isTest   = lesson._isTest;

  answered       = false;
  selectedAnswer = null;

  let html = '';

  if (step.type === 'theory') {
    const barColor = 'var(--duo-blue)';
    html = `
      <div class="step-header">
        ${I.book}
        <span>Оқу · ${currentStepIdx + 1} / ${total}</span>
        <div class="step-progress-wrap">
          <div class="step-progress-fill" style="width:${progress}%;background:${barColor}"></div>
        </div>
      </div>
      <div class="lesson-title">${esc(step.title)}</div>
      <div class="theory-body">${renderTheory(step.content || '')}</div>
      <div class="btn-row">
        <button class="check-btn ready" onclick="nextStep()">Түсінікті, алға →</button>
      </div>`;

  } else {
    const barColor = isTest ? 'var(--gold)' : 'var(--duo-blue)';
    const headerTxt = isTest
      ? `<span style="color:var(--gold)">${I.trophy} Қорытынды тест · ${currentStepIdx + 1} / ${total}</span>`
      : `${I.quiz} Тест · ${currentStepIdx + 1} / ${total}`;

    html = `
      <div class="step-header" style="${isTest ? 'color:var(--gold)' : ''}">
        ${headerTxt}
        <div class="step-progress-wrap">
          <div class="step-progress-fill" style="width:${progress}%;background:${barColor}"></div>
        </div>
      </div>
      <div class="quiz-q">${esc(step.q)}</div>
      <div class="answers-grid">
        ${step.options.map((o, i) =>
          `<button class="answer-btn" onclick="selectAnswer(${i})">${esc(o)}</button>`
        ).join('')}
      </div>
      <div class="feedback-bar" id="fb"><div class="fb-icon" id="fbIcon"></div><div class="fb-text" id="fbText"></div></div>
      <div class="btn-row">
        <button class="check-btn disabled" id="checkBtn" onclick="checkAnswer()">Жауапты тексеру</button>
      </div>`;
  }

  document.getElementById('lessonContent').innerHTML = html;
  document.querySelector('.main').scrollTop = 0;
}

// ── THEORY RENDERER ───────────────────────────────────────────────
function renderTheory(text) {
  if (!text) return '';

  // Split by code blocks (4-space indented lines)
  const lines = text.split('\n');
  const result = [];
  let inCode = false;
  let codeLines = [];

  for (const line of lines) {
    const isCodeLine = line.startsWith('    ') || line.startsWith('\t');
    if (isCodeLine) {
      if (!inCode) { inCode = true; codeLines = []; }
      codeLines.push(line.replace(/^    /, '').replace(/^\t/, ''));
    } else {
      if (inCode) {
        result.push(`<div class="code-block">${highlightCode(codeLines.join('\n'))}</div>`);
        inCode = false; codeLines = [];
      }
      if (line.trim() === '') {
        if (result.length && result[result.length-1] !== '<br>') result.push('');
      } else {
        result.push(`<p>${esc(line)}</p>`);
      }
    }
  }
  if (inCode && codeLines.length) {
    result.push(`<div class="code-block">${highlightCode(codeLines.join('\n'))}</div>`);
  }

  return result.join('\n');
}

function highlightCode(code) {
  return esc(code)
    .replace(/\b(def|class|return|import|from|if|elif|else|while|for|in|not|and|or|True|False|None|try|except|finally|raise|with|as|pass|break|continue|lambda|yield|async|await|global|nonlocal|del|assert)\b/g, '<span class="kw">$1</span>')
    .replace(/\b([a-z_]\w*)\s*(?=\()/g, '<span class="fn">$1</span>')
    .replace(/(#[^\n]*)/g, '<span class="cm">$1</span>')
    .replace(/(&quot;[^&]*&quot;|&#x27;[^&]*&#x27;|f&quot;[^&]*&quot;)/g, '<span class="str">$1</span>')
    .replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
}

// ── SELECT / CHECK ────────────────────────────────────────────────
window.selectAnswer = function(idx) {
  if (answered) return;
  document.querySelectorAll('.answer-btn').forEach(b => b.classList.remove('selected'));
  document.querySelectorAll('.answer-btn')[idx].classList.add('selected');
  selectedAnswer = idx;
  const btn = document.getElementById('checkBtn');
  if (btn) { btn.className = 'check-btn ready'; btn.disabled = false; }
};

window.checkAnswer = function() {
  if (answered || selectedAnswer === null) return;

  const step    = lessonSteps[currentStepIdx];
  const correct = selectedAnswer === step.answer;
  const fb      = document.getElementById('fb');
  const fbIcon  = document.getElementById('fbIcon');
  const fbText  = document.getElementById('fbText');
  const btn     = document.getElementById('checkBtn');
  const btns    = document.querySelectorAll('.answer-btn');

  btn.disabled = true;

  if (correct) {
    answered = true;
    fb.className = 'feedback-bar show-correct';
    fbIcon.innerHTML = I.check;
    fbText.className = 'fb-text correct-text';
    fbText.innerHTML = `<h4>Дұрыс! 🎉</h4><p>${esc(step.explain || 'Керемет жұмыс!')}</p>`;

    btns.forEach(b => b.disabled = true);
    btns[selectedAnswer].classList.add('correct');

    btn.className   = 'check-btn next';
    btn.textContent = 'Алға →';
    btn.disabled    = false;
    btn.onclick     = () => nextStep();
  } else {
    fb.className = 'feedback-bar show-wrong';
    fbIcon.innerHTML = I.cross;
    fbText.className = 'fb-text wrong-text';
    fbText.innerHTML = `<h4>Қате 😕</h4><p>${esc(step.explain || 'Басқа жауапты байқап көр.')}</p>`;

    btns[selectedAnswer].classList.add('wrong');
    setTimeout(() => {
      btns[selectedAnswer].classList.remove('wrong', 'selected');
      fb.className    = 'feedback-bar';
      btn.className   = 'check-btn disabled';
      btn.disabled    = false;
      btn.onclick     = () => checkAnswer();
      selectedAnswer  = null;
    }, 1200);
  }
};

// ── NEXT STEP ─────────────────────────────────────────────────────
window.nextStep = function() {
  currentStepIdx++;
  if (currentStepIdx >= lessonSteps.length) {
    completeLesson();
  } else {
    renderStep();
  }
};

// ── COMPLETE LESSON ───────────────────────────────────────────────
async function completeLesson() {
  if (isSaving) return;
  isSaving = true;

  const lesson       = flatLessons[currentLessonIdx];
  const isTest       = lesson._isTest;
  const isLastLesson = currentLessonIdx === flatLessons.length - 1;
  const xpGain       = isTest
    ? (courseData.xpReward || 50)
    : Math.round((courseData.xpReward || 50) / flatLessons.length);

  // Update local state
  completedSet.add(currentLessonIdx);

  // Save to Firestore
  if (currentUser) {
    try {
      const userRef = doc(db, 'users', currentUser.uid);
      const updates = {
        [`courseProgress.${courseId}`]: arrayUnion(currentLessonIdx),
        xp: (userProfile.xp || 0) + xpGain,
      };

      // Mark path step as done if course is a Python module
      if (courseData.isPythonModule && courseData.pathStepId) {
        updates.completedPathSteps = arrayUnion(courseData.pathStepId);
        updates.pathXP = (userProfile.pathXP || 0) + (courseData.xpReward || 0);
      }

      await updateDoc(userRef, updates).catch(async () => {
        // If doc doesn't exist yet, use setDoc
        await setDoc(userRef, { [`courseProgress`]: { [courseId]: [currentLessonIdx] }, xp: xpGain }, { merge: true });
      });

      // Update local profile cache
      if (!userProfile.courseProgress) userProfile.courseProgress = {};
      if (!userProfile.courseProgress[courseId]) userProfile.courseProgress[courseId] = [];
      userProfile.courseProgress[courseId].push(currentLessonIdx);
      userProfile.xp = (userProfile.xp || 0) + xpGain;

    } catch (e) {
      console.error('Progress save error:', e);
    }
  }

  syncSidebarState();
  updateProgressWidget();
  showXP(`+${xpGain} XP`);

  // Render completion screen
  document.getElementById('lessonContent').innerHTML = `
    <div class="completion show">
      <div class="comp-trophy">${isTest ? '🏆' : '⭐'}</div>
      <div class="comp-title">${isTest ? 'Тест тапсырылды!' : 'Сабақ аяқталды!'}</div>
      <div class="comp-sub">«${esc(lesson.title || 'Сабақ')}» сәтті өтілді.</div>
      <div class="comp-xp">⚡ +${xpGain} XP</div>
      <div class="comp-actions">
        ${isLastLesson
          ? `<button class="check-btn ready" onclick="window.location.href='./index.html'">✅ Курсты аяқтау</button>`
          : `<button class="check-btn next" onclick="openLesson(${currentLessonIdx + 1})">Келесі сабақ →</button>`
        }
        <button class="check-btn" style="background:var(--bg3);color:var(--text3);border:2px solid var(--border2)" onclick="renderIntro()">📋 Мазмұн</button>
      </div>
    </div>`;

  launchConfetti();
  isSaving = false;
}

// ── PROGRESS WIDGET ───────────────────────────────────────────────
function updateProgressWidget() {
  const total   = flatLessons.length;
  const done    = completedSet.size;
  const pct     = total > 0 ? Math.round((done / total) * 100) : 0;

  document.getElementById('progressPercentUi').textContent = `${pct}%`;
  document.getElementById('progressBarUi').style.width     = `${pct}%`;
  document.getElementById('completedLessonsUi').textContent = `${done} / ${total}`;
}

// ── USER CARD ─────────────────────────────────────────────────────
function renderUserCard() {
  if (!currentUser) return;
  const name   = userProfile.name || currentUser.email?.split('@')[0] || 'Студент';
  const handle = userProfile.handle ? `@${userProfile.handle}` : `@студент`;
  const avatar = userProfile.avatar;

  document.getElementById('userNameUi').textContent   = name;
  document.getElementById('userHandleUi').textContent = handle;

  const avaEl = document.getElementById('userAvatarUi');
  if (avatar) {
    if ([...avatar].length <= 2) {
      avaEl.textContent = avatar;
    } else {
      avaEl.style.backgroundImage = `url('${avatar}')`;
      avaEl.style.backgroundSize  = 'cover';
      avaEl.textContent = '';
    }
  } else {
    avaEl.textContent = name[0]?.toUpperCase() || '?';
  }
}

// ── RATING ────────────────────────────────────────────────────────
const RATING_REASONS = {
  1: ['Тым қиын', 'Қызықсыз', 'Қателер бар', 'Күтпеген нәрсе'],
  2: ['Тым қарапайым', 'Материал аз', 'Стиль ұнамады', 'Баглар болды'],
  3: ['Орташа', 'Жетілдіруге болады', 'Практика жетіспеді', 'Нормально'],
  4: ['Жақсы', 'Пайдалы материал', 'Қызықты', 'Ұнады'],
  5: ['Тамаша!', 'Өте пайдалы', 'Тақырыптың үздік курсы', 'Бәріне ұсынамын'],
};

function setupRating() {
  if (ratingLocked) return;

  // Load existing rating
  getDoc(doc(db, 'courseReviews', `${courseId}_${currentUser.uid}`))
    .then(snap => {
      if (snap.exists()) {
        const r = snap.data().rating || 0;
        userRating = r;
        highlightStars(r);
        document.getElementById('ratingStatus').textContent = `Сіздің бағаңыз: ${r}/5`;
        document.getElementById('ratingStatus').style.color = ratingColor(r);
        document.getElementById('reasonContainer').style.display = 'none';
        document.getElementById('submitRatingBtn').style.display = 'none';
        lockStars();
        ratingLocked = true;
      }
    }).catch(() => {});

  document.querySelectorAll('.star-icon').forEach(star => {
    star.addEventListener('mouseover', () => { if (!ratingLocked) highlightStars(+star.dataset.value); });
    star.addEventListener('mouseout',  () => highlightStars(userRating));
    star.addEventListener('click', () => {
      if (ratingLocked || !currentUser) return;
      userRating = +star.dataset.value;
      highlightStars(userRating);
      selectedReason = '';
      document.getElementById('ratingStatus').textContent = `${userRating}/5 қойдыңыз`;
      document.getElementById('ratingStatus').style.color = ratingColor(userRating);
      document.getElementById('reasonContainer').style.display = 'block';
      renderReasonButtons();
      checkRatingSubmit();
    });
  });

  document.getElementById('customReason').addEventListener('input', checkRatingSubmit);
}

function renderReasonButtons() {
  const container = document.querySelector('.reason-options');
  container.innerHTML = (RATING_REASONS[userRating] || []).map(r =>
    `<button onclick="selectReason(this,'${r}')">${r}</button>`
  ).join('');
}

window.selectReason = function(btn, reason) {
  selectedReason = reason;
  document.querySelectorAll('.reason-options button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  checkRatingSubmit();
};

function checkRatingSubmit() {
  const hasReason = selectedReason || document.getElementById('customReason').value.trim();
  const btn = document.getElementById('submitRatingBtn');
  if (userRating > 0 && hasReason) {
    btn.className = 'ready'; btn.disabled = false;
  } else {
    btn.className = 'disabled'; btn.disabled = true;
  }
}

window.submitCourseRating = async function() {
  if (!userRating || !currentUser || ratingLocked) return;
  const reason = selectedReason || document.getElementById('customReason').value.trim() || '—';
  const btn = document.getElementById('submitRatingBtn');
  btn.textContent = 'Сақталуда...'; btn.disabled = true;

  try {
    const uid = currentUser.uid;
    await setDoc(doc(db, 'courseReviews', `${courseId}_${uid}`), {
      courseId, userId: uid, rating: userRating, reason, timestamp: new Date()
    });

    // Recalculate average
    const q = query(collection(db, 'courseReviews'), where('courseId', '==', courseId));
    const snap = await getDocs(q);
    let total = 0;
    snap.forEach(d => { total += d.data().rating; });
    const avg = snap.size > 0 ? +(total / snap.size).toFixed(1) : 0;
    await updateDoc(doc(db, 'courses', courseId), { rating: avg, ratingCount: snap.size });

    document.getElementById('ratingStatus').textContent = 'Рахмет! Бағаңыз сақталды ✓';
    document.getElementById('ratingStatus').style.color = 'var(--green)';
    document.getElementById('reasonContainer').style.opacity = '0.5';
    btn.style.display = 'none';
    lockStars();
    ratingLocked = true;
  } catch (e) {
    console.error(e);
    btn.textContent = 'Бағаны жіберу'; btn.disabled = false;
    alert('Қате орын алды: ' + e.message);
  }
};

function ratingColor(r) {
  if (r <= 2) return 'var(--red)'; if (r === 3) return 'var(--gold)'; return 'var(--green)';
}
function highlightStars(count) {
  document.querySelectorAll('.star-icon').forEach(s => {
    const v = +s.dataset.value;
    const c = ratingColor(count);
    s.setAttribute('fill',   v <= count ? c : 'none');
    s.setAttribute('stroke', v <= count ? c : 'var(--text3)');
  });
}
function lockStars() {
  document.querySelectorAll('.star-icon').forEach(s => s.style.pointerEvents = 'none');
}

// ── CONFETTI ──────────────────────────────────────────────────────
window.launchConfetti = function() {
  const cv  = document.getElementById('confettiCanvas');
  const ctx = cv.getContext('2d');
  cv.width  = innerWidth; cv.height = innerHeight;
  const colors = ['#1cb0f6','#57cc02','#ffd900','#ff4b4b','#ce82ff','#1fe0c0'];
  const pieces = Array.from({length:80}, () => ({
    x: Math.random() * cv.width, y: -20,
    r: Math.random() * 5 + 2,
    color: colors[Math.floor(Math.random() * colors.length)],
    vx: (Math.random() - .5) * 6, vy: Math.random() * 4 + 2,
    rot: Math.random() * 360, vr: (Math.random() - .5) * 8,
    w: Math.random() * 8 + 4, h: Math.random() * 4 + 2,
  }));
  let frame = 0;
  (function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    pieces.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vy += .12;
    });
    if (++frame < 140) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
};

// ── XP POPUP ─────────────────────────────────────────────────────
function showXP(msg) {
  const el = document.getElementById('xpPopup');
  el.textContent = msg;
  el.className = 'xp-popup burst';
  setTimeout(() => el.className = 'xp-popup', 2000);
}

// ── SHAKE SIDEBAR ─────────────────────────────────────────────────
function shakeSidebarItem(idx) {
  const el = document.querySelector(`.sb-lesson[data-idx="${idx}"]`);
  if (!el) return;
  el.style.animation = 'none';
  el.style.transform = 'translateX(-6px)';
  setTimeout(() => { el.style.transform = 'translateX(6px)'; }, 100);
  setTimeout(() => { el.style.transform = ''; }, 250);
}

// ── HELPERS ───────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showError(msg) {
  document.getElementById('lessonContent').innerHTML =
    `<div class="error-state">⚠️ ${msg}<br><br><a href="./index.html" style="color:var(--duo-blue);text-decoration:none;font-weight:700">← Басты бетке</a></div>`;
}

// Expose renderIntro globally for "go back to contents" button
window.renderIntro = () => { currentLessonIdx = null; renderIntro(); syncSidebarState(); };
</script>
