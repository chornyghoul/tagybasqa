//  SEED ФУНКЦИЯСЫ
// ══════════════════════════════════════════════════════════
window.runSeed = async function() {
  const btn = document.getElementById('seedBtn');
  btn.disabled = true;

  log('🚀 Интерактивті сабақтар жүктелуде...', 'info');
  log(`📦 Жалпы: ${INTERACTIVE_LESSONS.length} сабақ`, 'info');

  let done = 0;
  const total = INTERACTIVE_LESSONS.length * 2; // lesson + pathStep update

  for (const lesson of INTERACTIVE_LESSONS) {
    try {
      // 1. Сабақты interactiveLessons коллекциясына жаз
      await setDoc(doc(db, 'interactiveLessons', lesson.id), {
        ...lesson,
        createdAt: new Date(),
      });
      done++;
      progress(done, total);
      log(`  ✅ сабақ: ${lesson.id} — "${lesson.title}"`, 'ok');

      // 2. pythonPath шагына lessonId қос
      if (lesson.pathStepId) {
        await updateDoc(doc(db, 'pythonPath', lesson.pathStepId), {
          lessonId: lesson.id,
          type: 'lesson',
        });
        done++;
        progress(done, total);
        log(`     🔗 pythonPath/${lesson.pathStepId} → lessonId: "${lesson.id}"`, 'info');
      }
    } catch(e) {
      log(`  ❌ қате: ${lesson.id} — ${e.message}`, 'err');
      done += 2;
      progress(done, total);
    }
  }

  progress(total, total);
  log('', '');
  log('🎉 Жүктеу аяқталды!', 'ok');
  log(`✅ ${INTERACTIVE_LESSONS.length} интерактивті сабақ Firebase-ке жазылды`, 'ok');
  log(`✅ ${INTERACTIVE_LESSONS.filter(l=>l.pathStepId).length} pythonPath шагы lessonId-пен жаңартылды`, 'ok');
  log('➡️ Енді Python жолындағы сабақ батырмасын бас → lesson-player.html ашылады!', 'info');
  btn.disabled = false;
};

window.checkExisting = async function() {
  log('🔍 Firebase-ті тексеруде...', 'info');
  try {
    const lessonsSnap = await getDocs(collection(db, 'interactiveLessons'));
    log(`📚 interactiveLessons: ${lessonsSnap.size} сабақ`, lessonsSnap.size > 0 ? 'ok' : 'warn');

    if (lessonsSnap.size > 0) {
      lessonsSnap.forEach(d => {
        const data = d.data();
        log(`   • ${d.id} — "${data.title}" (${data.steps?.length || 0} қадам, ${data.xp} XP)`, 'info');
      });
    } else {
      log('⚠️ interactiveLessons бос — «Жүктеу» батырмасын бас', 'warn');
    }

    // pythonPath шагаларындағы lessonId тексеру
    const pathSnap = await getDocs(collection(db, 'pythonPath'));
    const withLesson = pathSnap.docs.filter(d => d.data().lessonId);
    log(`🗺️ pythonPath: ${pathSnap.size} қадам, ${withLesson.length}-нде lessonId бар`, withLesson.length > 0 ? 'ok' : 'warn');

  } catch(e) {
    log(`❌ ${e.message}`, 'err');
  }
};

window.testLesson = function() {
  log('🧪 Demo урок ашылуда (lesson-player.html?id=demo)...', 'info');
  window.open('./lesson-player.html', '_blank');
};
