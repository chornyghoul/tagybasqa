<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Создать квиз — Tagybasqa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Onest:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff; --bg2: #f8f8f8; --bg3: #f0f0f0; --bg4: #e8e8e8;
      --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.12); --border3: rgba(0,0,0,0.22);
      --text: #1a1a1a; --text2: #555555; --text3: #888888;
      --green: #16a34a; --red: #dc2626; --red-bg: rgba(220,38,38,0.08);
      --gold: #f59e0b; --accent-dim: rgba(0,0,0,0.04);
      --r: 3px; --r2: 5px;
      --font: 'Onest', sans-serif; --mono: 'DM Mono', monospace;
    }
    :root.dark {
      --bg: #0a0a0a; --bg2: #121212; --bg3: #1a1a1a; --bg4: #222222;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.15); --border3: rgba(255,255,255,0.28);
      --text: #f4f4f4; --text2: #c8c8c8; --text3: #a0a0a0;
      --accent-dim: rgba(255,255,255,0.06);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

    /* HEADER */
    .qb-header{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:60px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:100}
    .qb-back{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--text3);text-decoration:none;cursor:pointer;background:none;border:none;transition:color .15s}
    .qb-back:hover{color:var(--text)}
    .qb-title-area{display:flex;flex-direction:column;align-items:center;gap:2px}
    .qb-quiz-title-input{background:transparent;border:none;color:var(--text);font-family:var(--font);font-size:16px;font-weight:700;text-align:center;outline:none;width:340px;padding:4px 8px;border-bottom:1px solid transparent;transition:border-color .15s}
    .qb-quiz-title-input:focus{border-bottom-color:var(--border3)}
    .qb-quiz-title-input::placeholder{color:var(--text3);font-weight:400}
    .qb-status{font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em}
    .qb-actions{display:flex;gap:8px}
    .btn{padding:8px 18px;font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;border:none;letter-spacing:.03em}
    .btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text2)}
    .btn-outline:hover{border-color:var(--border3);color:var(--text)}
    .btn-solid{background:var(--text);color:var(--bg)}
    .btn-solid:hover{opacity:.85}
    .btn-green{background:var(--green);color:#fff}
    .btn-green:hover{opacity:.85}
    .btn-red{background:transparent;border:1px solid var(--red);color:var(--red)}
    .btn-red:hover{background:var(--red-bg)}

    /* LAYOUT */
    .qb-layout{display:grid;grid-template-columns:260px 1fr 320px;min-height:calc(100vh - 60px)}

    /* LEFT — вопросы список */
    .qb-questions-panel{border-right:1px solid var(--border);display:flex;flex-direction:column;height:calc(100vh - 60px);position:sticky;top:60px;overflow:hidden}
    .qb-questions-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .qb-questions-label{font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.12em}
    .qb-add-q-btn{width:28px;height:28px;background:var(--text);color:var(--bg);border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:opacity .15s}
    .qb-add-q-btn:hover{opacity:.8}
    .qb-q-list{flex:1;overflow-y:auto;padding:8px}
    .qb-q-list::-webkit-scrollbar{width:3px}
    .qb-q-list::-webkit-scrollbar-thumb{background:var(--border3)}
    .qb-q-item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border:1px solid transparent;transition:all .15s;position:relative;margin-bottom:3px;border-radius:var(--r)}
    .qb-q-item:hover{background:var(--bg2);border-color:var(--border)}
    .qb-q-item.active{background:var(--bg2);border-color:var(--border2)}
    .qb-q-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--text)}
    .qb-q-num{font-family:var(--mono);font-size:10px;color:var(--text3);min-width:20px}
    .qb-q-preview{flex:1;font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .qb-q-delete{opacity:0;background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;padding:2px;transition:opacity .15s}
    .qb-q-item:hover .qb-q-delete{opacity:1}

    /* CENTER — редактор */
    .qb-editor{padding:32px;overflow-y:auto;background:var(--bg2)}
    .qb-editor-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:12px;text-align:center}
    .qb-editor-empty-icon{font-size:48px;opacity:.3}
    .qb-editor-empty-title{font-family:var(--mono);font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em}

    .q-editor-card{background:var(--bg);border:1px solid var(--border);padding:28px;margin-bottom:24px}
    .q-type-row{display:flex;gap:6px;margin-bottom:24px}
    .q-type-btn{padding:6px 14px;background:transparent;border:1px solid var(--border2);color:var(--text3);font-family:var(--mono);font-size:10px;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;transition:all .15s}
    .q-type-btn.active{background:var(--text);color:var(--bg);border-color:var(--text)}
    .q-type-btn:hover:not(.active){border-color:var(--border3);color:var(--text2)}

    .q-text-input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border2);color:var(--text);font-family:var(--font);font-size:18px;font-weight:600;padding:10px 0;outline:none;transition:border-color .15s;resize:none;line-height:1.4;min-height:72px}
    .q-text-input:focus{border-bottom-color:var(--border3)}
    .q-text-input::placeholder{color:var(--text3);font-weight:400}

    .q-media-row{display:flex;gap:8px;margin:16px 0}
    .q-media-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;background:transparent;border:1px dashed var(--border2);color:var(--text3);font-family:var(--mono);font-size:10px;cursor:pointer;text-transform:uppercase;letter-spacing:.07em;transition:all .15s}
    .q-media-btn:hover{border-color:var(--border3);color:var(--text2)}
    .q-img-preview{max-height:180px;width:100%;object-fit:cover;margin-bottom:12px;display:none}

    .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
    .option-item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg2);border:1px solid var(--border);transition:all .15s;cursor:pointer;position:relative}
    .option-item.correct{background:rgba(22,163,74,.06);border-color:var(--green)}
    .option-item.correct .opt-radio{background:var(--green);border-color:var(--green)}
    .opt-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;transition:all .15s;display:flex;align-items:center;justify-content:center}
    .opt-radio.checked::after{content:'';width:8px;height:8px;background:#fff;border-radius:50%;display:block}
    .opt-letter{width:24px;height:24px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700;flex-shrink:0}
    .option-item.correct .opt-letter{background:var(--green);border-color:var(--green);color:#fff}
    .opt-input{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--font);font-size:13px;outline:none}
    .opt-input::placeholder{color:var(--text3)}
    .opt-delete{opacity:0;background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;padding:2px;transition:opacity .15s;flex-shrink:0}
    .option-item:hover .opt-delete{opacity:1}
    .add-option-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;background:transparent;border:1px dashed var(--border2);color:var(--text3);font-family:var(--mono);font-size:11px;cursor:pointer;text-transform:uppercase;letter-spacing:.07em;transition:all .15s;margin-top:10px}
    .add-option-btn:hover{border-color:var(--border3);color:var(--text2)}

    /* TRUE/FALSE */
    .tf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
    .tf-btn{padding:20px;background:var(--bg2);border:1px solid var(--border);font-size:16px;font-weight:700;cursor:pointer;transition:all .15s}
    .tf-btn.correct{background:rgba(22,163,74,.08);border-color:var(--green);color:var(--green)}
    .tf-btn:hover:not(.correct){background:var(--bg3)}

    /* RIGHT — настройки */
    .qb-settings-panel{border-left:1px solid var(--border);height:calc(100vh - 60px);position:sticky;top:60px;overflow-y:auto;padding:20px}
    .qb-settings-panel::-webkit-scrollbar{width:3px}
    .qb-settings-panel::-webkit-scrollbar-thumb{background:var(--border3)}
    .settings-section{margin-bottom:24px}
    .settings-label{font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px;display:block}
    .settings-input{width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:13px;padding:9px 12px;outline:none;transition:border-color .15s;margin-bottom:8px}
    .settings-input:focus{border-color:var(--border3)}
    .settings-select{width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:13px;padding:9px 12px;outline:none;cursor:pointer;appearance:none;margin-bottom:8px}
    .time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .time-opt{padding:8px 4px;background:transparent;border:1px solid var(--border2);color:var(--text3);font-family:var(--mono);font-size:11px;cursor:pointer;text-align:center;transition:all .15s}
    .time-opt.active{background:var(--text);color:var(--bg);border-color:var(--text)}
    .time-opt:hover:not(.active){border-color:var(--border3);color:var(--text2)}
    .points-row{display:flex;align-items:center;gap:10px}
    .points-input{width:80px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:16px;font-weight:700;padding:8px 12px;outline:none;text-align:center;transition:border-color .15s}
    .points-input:focus{border-color:var(--border3)}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
    .toggle-label{font-size:13px;color:var(--text2)}
    .toggle{position:relative;width:36px;height:20px;cursor:pointer}
    .toggle input{opacity:0;width:0;height:0;position:absolute}
    .toggle-track{position:absolute;inset:0;background:var(--bg3);border:1px solid var(--border2);transition:all .2s}
    .toggle input:checked~.toggle-track{background:var(--green);border-color:var(--green)}
    .toggle-thumb{position:absolute;top:2px;left:2px;width:14px;height:14px;background:var(--text3);transition:transform .2s}
    .toggle input:checked~.toggle-thumb{transform:translateX(16px);background:#fff}

    /* BOTTOM PROGRESS */
    .qb-footer{position:fixed;bottom:0;left:0;right:0;height:48px;background:var(--bg);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:4px;z-index:50}
    .qb-dot{width:6px;height:6px;background:var(--border2);border-radius:50%;cursor:pointer;transition:all .15s}
    .qb-dot.active{background:var(--text);transform:scale(1.4)}

    /* TOAST */
    #qb-toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 24px;font-family:var(--mono);font-size:12px;font-weight:500;z-index:9999;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
    #qb-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .fade-up{animation:fadeUp .2s ease forwards}

    @media(max-width:900px){
      .qb-layout{grid-template-columns:1fr}
      .qb-questions-panel{position:relative;height:auto;border-right:none;border-bottom:1px solid var(--border)}
      .qb-q-list{max-height:150px}
      .qb-settings-panel{position:relative;height:auto;border-left:none;border-top:1px solid var(--border)}
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="qb-header">
  <button class="qb-back" onclick="goBack()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Назад
  </button>
  <div class="qb-title-area">
    <input class="qb-quiz-title-input" id="quizTitleInput" type="text" placeholder="Название квиза..." maxlength="80">
    <span class="qb-status" id="saveStatus">Не сохранено</span>
  </div>
  <div class="qb-actions">
    <button class="btn btn-outline" onclick="previewQuiz()">Превью</button>
    <button class="btn btn-outline" id="publishBtn" onclick="togglePublish()">Опубликовать</button>
    <button class="btn btn-solid" onclick="saveQuiz()">Сохранить</button>
  </div>
</header>

<!-- LAYOUT -->
<div class="qb-layout">

  <!-- LEFT: список вопросов -->
  <aside class="qb-questions-panel">
    <div class="qb-questions-header">
      <span class="qb-questions-label" id="qCountLabel">0 вопросов</span>
      <button class="qb-add-q-btn" onclick="addQuestion()" title="Добавить вопрос">+</button>
    </div>
    <div class="qb-q-list" id="questionList"></div>
  </aside>

  <!-- CENTER: редактор вопроса -->
  <main class="qb-editor" id="questionEditor">
    <div class="qb-editor-empty" id="editorEmpty">
      <div class="qb-editor-empty-icon">✏️</div>
      <div class="qb-editor-empty-title">Добавьте первый вопрос</div>
      <button class="btn btn-solid" style="margin-top:12px;" onclick="addQuestion()">+ Добавить вопрос</button>
    </div>
  </main>

  <!-- RIGHT: настройки -->
  <aside class="qb-settings-panel">
    <div class="settings-section">
      <span class="settings-label">Настройки квиза</span>
      <input class="settings-input" id="categoryInput" placeholder="Категория" maxlength="30">
      <select class="settings-select" id="visibilitySelect">
        <option value="draft">Черновик</option>
        <option value="public">Публичный</option>
      </select>
    </div>

    <div class="settings-section" id="questionSettings" style="display:none;">
      <span class="settings-label">Настройки вопроса</span>
      <div style="margin-bottom:14px;">
        <div class="settings-label" style="margin-bottom:8px;">Время (сек)</div>
        <div class="time-grid" id="timeGrid">
          <button class="time-opt" data-t="5">5</button>
          <button class="time-opt" data-t="10">10</button>
          <button class="time-opt active" data-t="20">20</button>
          <button class="time-opt" data-t="30">30</button>
          <button class="time-opt" data-t="45">45</button>
          <button class="time-opt" data-t="60">60</button>
        </div>
      </div>
      <div style="margin-bottom:14px;">
        <div class="settings-label" style="margin-bottom:8px;">Очки</div>
        <div class="points-row">
          <input class="points-input" id="pointsInput" type="number" value="100" min="0" max="9999">
          <span style="font-family:var(--mono);font-size:10px;color:var(--text3);">за правильный ответ</span>
        </div>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">Обязательный вопрос</span>
        <label class="toggle">
          <input type="checkbox" id="requiredToggle">
          <span class="toggle-track"></span>
          <span class="toggle-thumb"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">Перемешать варианты</span>
        <label class="toggle">
          <input type="checkbox" id="shuffleToggle">
          <span class="toggle-track"></span>
          <span class="toggle-thumb"></span>
        </label>
      </div>
    </div>

    <div class="settings-section">
      <span class="settings-label">Обложка квиза</span>
      <input class="settings-input" id="coverInput" placeholder="URL обложки (необязательно)">
    </div>

    <div class="settings-section">
      <button class="btn btn-red" style="width:100%;" id="deleteQuizBtn" onclick="confirmDeleteQuiz()" style="display:none;">Удалить квиз</button>
    </div>
  </aside>

</div>

<!-- BOTTOM DOTS -->
<div class="qb-footer" id="qbFooter"></div>
<div id="qb-toast"></div>

<!-- hidden file input -->
<input type="file" id="qImageInput" accept="image/*" style="display:none;">

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, addDoc, updateDoc, deleteDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAywbSZkiReHjTq4oc46Kbw9iZ0iDHVTpY",
  authDomain: "pystart-dd2db.firebaseapp.com",
  projectId: "pystart-dd2db",
  storageBucket: "pystart-dd2db.firebasestorage.app",
  messagingSenderId: "9188811255",
  appId: "1:9188811255:web:6f7280f1f7f67b80d90ef2"
};
const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);

// ── State ──
let questions = [];
let activeIdx = -1;
let currentUser = null;
let editingQuizId = null;
let isPublic = false;
let isSaving = false;

// Apply theme
const saved = localStorage.getItem('theme');
if (saved === 'dark') document.documentElement.classList.add('dark');
else if (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');

// ── Auth check ──
onAuthStateChanged(auth, async user => {
  if (!user) { window.location.href = './auth.html'; return; }
  currentUser = user;

  const params = new URLSearchParams(location.search);
  editingQuizId = params.get('edit') || null;

  if (editingQuizId) {
    await loadExistingQuiz(editingQuizId);
  } else {
    // prefill from AI data if present
    const aiData = sessionStorage.getItem('aiQuizDraft');
    if (aiData) {
      try {
        const quiz = JSON.parse(aiData);
        document.getElementById('quizTitleInput').value = quiz.title || '';
        document.getElementById('categoryInput').value = quiz.category || '';
        if (quiz.questions) {
          quiz.questions.forEach(q => {
            questions.push({
              type: 'multiple',
              text: q.question || '',
              options: q.options.map((o, i) => ({ text: o, correct: i === q.correctIndex })),
              timeLimit: 20,
              points: 100,
              required: false,
              shuffle: false,
              imageUrl: ''
            });
          });
        }
        sessionStorage.removeItem('aiQuizDraft');
        if (questions.length) { renderQuestionList(); selectQuestion(0); }
      } catch(e) {}
    }
  }
  document.getElementById('deleteQuizBtn').style.display = editingQuizId ? 'block' : 'none';
});

async function loadExistingQuiz(id) {
  try {
    const snap = await getDoc(doc(db, 'quizzes', id));
    if (!snap.exists()) { showToast('Квиз не найден'); return; }
    const data = snap.data();
    document.getElementById('quizTitleInput').value = data.title || '';
    document.getElementById('categoryInput').value = data.category || '';
    document.getElementById('coverInput').value = data.cover || '';
    isPublic = data.visibility === 'public';
    document.getElementById('visibilitySelect').value = data.visibility || 'draft';
    document.getElementById('publishBtn').textContent = isPublic ? 'Снять с публикации' : 'Опубликовать';
    questions = (data.questions || []).map(q => ({
      type: q.type || 'multiple',
      text: q.question || q.text || '',
      options: (q.options || []).map((o, i) => ({
        text: typeof o === 'string' ? o : o.text,
        correct: typeof o === 'object' ? o.correct : i === (q.correctIndex || 0)
      })),
      timeLimit: q.timeLimit || 20,
      points: q.points || 100,
      required: q.required || false,
      shuffle: q.shuffle || false,
      imageUrl: q.imageUrl || ''
    }));
    if (questions.length) { renderQuestionList(); selectQuestion(0); }
    document.getElementById('saveStatus').textContent = 'Загружено';
  } catch(e) { console.error(e); showToast('Ошибка загрузки квиза'); }
}

// ── Questions ──
window.addQuestion = function() {
  questions.push({
    type: 'multiple',
    text: '',
    options: [
      { text: '', correct: true },
      { text: '', correct: false },
      { text: '', correct: false },
      { text: '', correct: false }
    ],
    timeLimit: 20,
    points: 100,
    required: false,
    shuffle: false,
    imageUrl: ''
  });
  renderQuestionList();
  selectQuestion(questions.length - 1);
};

function renderQuestionList() {
  const list = document.getElementById('questionList');
  list.innerHTML = '';
  questions.forEach((q, i) => {
    const item = document.createElement('div');
    item.className = 'qb-q-item' + (i === activeIdx ? ' active' : '');
    item.innerHTML = `
      <span class="qb-q-num">${String(i+1).padStart(2,'0')}</span>
      <span class="qb-q-preview">${q.text || 'Вопрос ' + (i+1)}</span>
      <button class="qb-q-delete" onclick="deleteQuestion(${i},event)" title="Удалить">×</button>`;
    item.addEventListener('click', () => selectQuestion(i));
    list.appendChild(item);
  });
  document.getElementById('qCountLabel').textContent = `${questions.length} вопрос${questions.length===1?'':questions.length<5?'а':'ов'}`;
  renderFooterDots();
}

window.deleteQuestion = function(idx, e) {
  e.stopPropagation();
  if (!confirm('Удалить этот вопрос?')) return;
  questions.splice(idx, 1);
  if (activeIdx >= questions.length) activeIdx = questions.length - 1;
  renderQuestionList();
  if (questions.length > 0) selectQuestion(activeIdx); else showEmptyEditor();
};

function showEmptyEditor() {
  activeIdx = -1;
  document.getElementById('questionEditor').innerHTML = `
    <div class="qb-editor-empty" id="editorEmpty">
      <div class="qb-editor-empty-icon">✏️</div>
      <div class="qb-editor-empty-title">Добавьте первый вопрос</div>
      <button class="btn btn-solid" style="margin-top:12px;" onclick="addQuestion()">+ Добавить вопрос</button>
    </div>`;
  document.getElementById('questionSettings').style.display = 'none';
}

function selectQuestion(idx) {
  saveCurrentQuestion();
  activeIdx = idx;
  renderQuestionList();
  renderQuestionEditor(questions[idx]);
  renderSettingsPanel(questions[idx]);
  document.getElementById('questionSettings').style.display = 'block';
}

function saveCurrentQuestion() {
  if (activeIdx < 0 || activeIdx >= questions.length) return;
  const q = questions[activeIdx];
  const textEl = document.getElementById('qTextInput');
  if (textEl) q.text = textEl.value;
  if (q.type === 'multiple') {
    document.querySelectorAll('.opt-input').forEach((inp, i) => {
      if (q.options[i]) q.options[i].text = inp.value;
    });
  }
}

function renderQuestionEditor(q) {
  const editor = document.getElementById('questionEditor');
  const typeMap = { multiple: 'Один ответ', multi_select: 'Несколько ответов', true_false: 'Верно/Неверно', open: 'Открытый ответ' };

  editor.innerHTML = `
    <div class="q-editor-card fade-up">
      <div class="q-type-row">
        ${Object.entries(typeMap).map(([v,l]) => `
          <button class="q-type-btn${q.type===v?' active':''}" onclick="setQType('${v}')">${l}</button>`).join('')}
      </div>
      ${q.imageUrl ? `<img id="qImagePreview" class="q-img-preview" src="${q.imageUrl}" style="display:block;">` : `<img id="qImagePreview" class="q-img-preview">`}
      <div class="q-media-row">
        <button class="q-media-btn" onclick="document.getElementById('qImageInput').click()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Фото
        </button>
        ${q.imageUrl ? `<button class="q-media-btn" onclick="removeQImage()" style="color:var(--red);">× Удалить фото</button>` : ''}
      </div>
      <textarea class="q-text-input" id="qTextInput" placeholder="Введите вопрос..." maxlength="300">${q.text}</textarea>
      <div id="answerArea"></div>
    </div>`;

  renderAnswerArea(q);

  document.getElementById('qTextInput').addEventListener('input', e => {
    if (questions[activeIdx]) questions[activeIdx].text = e.target.value;
    renderQuestionList();
  });

  document.getElementById('qImageInput').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file || !currentUser) return;
    showToast('Загрузка изображения...');
    try {
      const fileRef = ref(storage, `quiz-images/${currentUser.uid}_${Date.now()}`);
      await uploadBytes(fileRef, file);
      const url = await getDownloadURL(fileRef);
      questions[activeIdx].imageUrl = url;
      const preview = document.getElementById('qImagePreview');
      if (preview) { preview.src = url; preview.style.display = 'block'; }
      showToast('Изображение загружено');
    } catch(err) { showToast('Ошибка загрузки'); }
    e.target.value = '';
  };
}

window.removeQImage = function() {
  questions[activeIdx].imageUrl = '';
  renderQuestionEditor(questions[activeIdx]);
};

function renderAnswerArea(q) {
  const area = document.getElementById('answerArea');
  if (!area) return;

  if (q.type === 'true_false') {
    area.innerHTML = `<div class="tf-grid">
      <button class="tf-btn${q.options[0]?.correct?' correct':''}" onclick="setTF(0)">✓ Верно</button>
      <button class="tf-btn${q.options[1]?.correct?' correct':''}" onclick="setTF(1)">✗ Неверно</button>
    </div>`;
    if (!q.options.length) q.options = [{text:'Верно',correct:true},{text:'Неверно',correct:false}];
    return;
  }

  if (q.type === 'open') {
    area.innerHTML = `<div style="margin-top:20px;padding:16px;background:var(--bg2);border:1px dashed var(--border2);font-family:var(--mono);font-size:11px;color:var(--text3);">
      Открытый ответ — студент введёт текст вручную. Оценивается вручную.
    </div>`;
    return;
  }

  const multiSelect = q.type === 'multi_select';
  const letters = ['A','B','C','D','E','F'];
  area.innerHTML = `
    <div class="options-grid" id="optionsGrid">
      ${q.options.map((opt,i) => `
        <div class="option-item${opt.correct?' correct':''}" id="optItem${i}">
          <div class="opt-radio${opt.correct?' checked':''}" onclick="toggleCorrect(${i})"></div>
          <div class="opt-letter">${letters[i]||i+1}</div>
          <input class="opt-input" data-idx="${i}" placeholder="Вариант ${i+1}" value="${escHtml(opt.text)}">
          <button class="opt-delete" onclick="deleteOption(${i})">×</button>
        </div>`).join('')}
    </div>
    ${q.options.length < 6 ? `<button class="add-option-btn" onclick="addOption()">+ Добавить вариант</button>` : ''}`;

  document.querySelectorAll('.opt-input').forEach(inp => {
    inp.addEventListener('input', e => {
      const idx = parseInt(e.target.dataset.idx);
      if (questions[activeIdx]?.options[idx]) questions[activeIdx].options[idx].text = e.target.value;
    });
  });
}

window.setQType = function(type) {
  if (!questions[activeIdx]) return;
  const q = questions[activeIdx];
  q.type = type;
  if (type === 'true_false') q.options = [{text:'Верно',correct:true},{text:'Неверно',correct:false}];
  else if (type === 'multiple' && (!q.options.length || q.type !== 'multiple')) {
    q.options = [{text:'',correct:true},{text:'',correct:false},{text:'',correct:false},{text:'',correct:false}];
  }
  renderQuestionEditor(q);
};

window.toggleCorrect = function(optIdx) {
  const q = questions[activeIdx];
  if (!q) return;
  if (q.type === 'multi_select') {
    q.options[optIdx].correct = !q.options[optIdx].correct;
  } else {
    q.options.forEach((o,i) => o.correct = i === optIdx);
  }
  renderAnswerArea(q);
};

window.setTF = function(idx) {
  const q = questions[activeIdx];
  if (!q) return;
  q.options = [{text:'Верно',correct:idx===0},{text:'Неверно',correct:idx===1}];
  renderAnswerArea(q);
};

window.addOption = function() {
  const q = questions[activeIdx];
  if (!q || q.options.length >= 6) return;
  q.options.push({text:'',correct:false});
  renderAnswerArea(q);
};

window.deleteOption = function(idx) {
  const q = questions[activeIdx];
  if (!q || q.options.length <= 2) { showToast('Минимум 2 варианта'); return; }
  q.options.splice(idx, 1);
  if (!q.options.some(o => o.correct)) q.options[0].correct = true;
  renderAnswerArea(q);
};

function renderSettingsPanel(q) {
  document.querySelectorAll('.time-opt').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.t) === q.timeLimit);
    btn.onclick = () => {
      if (questions[activeIdx]) questions[activeIdx].timeLimit = parseInt(btn.dataset.t);
      renderSettingsPanel(questions[activeIdx]);
    };
  });
  document.getElementById('pointsInput').value = q.points || 100;
  document.getElementById('pointsInput').oninput = e => { if(questions[activeIdx]) questions[activeIdx].points = parseInt(e.target.value)||0; };
  document.getElementById('requiredToggle').checked = q.required || false;
  document.getElementById('requiredToggle').onchange = e => { if(questions[activeIdx]) questions[activeIdx].required = e.target.checked; };
  document.getElementById('shuffleToggle').checked = q.shuffle || false;
  document.getElementById('shuffleToggle').onchange = e => { if(questions[activeIdx]) questions[activeIdx].shuffle = e.target.checked; };
}

function renderFooterDots() {
  const footer = document.getElementById('qbFooter');
  footer.innerHTML = questions.map((_, i) => `<div class="qb-dot${i===activeIdx?' active':''}" onclick="selectQuestion(${i})"></div>`).join('');
}

// ── Save ──
window.saveQuiz = async function() {
  if (isSaving) return;
  saveCurrentQuestion();

  const title = document.getElementById('quizTitleInput').value.trim();
  if (!title) { showToast('Введите название квиза'); return; }
  if (!questions.length) { showToast('Добавьте хотя бы один вопрос'); return; }

  const hasNoCorrect = questions.some(q =>
    (q.type === 'multiple' || q.type === 'multi_select' || q.type === 'true_false') &&
    !q.options.some(o => o.correct)
  );
  if (hasNoCorrect) { showToast('Отметьте правильный ответ для всех вопросов'); return; }

  isSaving = true;
  document.getElementById('saveStatus').textContent = 'Сохранение...';

  const data = {
    title,
    category: document.getElementById('categoryInput').value.trim() || 'Квиз',
    cover: document.getElementById('coverInput').value.trim() || '',
    visibility: document.getElementById('visibilitySelect').value,
    uid: currentUser.uid,
    updatedAt: serverTimestamp(),
    questions: questions.map(q => ({
      type: q.type,
      text: q.text,
      question: q.text,
      options: q.options,
      timeLimit: q.timeLimit,
      points: q.points,
      required: q.required,
      shuffle: q.shuffle,
      imageUrl: q.imageUrl || '',
      correctIndex: q.options.findIndex(o => o.correct)
    }))
  };

  try {
    if (editingQuizId) {
      await updateDoc(doc(db, 'quizzes', editingQuizId), data);
      showToast('✓ Квиз обновлён');
    } else {
      data.createdAt = serverTimestamp();
      const ref = await addDoc(collection(db, 'quizzes'), data);
      editingQuizId = ref.id;
      history.replaceState(null, '', `?edit=${editingQuizId}`);
      showToast('✓ Квиз сохранён');
    }
    document.getElementById('saveStatus').textContent = 'Сохранено';
    document.getElementById('deleteQuizBtn').style.display = 'block';
  } catch(e) {
    console.error(e);
    showToast('❌ Ошибка сохранения');
    document.getElementById('saveStatus').textContent = 'Ошибка';
  }
  isSaving = false;
};

window.togglePublish = async function() {
  saveCurrentQuestion();
  const title = document.getElementById('quizTitleInput').value.trim();
  if (!title) { showToast('Сначала введите название'); return; }
  isPublic = !isPublic;
  document.getElementById('visibilitySelect').value = isPublic ? 'public' : 'draft';
  document.getElementById('publishBtn').textContent = isPublic ? 'Снять с публикации' : 'Опубликовать';
  await saveQuiz();
};

window.previewQuiz = function() {
  saveCurrentQuestion();
  if (!questions.length) { showToast('Нет вопросов для превью'); return; }
  if (!editingQuizId) { showToast('Сначала сохраните квиз'); saveQuiz(); return; }
  window.open(`./quiz-play.html?quiz=${editingQuizId}&preview=1`, '_blank');
};

window.confirmDeleteQuiz = async function() {
  if (!editingQuizId) return;
  if (!confirm('Удалить этот квиз навсегда?')) return;
  try {
    await deleteDoc(doc(db, 'quizzes', editingQuizId));
    showToast('Квиз удалён');
    setTimeout(() => window.location.href = './index.html', 800);
  } catch(e) { showToast('Ошибка удаления'); }
};

window.goBack = function() { history.back() || (window.location.href = './index.html'); };

function showToast(msg) {
  const t = document.getElementById('qb-toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2500);
}

function escHtml(s) { return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Auto-save on title change
document.getElementById('quizTitleInput').addEventListener('input', () => {
  document.getElementById('saveStatus').textContent = 'Не сохранено';
});
</script>
</body>
