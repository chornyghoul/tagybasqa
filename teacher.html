<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Создать курс — LearnPlay</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f4f4f9;color:#333;margin:0;padding:20px;}
    .container{max-width:800px;margin:0 auto;background:white;padding:30px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.1);}
    h1{text-align:center;color:#8B5CF6;}
    input,select,textarea,button{
      width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #ddd;font-size:16px;
    }
    button{background:#8B5CF6;color:white;border:none;cursor:pointer;padding:15px;}
    button:hover{background:#7c4dff;}
    .course-list{margin-top:40px;}
    .course{background:#f0e6ff;padding:15px;margin:10px 0;border-radius:10px;}
  </style>
</head>
<body>
  <div class="container">
    <h1>Создать новый курс</h1>
    <input type="text" id="title" placeholder="Название курса (например: Python для новичков)">
    <input type="text" id="subtitle" placeholder="Короткое описание">
    <select id="lang">
      <option value="">Выбери язык</option>
      <option value="python">Python</option>
      <option value="js">JavaScript</option>
      <option value="java">Java / Kotlin</option>
      <option value="go">Go</option>
      <option value="rust">Rust</option>
      <option value="cpp">C++</option>
      <option value="csharp">C#</option>
    </select>
    <input type="text" id="image" placeholder="Ссылка на картинку (можно оставить пустой)" value="https://images.unsplash.com/photo-1526379091885-c9b69f4e67c4?w=800">
    <button onclick="publishCourse()">ОПУБЛИКОВАТЬ КУРС</button>

    <div class="course-list">
      <h2>Твои курсы:</h2>
      <div id="myCourses"></div>
    </div>
  </div>

  <script>
    function publishCourse() {
      const title = document.getElementById('title').value.trim();
      const subtitle = document.getElementById('subtitle').value.trim();
      const lang = document.getElementById('lang').value;
      const image = document.getElementById('image').value || 'https://images.unsplash.com/photo-1526379091885-c9b69f4e67c4?w=800';

      if (!title || !subtitle || !lang) {
        alert('Заполни название, описание и язык!');
        return;
      }

      const newCourse = {
        id: Date.now(),
        title,
        subtitle,
        lang,
        image,
        students: 0.1,
        likes: 0,
        rating: 5.0
      };

      // Сохраняем в браузере
      let courses = JSON.parse(localStorage.getItem('userCourses') || '[]');
      courses.push(newCourse);
      localStorage.setItem('userCourses', JSON.stringify(courses));

      alert('Курс опубликован! Обнови главную страницу — он уже там!');
      document.getElementById('title').value = '';
      document.getElementById('subtitle').value = '';
      document.getElementById('lang').value = '';
      showMyCourses();
    }

    function showMyCourses() {
      const list = document.getElementById('myCourses');
      const courses = JSON.parse(localStorage.getItem('userCourses') || '[]');
      if (courses.length === 0) {
        list.innerHTML = '<p>Ты ещё ничего не опубликовал</p>';
        return;
      }
      list.innerHTML = courses.map(c => `
        <div class="course">
          <strong>${c.title}</strong><br>
          ${c.subtitle} • ${c.lang.toUpperCase()}
        </div>
      `).join('');
    }

    // Показываем курсы при загрузке
    showMyCourses();
  </script>
</body>
</html>
