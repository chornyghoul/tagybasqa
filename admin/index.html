<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Админ-панель — IT College Hub</title>
  <link rel="stylesheet" href="../static/css/styles.css" />
  <script defer src="../static/js/data.js"></script>
  <script defer src="../static/js/storage.js"></script>
  <script defer src="../static/js/components.js"></script>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="../index.html" class="logo">IT College Hub</a>
    <nav class="nav">
      <a class="nav-link" href="../profile/index.html">Кабинет</a>
    </nav>
  </div>
</header>
<main class="container section">
  <div id="wrap"></div>
</main>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const u = UI.roleGuard(['teacher']);
    if (!u) return;

    const wrap = document.getElementById('wrap');
    wrap.appendChild(UI.el('h1', {}, 'Админ-панель'));

    // Форма добавления материала
    const matForm = UI.el('div', { class: 'card' }, [
      UI.el('h3', {}, 'Добавить материал'),
      UI.el('div', { class: 'form' }, [
        UI.el('div', { class: 'form-row' }, [UI.el('label', {}, 'Тема'), (function(){
          const s = UI.el('select', { name: 'topic' });
          (AppData.topics[u.specialty]||[]).forEach(t => s.appendChild(UI.el('option', { value: t.id }, t.title)));
          return s; })()]),
        UI.el('div', { class: 'form-row' }, [UI.el('label', {}, 'Тип'), (function(){
          const s = UI.el('select', { name: 'kind' });
          ['theory','practice'].forEach(k => s.appendChild(UI.el('option', { value: k }, k)));
          return s; })()]),
        UI.el('div', { class: 'form-row' }, [UI.el('label', {}, 'Заголовок'), UI.el('input', { class: 'input', name: 'title' })]),
        UI.el('div', { class: 'form-row' }, [UI.el('label', {}, 'Содержимое'), UI.el('textarea', { class: 'input', name: 'content', rows: 4 })]),
        UI.el('div', { class: 'form-actions' }, [UI.el('button', { class: 'btn btn-primary', id: 'addMat' }, 'Добавить')])
      ])
    ]);

    // Форма добавления вопроса
    const testForm = UI.el('div', { class: 'card' }, [
      UI.el('h3', {}, 'Добавить вопрос в тест'),
      UI.el('div', { class: 'form' }, [
        UI.el('div', { class: 'form-row' }, [UI.el('label', {}, 'Тема (test-topic)'), (function(){
          const s = UI.el('select', { name: 'topic' });
          (AppData.topics[u.specialty]||[]).forEach(t => s.appendChild(UI.el('option', { value: t.id }, t.title)));
          return s; })()]),
        UI.el('div', { class: 'form-row' }, [UI.el('label', {}, 'Вопрос'), UI.el('input', { class: 'input', name: 'question' })]),
        UI.el('div', { class: 'form-row' }, [UI.el('label', {}, 'Варианты (через ;)'), UI.el('input', { class: 'input', name: 'options', placeholder: 'A;B;C' })]),
        UI.el('div', { class: 'form-row' }, [UI.el('label', {}, 'Индекс ответа (0..n-1)'), UI.el('input', { class: 'input', name: 'answer', type: 'number', value: 0 })]),
        UI.el('div', { class: 'form-row' }, [UI.el('label', {}, 'Пояснение'), UI.el('input', { class: 'input', name: 'explain' })]),
        UI.el('div', { class: 'form-actions' }, [UI.el('button', { class: 'btn btn-primary', id: 'addQ' }, 'Добавить вопрос')])
      ])
    ]);

    wrap.appendChild(matForm);
    wrap.appendChild(testForm);

    document.getElementById('addMat').addEventListener('click', () => {
      const topic = matForm.querySelector('select[name="topic"]').value;
      const kind = matForm.querySelector('select[name="kind"]').value;
      const title = matForm.querySelector('input[name="title"]').value.trim();
      const content = matForm.querySelector('textarea[name="content"]').value.trim();
      if (!title || !content) return alert('Заполните заголовок и содержимое');
      const all = Store.allMaterials();
      const list = all[topic] || [];
      list.push({ id: 'm'+Date.now(), kind, title, content });
      all[topic] = list; Store.saveMaterials(all);
      alert('Материал добавлен');
    });

    document.getElementById('addQ').addEventListener('click', () => {
      const topic = testForm.querySelector('select[name="topic"]').value;
      const question = testForm.querySelector('input[name="question"]').value.trim();
      const options = testForm.querySelector('input[name="options"]').value.split(';').map(s => s.trim()).filter(Boolean);
      const answer = parseInt(testForm.querySelector('input[name="answer"]').value, 10) || 0;
      const explain = testForm.querySelector('input[name="explain"]').value.trim();
      if (!question || options.length < 2) return alert('Заполните вопрос и минимум 2 варианта');
      const all = Store.allTests();
      const list = all[topic] || [];
      list.push({ id: 't'+Date.now(), question, options, answer, explain });
      all[topic] = list; Store.saveTests(all);
      alert('Вопрос добавлен');
    });
  });
</script>
</body>
</html>
