<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <style>
        :root {
            --bg-gradient-start: #0f172a;
            --bg-gradient-middle: #1f2937;
            --bg-gradient-end: #0f172a;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border: #e5e7eb;
            --primary: #0f172a;
            --primary-hover: #020617;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --success: #16a34a;
            --radius: 16px;
            --shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(to bottom right, var(--bg-gradient-start), var(--bg-gradient-middle), var(--bg-gradient-end));
            color: var(--text-primary);
            min-height: 100vh;
            padding: 48px 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .profile-container { max-width: 1024px; width: 100%; }
        .profile-card { background: var(--card-bg); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
        .header-bg { height: 128px; background: linear-gradient(to right, #334155, #0f172a); }
        .content { padding: 32px; position: relative; }

        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -64px;
            margin-bottom: 32px;
        }

        @media (min-width: 768px) {
            .avatar-section {
                flex-direction: row;
                align-items: flex-end;
                justify-content: space-between;
                margin-top: -80px;
            }
        }

        .avatar-wrapper { position: relative; }
        .avatar { width: 128px; height: 128px; border-radius: 50%; border: 4px solid var(--card-bg); overflow: hidden; background: #f1f5f9; box-shadow: var(--shadow); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .upload-btn {
            position: absolute;
            bottom: 0; right: 0;
            padding: 8px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-btn:hover { background: var(--primary-hover); transform: scale(1.1); }

        .user-info { text-align: center; margin-top: 16px; }
        @media (min-width: 768px) {
            .user-info { text-align: left; margin-left: 24px; margin-top: 0; margin-bottom: 8px; }
        }

        .user-name { font-size: 1.875rem; font-weight: 700; }
        .user-role { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); margin-top: 4px; }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
            justify-content: center;
        }
        @media (min-width: 768px) {
            .actions { margin-top: 0; justify-content: flex-start; }
        }

        .btn {
            padding: 10px 24px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary { background: var(--primary); color: white; border: none; }
        .btn-primary:hover { background: var(--primary-hover); box-shadow: var(--shadow); }

        .btn-success { background: var(--success); color: white; border: none; }
        .btn-success:hover { background: #15803d; box-shadow: var(--shadow); }

        .btn-secondary { background: transparent; color: var(--text-secondary); border: 2px solid var(--border); }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }

        .btn-danger { background: var(--danger); color: white; border: none; }
        .btn-danger:hover { background: var(--danger-hover); box-shadow: var(--shadow); }

        /* Остальные стили без изменений */
        .form-grid { display: grid; gap: 24px; }
        @media (min-width: 768px) { .form-grid { grid-template-columns: 1fr 1fr; } }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .label { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; font-weight: 600; color: var(--text-secondary); }
        .input { padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; transition: all 0.3s; }
        .input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15,23,42,0.1); }
        .display-value { padding: 12px 16px; background: #f8fafc; border-radius: 8px; color: var(--text-primary); }
        .bio { grid-column: 1 / -1; }
        @media (min-width: 768px) { .bio { grid-column: span 1; } }
        .textarea { min-height: 200px; resize: vertical; }
        .edit-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
        .delete-section { padding-top: 24px; border-top: 1px solid var(--border); margin-top: 32px; }
        .dates { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 0.875rem; color: #64748b; }

        .spinner-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid #f3f3f3; border-top: 4px solid var(--primary);
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading .spinner-overlay { display: flex; }
    </style>
</head>
<body>

    <div class="profile-container">
        <div class="profile-card">
            <div class="header-bg"></div>
            <div class="content">
                <div class="avatar-section">
                    <div class="flex flex-col md:flex-row items-center md:items-end gap-6 flex-1">
                        <div class="avatar-wrapper">
                            <div class="avatar">
                                <img id="avatarImg" src="" alt="Аватар">
                            </div>
                            <button id="uploadBtn" class="upload-btn">Camera</button>
                            <input id="fileInput" type="file" accept="image/*" style="display: none;">
                        </div>
                        <div class="user-info">
                            <h1 id="userName" class="user-name"></h1>
                            <p id="userRole" class="user-role"></p>
                        </div>
                    </div>

                    <!-- Кнопки действий -->
                    <div class="actions" id="actionsContainer">
                        <button id="editBtn" class="btn btn-primary">Редактировать</button>
                        <!-- Кнопка "Создать курс" будет добавлена динамически -->
                        <button id="logoutBtn" class="btn btn-secondary">Выйти</button>
                    </div>
                </div>

                <!-- Остальная часть формы профиля (без изменений) -->
                <div class="form-grid">
                    <div class="space-y-6">
                        <div class="form-group">
                            <label class="label">ФИО</label>
                            <div id="nameDisplay" class="display-value"></div>
                            <input id="nameInput" class="input" style="display: none;">
                        </div>
                        <div class="form-group">
                            <label class="label">Email</label>
                            <div id="emailDisplay" class="display-value"></div>
                        </div>
                        <div class="form-group">
                            <label class="label">Телефон</label>
                            <div id="phoneDisplay" class="display-value"></div>
                            <input id="phoneInput" type="tel" class="input" placeholder="+7 (999) 123-45-67" style="display: none;">
                        </div>
                    </div>
                    <div class="form-group bio">
                        <label class="label">О себе</label>
                        <div id="bioDisplay" class="display-value min-h-[200px]"></div>
                        <textarea id="bioInput" class="input textarea" placeholder="Расскажите о себе..." style="display: none;"></textarea>
                    </div>
                </div>

                <div id="editActions" class="edit-actions" style="display: none;">
                    <button id="cancelBtn" class="btn btn-secondary">Отмена</button>
                    <button id="saveBtn" class="btn btn-primary">Сохранить</button>
                </div>

                <div class="delete-section">
                    <button id="deleteBtn" class="btn btn-danger">Удалить аккаунт навсегда</button>
                </div>

                <div class="dates">
                    <span id="createdDate"></span>
                    <span id="updatedDate"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="spinner-overlay">
        <div class="spinner"></div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import { 
        getAuth, 
        onAuthStateChanged, 
        signOut, 
        EmailAuthProvider, 
        reauthenticateWithCredential, 
        deleteUser 
    } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
    import { 
        getFirestore, 
        doc, 
        getDoc,
        setDoc, 
        updateDoc, 
        deleteDoc,
        serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
    import { 
        getStorage, 
        ref, 
        uploadBytes, 
        getDownloadURL, 
        deleteObject 
    } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBvj75AoP4YWRNdz6ec4JMtJkw2QpkqNxw",
        authDomain: "learnplay-5b470.firebaseapp.com",
        projectId: "learnplay-5b470",
        storageBucket: "learnplay-5b470.firebasestorage.app",
        messagingSenderId: "75847585068",
        appId: "1:75847585068:web:0c17038fe5ed69adbd3089"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const spinnerOverlay = document.querySelector('.spinner-overlay');
    let editing = false;
    let originalData = {};

    function showLoading() { document.body.classList.add('loading'); }
    function hideLoading() { document.body.classList.remove('loading'); }

    function getAvatarUrl(name, avatarUrl) {
        if (avatarUrl) return avatarUrl;
        return `https://ui-avatars.com/api/?name=${encodeURIComponent(name || 'User')}&size=200&background=0f172a&color=fff&bold=true`;
    }

    function toggleEditMode(isEditing) {
        editing = isEditing;
        document.getElementById('editBtn').style.display = isEditing ? 'none' : 'block';
        document.getElementById('editActions').style.display = isEditing ? 'flex' : 'none';

        ['name', 'phone', 'bio'].forEach(field => {
            document.getElementById(`${field}Display`).style.display = isEditing ? 'none' : 'block';
            document.getElementById(`${field}Input`).style.display = isEditing ? 'block' : 'none';
        });
    }

    async function loadProfile(user) {
        showLoading();
        try {
            const userRef = doc(db, 'users', user.uid);
            let userDoc = await getDoc(userRef);

            if (!userDoc.exists()) {
                const defaultData = {
                    email: user.email,
                    name: user.displayName || '',
                    role: 'student',
                    phone: '',
                    bio: '',
                    avatarUrl: user.photoURL || '',
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                };
                await setDoc(userRef, defaultData);
                userDoc = await getDoc(userRef);
            }

            const data = userDoc.data();
            originalData = { ...data };

            // Заполнение данных
            document.getElementById('userName').textContent = data.name || 'Без имени';
            document.getElementById('userRole').innerHTML = data.role === 'teacher' ? 'Учитель' : 'Студент';
            document.getElementById('nameDisplay').textContent = data.name || '';
            document.getElementById('nameInput').value = data.name || '';
            document.getElementById('emailDisplay').textContent = data.email || user.email;
            document.getElementById('phoneDisplay').textContent = data.phone || 'Не указан';
            document.getElementById('phoneInput').value = data.phone || '';
            document.getElementById('bioDisplay').textContent = data.bio || 'Информация не заполнена';
            document.getElementById('bioInput').value = data.bio || '';
            document.getElementById('avatarImg').src = getAvatarUrl(data.name, data.avatarUrl);

            const created = data.createdAt?.toDate()?.toLocaleDateString('ru-RU') || 'Неизвестно';
            const updated = data.updatedAt?.toDate()?.toLocaleDateString('ru-RU') || 'Неизвестно';
            document.getElementById('createdDate').textContent = `Аккаунт создан: ${created}`;
            document.getElementById('updatedDate').textContent = `Обновлён: ${updated}`;

            // === Добавляем кнопку "Создать курс" только для учителей ===
            const actionsContainer = document.getElementById('actionsContainer');
            // Удаляем старую кнопку, если была
            const oldBtn = document.getElementById('createCourseBtn');
            if (oldBtn) oldBtn.remove();

            if (data.role === 'teacher') {
                const createBtn = document.createElement('button');
                createBtn.id = 'createCourseBtn';
                createBtn.className = 'btn btn-success';
                createBtn.innerHTML = 'Создать курс';
                createBtn.addEventListener('click', () => {
                    window.location.href = 'teacher.html';
                });
                // Вставляем перед кнопкой "Выйти"
                actionsContainer.insertBefore(createBtn, document.getElementById('logoutBtn'));
            }

        } catch (error) {
            alert('Ошибка загрузки профиля: ' + error.message);
        } finally {
            hideLoading();
        }
    }

    // === Остальной код без изменений ===

    onAuthStateChanged(auth, user => {
        if (user && user.emailVerified) {
            loadProfile(user);
        } else {
            window.location.replace('./index.html');
        }
    });

    // Редактирование, сохранение, загрузка аватара, выход, удаление — всё как было
    document.getElementById('editBtn').addEventListener('click', () => toggleEditMode(true));

    document.getElementById('cancelBtn').addEventListener('click', () => {
        document.getElementById('nameInput').value = originalData.name || '';
        document.getElementById('phoneInput').value = originalData.phone || '';
        document.getElementById('bioInput').value = originalData.bio || '';
        toggleEditMode(false);
    });

    document.getElementById('saveBtn').addEventListener('click', async () => {
        showLoading();
        try {
            const user = auth.currentUser;
            const updates = {
                name: document.getElementById('nameInput').value.trim(),
                phone: document.getElementById('phoneInput').value.trim(),
                bio: document.getElementById('bioInput').value.trim(),
                updatedAt: serverTimestamp()
            };
            await updateDoc(doc(db, 'users', user.uid), updates);
            await loadProfile(user);
            toggleEditMode(false);
            alert('Профиль успешно обновлён!');
        } catch (error) {
            alert('Ошибка сохранения: ' + error.message);
        } finally {
            hideLoading();
        }
    });

    // Загрузка аватара (без изменений)
    document.getElementById('uploadBtn').addEventListener('click', () => {
        document.getElementById('fileInput').click();
    });

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) return alert('Выберите изображение');
        if (file.size > 5 * 1024 * 1024) return alert('Файл не больше 5 МБ');

        showLoading();
        try {
            const user = auth.currentUser;
            const userDoc = await getDoc(doc(db, 'users', user.uid));
            const oldUrl = userDoc.data()?.avatarUrl;
            if (oldUrl) {
                try { await deleteObject(ref(storage, oldUrl)); } catch {}
            }

            const ext = file.name.split('.').pop();
            const storageRef = ref(storage, `avatars/${user.uid}/${Date.now()}.${ext}`);
            await uploadBytes(storageRef, file);
            const url = await getDownloadURL(storageRef);

            await updateDoc(doc(db, 'users', user.uid), { avatarUrl: url, updatedAt: serverTimestamp() });
            await loadProfile(user);
            alert('Аватар обновлён!');
        } catch (err) {
            alert('Ошибка: ' + err.message);
        } finally {
            hideLoading();
            e.target.value = '';
        }
    });

    // Выход
    // Выход — теперь полностью через Firebase
document.getElementById('logoutBtn').addEventListener('click', async () => {
    showLoading();
    try {
        await signOut(auth);
        alert('Вы успешно вышли из аккаунта');

        // ВАЖНО: сразу обновляем интерфейс, чтобы кнопка профиля исчезла ДО редиректа
        if (typeof updateAuthUI === 'function') {
            updateAuthUI(null);
        }

        // Даём интерфейсу время обновиться (особенно на мобильных)
        setTimeout(() => {
            window.location.href = './index.html';
        }, 100);

    } catch (e) {
        alert('Ошибка выхода: ' + e.message);
    } finally {
        hideLoading();
    }
});

    // Удаление аккаунта (без изменений)
    document.getElementById('deleteBtn').addEventListener('click', async () => {
        if (!confirm('Удалить аккаунт навсегда? Это действие необратимо!')) return;
        const password = prompt('Введите пароль для подтверждения:');
        if (!password) return;

        showLoading();
        try {
            const user = auth.currentUser;
            const credential = EmailAuthProvider.credential(user.email, password);
            await reauthenticateWithCredential(user, credential);

            const userDoc = await getDoc(doc(db, 'users', user.uid));
            const avatarUrl = userDoc.data()?.avatarUrl;
            if (avatarUrl) await deleteObject(ref(storage, avatarUrl)).catch(() => {});

            await deleteDoc(doc(db, 'users', user.uid));
            await deleteUser(user);

            alert('Аккаунт удалён');
            window.location.replace('./');
        } catch (err) {
            alert(err.code === 'auth/wrong-password' ? 'Неверный пароль' : err.message);
        } finally {
            hideLoading();
        }
    });




    // Делаем функцию выхода глобальной и переиспользуемой
    window.firebaseLogout = async function() {
        showLoading();
        try {
            await signOut(auth);
            alert('Вы вышли из аккаунта');

            // Обновляем интерфейс на текущей странице
            if (typeof updateAuthUI === 'function') {
                updateAuthUI(null);
            }

            setTimeout(() => {
                window.location.href = '../learnplay/index.html';
            }, 150);
        } catch (e) {
            alert('Ошибка: ' + e.message);
        } finally {
            hideLoading();
        }
    };
</script>

</body>
</html>
