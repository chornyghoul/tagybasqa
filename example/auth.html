<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TagyBasqa</title>
</head>
<style>
    body {
        background-color: #131f24;
        color: #eeeeee;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
    }

    .btn-top {
        position: absolute;
        top: 20px;
        background: transparent;
        border: 2px solid #33464d;
        color: #49c0f8;
        padding: 10px 20px;
        border-radius: 12px;
        font-weight: bold;
        cursor: pointer;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
    }

    /* Кнопка «Назад» слева */
    #backBtn {
        left: 20px;
        color: red;
        text-decoration: none;
    }

    /* Кнопка «Войти» справа (остаётся как была) */
    #toggleBtn {
        right: 20px;
    }

    .container {
        width: 100%;
        max-width: 400px;
        text-align: center;
    }

    h1 {
        font-size: 24px;
        margin-bottom: 25px;
    }

    input {
        width: 100%;
        background-color: #1a2c33;
        border: 2px solid #33464d;
        border-radius: 15px;
        padding: 14px;
        margin-bottom: 10px;
        color: white;
        box-sizing: border-box;
    }

    /* Убираем стандартную обводку при фокусе и добавляем свою */
    input:focus {
        outline: none;
        border-color: #49c0f8;
    }

    /* Подсветка красным, если данные невалидны (по желанию) */
    input:focus:invalid {
        border-color: #ff4b4b;
    }

    .password-wrapper {
        position: relative;
    }

    .forgot-link {
        position: absolute;
        right: 15px;
        top: 14px;
        color: #52656d;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
    }

    .btn-submit {
        width: 100%;
        background-color: #49c0f8;
        border: none;
        border-radius: 15px;
        padding: 15px;
        color: #131f24;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 0 #1899d6;
        margin-top: 10px;
    }

    .divider {
        margin: 25px 0;
        border-top: 2px solid #33464d;
        position: relative;
    }

    .divider span {
        position: absolute;
        top: -10px;
        left: 45%;
        background: #131f24;
        padding: 0 10px;
        color: #777;
        font-size: 12px;
    }

    .social-buttons {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }

    .btn-social {
        flex: 1;
        background: transparent;
        border: 2px solid #33464d;
        color: #49c0f8;
        padding: 12px;
        border-radius: 15px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
    }

    /* Специфичный цвет для Telegram */
    #btnTelegram {
        color: #2AABEE;
        border-color: #33464d;
    }

    #btnTelegram:hover {
        background-color: rgba(42, 171, 238, 0.1);
    }

    .legal-text {
        font-size: 11px;
        color: #52656d;
    }

    .legal-text a {
        color: #52656d;
        text-decoration: underline;
    }
</style>

<body>

    <header>
        <a href="./index.html" id="backBtn" class="btn-top">
            НАЗАД
        </a>

        <button id="toggleBtn" class="btn-top">ВОЙТИ</button>
    </header>

    <main class="container">

        <div id="registration-form">
            <h1>Создайте аккаунт</h1>
            <form>
                <input type="text" placeholder="Имя пользователя" required minlength="6" pattern="^[a-zA-Z0-9_]+$">
                <input type="email" placeholder="Электронная почта" required>
                <input type="password" placeholder="Пароль" required>
                <button type="submit" class="btn-submit">СОЗДАТЬ АККАУНТ</button>
            </form>
        </div>

        <div id="login-form" style="display: none;">
            <h1>Вход</h1>
            <form>
                <input type="text" placeholder="Email или Имя пользователя" required>
                <div class="password-wrapper">
                    <input type="password" placeholder="Пароль" required>
                    <span class="forgot-link">ЗАБЫЛИ?</span>
                </div>
                <button type="submit" class="btn-submit">ВХОД</button>
            </form>
        </div>

        <div class="divider"><span>или</span></div>

        <div class="social-buttons">
            <button type="button" class="btn-social" id="btnGoogle">GOOGLE</button>
            <button type="button" class="btn-social" id="btnTelegram">TELEGRAM</button>
        </div>

        <footer class="legal-text">
            Выполняя вход в аккаунт, вы соглашаетесь с нашими <a href="#">Условиями</a> и <a href="#">Политикой</a>.
        </footer>
    </main>
    <script src="/static/js/main.js" type="module"></script>
</body>

</html>
