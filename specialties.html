<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnPlay - Курсы по языкам программирования</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./static/css/styles.css">
  <style>
    :root{
      --bg:#F8F5FF;--card:#FFFFFF;--border:#C6A5F9;--border-light:#C6A5F944;
      --text:#0D0425;--muted:#5E5CE7;--primary:#C6A5F9;--primary-dark:#5E5CE7;
      --success:#27ae60;--danger:#e74c3c;--warning:#f39c12;
      --shadow:rgba(198,165,249,.2);
    }
    [data-theme="dark"]{
      --bg:#0D0425;--card:#161B22;--border:#5E5CE7;--border-light:#5E5CE744;
      --text:#F0F6FC;--muted:#8B949E;--primary:#C6A5F9;--primary-dark:#8B8FFF;
      --success:#27ae60;--danger:#e74c3c;--shadow:rgba(0,0,0,.4);
    }

    body {font-family: 'Inter', sans-serif; background:#f8fafc; color:var(--text); margin:0;}
    .container-all-main {width:90%; max-width:1400px; margin:0 auto; padding:60px 0;}

    .page-title {
      text-align:center; font-size:2.5rem; font-weight:700; margin-bottom:1.5rem;
      background:linear-gradient(135deg,#8B5CF6,#3B82F6);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }

    /* Поиск + фильтры */
    .search-and-filters {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .search-box {
      position: relative;
      max-width: 500px;
      margin: 0 auto;
    }
    .search-box input {
      width: 100%;
      padding: 14px 50px 14px 20px;
      border: 2px solid var(--border);
      border-radius: 50px;
      font-size: 1rem;
      background: var(--card);
      color: var(--text);
      outline: none;
      transition: all .3s;
    }
    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--shadow);
    }
    .search-box i {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 1.2rem;
    }

    .filters-group {
      display:flex; gap:10px; overflow-x:auto; padding:8px 0 20px; scrollbar-width:none;
      justify-content: center;
    }
    .filters-group::-webkit-scrollbar {display:none;}
    .filter-btn {
      padding:10px 20px; border:1.5px solid var(--border); background:var(--card);
      color:var(--text); border-radius:50px; font-weight:600; font-size:0.95rem;
      white-space:nowrap; cursor:pointer; transition:all .3s;
    }
    .filter-btn.active,.filter-btn:hover {
      background:var(--primary); color:white; border-color:var(--primary); transform:translateY(-2px);
    }

    /* Сетка карточек */
    .courses-grid {
      display:grid; grid-template-columns:repeat(4,1fr); gap:1.5rem;
    }
    @media (max-width:1200px){.courses-grid{grid-template-columns:repeat(3,1fr);}}
    @media (max-width:900px){.courses-grid{grid-template-columns:repeat(2,1fr);}}
    @media (max-width:640px){
      .courses-grid{grid-template-columns:none; display:flex; overflow-x:auto; gap:1.2rem;
      padding:10px 0 20px; scroll-snap-type:x mandatory; scrollbar-width:none;}
      .courses-grid::-webkit-scrollbar{display:none;}
    }

    .course-card {
      background:var(--card); border-radius:16px; overflow:hidden;
      box-shadow:var(--shadow); transition:all .35s; display:flex; flex-direction:column;
      scroll-snap-align:start;
    }
    .course-card:hover{transform:translateY(-8px); box-shadow:0 15px 35px rgba(0,0,0,.12);}

    .course-image{height:140px; position:relative; overflow:hidden;}
    .course-image img{width:100%; height:100%; object-fit:cover; transition:transform .5s;}
    .course-card:hover img{transform:scale(1.08);}

    .lang-badge{
      position:absolute; top:10px; left:10px; background:rgba(0,0,0,.75); color:white;
      padding:6px 12px; border-radius:30px; font-size:0.8rem; font-weight:600; backdrop-filter:blur(8px);
    }

    .course-content{padding:1.1rem; flex-grow:1; display:flex; flex-direction:column;}
    .course-title{font-size:1.1rem; font-weight:700; margin-bottom:0.5rem; line-height:1.3;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
    .course-subtitle{font-size:0.88rem; color:var(--muted); margin-bottom:0.8rem; flex-grow:1;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
    .course-meta{display:flex; justify-content:space-between; font-size:0.85rem; color:var(--muted); margin-bottom:0.8rem;}
    .stars{color:#f59e0b;}
    .course-price{font-size:1.35rem; font-weight:800; color:var(--success);}
    .course-action{margin-top:auto; padding-top:1rem; border-top:1px solid var(--border);
      display:flex; justify-content:space-between; align-items:center; font-size:0.9rem;}
    .course-action button{
      background:var(--success); color:white; border:none; padding:8px 16px;
      border-radius:10px; font-weight:600; cursor:pointer; transition:all .3s;
    }
    .course-action button:hover{background:#059669; transform:translateY(-2px);}

    .back-to-top{
      position:fixed; bottom:25px; right:25px; width:50px; height:50px; background:var(--primary);
      color:white; border-radius:50%; display:flex; align-items:center; justify-content:center;
      font-size:1.5rem; cursor:pointer; opacity:0; visibility:hidden; transition:all .4s; z-index:99;
    }
    .back-to-top.visible{opacity:1; visibility:visible;}

    /* Пустое состояние */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <!-- Шапка остаётся без изменений -->
  <header class="site-header hero-header">
    <div class="container-all-header">
      <div class="header-inner">
        <a href="./index.html" class="logo"><img src="./static/img/logo.png" alt="LearnPlay"></a>
        <nav class="hero-header__nav desktop-only">
          <a class="hero-header__link" href="./index.html">Главная</a>
          <a class="hero-header__link active" href="#">Спецальности</a>
          <a class="hero-header__link" href="games/index.html">Игры</a>
          <a class="hero-header__link" href="tests/index.html">Тесты</a>
          <a class="hero-header__link" href="presentations/index.html">Презентации</a>
        </nav>
        <div class="hero-header__actions" id="authButtons">
          <a class="hero-header__signup" href="./register.html" id="openRegisterHero" data-guest="true">
            <span class="hero-header__icon">✺</span>
            <span class="mobile-text">Регистрация</span>
          </a>
          <a class="hero-header__profile desktop-only" href="./profile.html" data-auth="true">
            <i class="fa fa-user-circle"></i>
          </a>
        </div>
      </div>
    </div>
  </header>
  <main class="container-all-main">
    <h1 class="page-title">Курсы по языкам программирования</h1>

    <!-- Поиск + фильтры -->
    <div class="search-and-filters">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск курсов по названию или описанию..." autocomplete="off">
        <i class="fas fa-search"></i>
      </div>

      <div class="filters-group">
        <button class="filter-btn active" data-filter="all">Все языки</button>
        <button class="filter-btn" data-filter="python">Python</button>
        <button class="filter-btn" data-filter="js">JavaScript</button>
        <button class="filter-btn" data-filter="java">Java / Kotlin</button>
        <button class="filter-btn" data-filter="go">Go</button>
        <button class="filter-btn" data-filter="rust">Rust</button>
        <button class="filter-btn" data-filter="cpp">C++</button>
        <button class="filter-btn" data-filter="csharp">C#</button>
      </div>
    </div>

    <div class="courses-grid" id="coursesList"></div>
  </main>

  <div class="back-to-top" id="backToTop">Up</div>

  <script>
// Загружаем курсы от учителей + старые курсы
      let courses = [
        {id:101,title:"Python с нуля до Junior+",subtitle:"Веб, автоматизация, ML — всё в одном курсе",lang:"python",students:98.7,likes:8421,rating:4.9,image:"https://images.unsplash.com/photo-1526379091885-c9b69f4e67c4?w=800"},
        {id:102,title:"JavaScript & TypeScript 2025",subtitle:"React, Next.js, Node.js — полный стек",lang:"js",students:112.3,likes:9732,rating:4.9,image:"https://images.unsplash.com/photo-1627398242454-45c5f7ab7da7?w=800"},
        {id:103,title:"Java для Android",subtitle:"От Kotlin до нативных приложений",lang:"java",students:87.4,likes:6891,rating:4.8,image:"https://images.unsplash.com/photo-1512941679403-9e5a9c6c75d9?w=800"},
        {id:104,title:"Go: от новичка до профи",subtitle:"Микросервисы, concurrency",lang:"go",students:45.1,likes:5234,rating:4.9,image:"https://images.unsplash.com/photo-1633356122544-f134324a6cee?w=800"},
        {id:105,title:"Rust — безопасный системный программирование",subtitle:"Безопасность памяти",lang:"rust",students:38.9,likes:7123,rating:5.0,image:"https://images.unsplash.com/photo-1555066931-4365d14bab1b?w=800"}
      ];

    // Добавляем курсы, которые создали учителя
    const userCourses = JSON.parse(localStorage.getItem('userCourses') || '[]');
    courses = [...userCourses, ...courses];

    const coursesList = document.getElementById('coursesList');
    const searchInput = document.getElementById('searchInput');
    let currentFilter = 'all';
    let searchQuery = '';

    function renderCourses() {
      let filtered = courses;

      // Фильтр по языку
      if (currentFilter !== 'all') {
        filtered = filtered.filter(c => c.lang === currentFilter);
      }

      // Поиск по названию и описанию
      if (searchQuery.trim() !== '') {
        const query = searchQuery.toLowerCase();
        filtered = filtered.filter(c => 
          c.title.toLowerCase().includes(query) || 
          c.subtitle.toLowerCase().includes(query)
        );
      }

      // Сортировка по популярности
      filtered.sort((a, b) => b.students - a.students);

      if (filtered.length === 0) {
        coursesList.innerHTML = `<div class="no-results">
          <p>Курсы не найдены по запросу «${searchQuery || 'фильтру'}»</p>
          <p>Попробуйте изменить запрос или сбросить фильтры</p>
        </div>`;
        return;
      }

      coursesList.innerHTML = filtered.map(c => `
        <a href="course.html?id=${c.id}" class="course-card">
          <div class="course-image">
            <img src="${c.image}" alt="${c.title}" loading="lazy">
            <div class="lang-badge">${
              c.lang === 'python' ? 'Python' :
              c.lang === 'js' ? 'JS/TS' :
              c.lang === 'java' ? 'Java' :
              c.lang === 'go' ? 'Go' :
              c.lang === 'rust' ? 'Rust' :
              c.lang === 'cpp' ? 'C++' : 'C#'
            }</div>
          </div>
          <div class="course-content">
            <h3 class="course-title">${c.title}</h3>
            <p class="course-subtitle">${c.subtitle}</p>
            <div class="course-meta">
              <div><span class="stars">★★★★★</span> ${c.rating}</div>
              <div>Heart ${c.likes.toLocaleString()}</div>
            </div>
            <div class="course-price">Бесплатно</div>
            <div class="course-action">
              <button>Записаться</button>
              <div>${c.students.toFixed(1)} тыс. студентов</div>
            </div>
          </div>
        </a>
      `).join('');
    }

    // Обработчики фильтров
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderCourses();
      });
    });

    // Поиск в реальном времени
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      
      // Если есть поиск — снимаем активный фильтр "Все языки" и делаем активным первый (чтобы не путать пользователя)
      if (searchQuery && currentFilter !== 'all') {
        document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');
        document.querySelectorAll('.filter-btn').forEach(b => {
          if (b.dataset.filter !== 'all') b.classList.remove('active');
        });
        currentFilter = 'all';
      }
      
      renderCourses();
    });

    // Кнопка очистки поиска (по желанию можно добавить крестик в инпут)
    // Для простоты — можно очистить по клику на поле при пустом значении

    // Back to top
    window.addEventListener('scroll', () => {
      document.getElementById('backToTop').classList.toggle('visible', window.scrollY > 400);
    });
    document.getElementById('backToTop').addEventListener('click', () => window.scrollTo({top:0,behavior:'smooth'}));

    // Первичный рендер
    renderCourses();
  </script>
  <script src="./static/js/main.js"></script>
</body>
</html>
