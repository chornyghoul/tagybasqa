<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авторизация</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #121212;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 380px;
      background: transparent;
      padding: 20px;
    }

    .header-text {
      text-align: left;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888888;
      font-size: 14px;
    }

    .error-box,
    .success-box {
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
      margin-bottom: 24px;
      font-weight: 500;
    }

    .error-box {
      background: rgba(255, 68, 68, 0.05);
      border: 1px solid #4a1c1c;
      color: #ff5555;
    }

    .success-box {
      background: rgba(68, 255, 136, 0.05);
      border: 1px solid #1c4a2a;
      color: #44ff88;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #ffffff;
    }

    input {
      width: 100%;
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      color: white;
      outline: none;
      transition: border-color 0.2s;
    }

    input::placeholder {
      color: #666666;
    }

    input:focus {
      border-color: #555555;
    }

    .password-wrapper {
      position: relative;
    }

    .eye-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #666;
      cursor: pointer;
      font-size: 16px;
    }

    .eye-icon:hover {
      color: #aaa;
    }

    .password-strength {
      height: 3px;
      margin-top: 6px;
      border-radius: 3px;
      background: transparent;
      transition: all 0.3s;
    }

    .agreement {
      font-size: 12px;
      color: #777;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .agreement a,
    .footer-text a {
      color: #3b82f6;
      text-decoration: none;
    }

    .agreement a:hover,
    .footer-text a:hover {
      text-decoration: underline;
    }

    .btn-continue {
      width: 100%;
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 24px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-continue:hover {
      opacity: 0.9;
    }

    .btn-continue:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .footer-text {
      text-align: center;
      font-size: 13px;
      color: #777;
      margin-top: 24px;
    }
  </style>
</head>

<body>

  <div class="auth-container">

    <div class="header-text">
      <h1 id="pageTitle">Создание аккаунта</h1>
      <p class="subtitle" id="pageSubtitle">Пожалуйста, введите ваши данные</p>
    </div>

    <div class="error-box" id="errorBox" style="display:none;"></div>
    <div class="success-box" id="successBox" style="display:none;"></div>

    <form id="authForm">
      <div class="form-group" id="nameGroup" style="display: none;">
        <label>Имя</label>
        <input type="text" id="name" placeholder="Мирас">
      </div>

      <div class="form-group">
        <label>E-Mail</label>
        <input type="email" id="email" placeholder="miras@gmail.com" required>
      </div>

      <div class="form-group">
        <label>Пароль</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Минимум 10 символов" required>
          <span class="eye-icon" id="togglePassword">👁</span>
        </div>
        <div class="password-strength" id="strengthBar"></div>
      </div>

      <div class="agreement" id="agreementText">
        Продолжая, вы соглашаетесь с <a href="#">условиями использования</a> и
        <a href="#">политикой конфиденциальности</a>
      </div>

      <button type="submit" class="btn-continue" id="submitBtn">Продолжить</button>
    </form>

    <div class="footer-text">
      Уже есть аккаунт? <a href="#" id="switchLink">Войти</a>
    </div>
  </div>

  <script>
    // ================== FIREBASE ==================
    const firebaseConfig = {
      apiKey: "AIzaSyAywbSZkiReHjTq4oc46Kbw9iZ0iDHVTpY",
      authDomain: "pystart-dd2db.firebaseapp.com",
      projectId: "pystart-dd2db",
      storageBucket: "pystart-dd2db.firebasestorage.app",
      messagingSenderId: "9188811255",
      appId: "1:9188811255:web:6f7280f1f7f67b80d90ef2",
      measurementId: "G-7KEWYCP231"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    auth.languageCode = 'ru';

    // ================== ПЕРЕМЕННЫЕ ==================
    let isRegister = true;

    // ================== ФУНКЦИИ ==================
    function showError(text) {
      document.getElementById('errorBox').innerHTML = text;
      document.getElementById('errorBox').style.display = 'block';
      document.getElementById('successBox').style.display = 'none';
    }

    function showSuccess(text) {
      document.getElementById('successBox').innerHTML = text;
      document.getElementById('successBox').style.display = 'block';
      document.getElementById('errorBox').style.display = 'none';
    }

    function clearMessages() {
      document.getElementById('errorBox').style.display = 'none';
      document.getElementById('successBox').style.display = 'none';
    }

    function updatePasswordStrength(password) {
      const bar = document.getElementById('strengthBar');
      if (!password) {
        bar.style.background = 'transparent';
        bar.style.width = '0%';
        return;
      }

      let strength = 0;
      if (password.length >= 10) strength++;
      if (/[A-Z]/.test(password)) strength++;
      if (/[0-9]/.test(password)) strength++;
      if (/[^A-Za-z0-9]/.test(password)) strength++;

      const colors = ['#ff4444', '#ffaa00', '#aaff00', '#44ff88'];
      bar.style.background = colors[strength - 1] || '#44ff88';
      bar.style.width = (strength * 25) + '%';
    }

    function switchMode(toRegister) {
      isRegister = toRegister;

      if (isRegister) {
        document.getElementById('pageTitle').textContent = "Создание аккаунта";
        document.getElementById('pageSubtitle').textContent = "Пожалуйста, введите ваши данные";
        document.getElementById('agreementText').style.display = "block";

        document.querySelector('.footer-text').innerHTML = 'Уже есть аккаунт? <a href="#" id="switchLink">Войти</a>';
      } else {
        document.getElementById('pageTitle').textContent = "Вход в аккаунт";
        document.getElementById('pageSubtitle').textContent = "Рады видеть вас снова";
        document.getElementById('agreementText').style.display = "none";

        document.querySelector('.footer-text').innerHTML = 'Нет аккаунта? <a href="#" id="switchLink">Создать</a>';
      }

      document.getElementById('switchLink').addEventListener('click', (e) => {
        e.preventDefault();
        switchMode(!isRegister);
      });

      clearMessages();
      document.getElementById('strengthBar').style.width = '0%';
    }

    // ================== ОСНОВНАЯ ЛОГИКА ==================
    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessages();

      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      if (!email || !password) return showError("Заполните все поля");
      if (isRegister && password.length < 10) return showError("Пароль должен содержать минимум 10 символов");

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = "Обработка...";

      try {
        if (isRegister) {
          await auth.createUserWithEmailAndPassword(email, password);
          showSuccess("Аккаунт успешно создан! Перенаправление...");
          
          // Задержка 1.5 секунды, чтобы пользователь успел увидеть плашку успеха
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);

        } else {
          await auth.signInWithEmailAndPassword(email, password);
          showSuccess("Вход выполнен успешно! Перенаправление...");
          
          // Задержка 1 секунда перед перенаправлением на главную
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
        }
      } catch (error) {
        console.error(error);
        let msg = "Произошла ошибка";
        
        if (error.code === 'auth/email-already-in-use') msg = "Email already exists";
        else if (error.code === 'auth/weak-password') msg = "Пароль слишком слабый";
        else if (error.code === 'auth/invalid-email') msg = "Неверный email";
        else if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential')
          msg = "Неверный email или пароль";

        showError(msg);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Продолжить";
      }
    });

    document.getElementById('switchLink').addEventListener('click', (e) => {
      e.preventDefault();
      switchMode(!isRegister);
    });

    document.getElementById('togglePassword').addEventListener('click', function () {
      const pwd = document.getElementById('password');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        this.textContent = '🙈';
      } else {
        pwd.type = 'password';
        this.textContent = '👁';
      }
    });

    document.getElementById('password').addEventListener('input', (e) => {
      if (isRegister) updatePasswordStrength(e.target.value);
    });

    window.onload = () => {
      document.getElementById('email').focus();
    };
  </script>

</body>

</html>
