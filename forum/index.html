<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Форум — IT College Hub</title>
  <link rel="stylesheet" href="../static/css/styles.css" />
  <script defer src="../static/js/data.js"></script>
  <script defer src="../static/js/storage.js"></script>
  <script defer src="../static/js/components.js"></script>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="../index.html" class="logo">IT College Hub</a>
    <nav class="nav">
      <a class="nav-link" href="../specialties/index.html">Специальности</a>
    </nav>
  </div>
</header>
<main class="container section">
  <h1>Форум (демо)</h1>
  <div class="card">
    <p class="meta">Локальный форум без сервера. Сообщения хранятся в памяти браузера.</p>
    <div class="form" id="newThread">
      <div class="form-row">
        <label>Тема</label>
        <input class="input" name="title" placeholder="Например, Вопрос по маршрутизации BGP" />
      </div>
      <div class="form-row">
        <label>Специальность</label>
        <select name="spec"></select>
      </div>
      <div class="form-row">
        <label>Сообщение</label>
        <textarea class="input" name="body" rows="4" placeholder="Опишите проблему или идею..."></textarea>
      </div>
      <button class="btn btn-primary" id="createBtn">Создать тему</button>
    </div>
  </div>
  <div id="threads" class="section"></div>
</main>
<script>
  const KEY_THREADS = 'itch.threads';
  const get = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
  const set = (k, v) => localStorage.setItem(k, JSON.stringify(v));

  document.addEventListener('DOMContentLoaded', () => {
    const sel = document.querySelector('select[name="spec"]');
    AppData.specialties.forEach(sp => {
      const o = document.createElement('option'); o.value = sp.key; o.textContent = sp.title; sel.appendChild(o);
    });

    const threadsMount = document.getElementById('threads');

    function render() {
      const threads = get(KEY_THREADS, []);
      threadsMount.innerHTML = '';
      threads.forEach((t, idx) => {
        const card = UI.el('div', { class: 'card' }, [
          UI.el('div', { class: 'meta' }, new Date(t.ts).toLocaleString()),
          UI.el('h3', {}, t.title),
          UI.el('p', { class: 'meta' }, AppData.specialties.find(s => s.key === t.spec)?.title || ''),
          UI.el('p', {}, t.body),
        ]);
        threadsMount.appendChild(card);
      });
    }
    render();

    document.getElementById('createBtn').addEventListener('click', () => {
      const title = document.querySelector('input[name="title"]').value.trim();
      const spec = document.querySelector('select[name="spec"]').value;
      const body = document.querySelector('textarea[name="body"]').value.trim();
      if (!title || !body) return alert('Заполните тему и сообщение');
      const list = get(KEY_THREADS, []);
      list.unshift({ title, spec, body, ts: Date.now() });
      set(KEY_THREADS, list);
      document.getElementById('newThread').reset?.();
      render();
    });
  });
</script>
</body>
</html>
