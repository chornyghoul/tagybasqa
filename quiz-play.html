<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tagybasqa — Ойынға қосылу</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Onest:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg:      #0d1117;
      --bg2:     #161b22;
      --bg3:     #1c2330;
      --border:  rgba(255,255,255,.08);
      --border2: rgba(255,255,255,.14);
      --text:    #f0f6fc;
      --text2:   #8b949e;
      --text3:   #484f58;
      --blue:    #1cb0f6;
      --green:   #57cc02;
      --red:     #ff4b4b;
      --orange:  #ff9600;
      --purple:  #9b5de5;
      --gold:    #ffd900;
      --font:    'Onest', sans-serif;
      --mono:    'DM Mono', monospace;
      --r:       14px;
      --r-lg:    20px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── Ambient background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 10%, rgba(28,176,246,.07) 0%, transparent 60%),
        radial-gradient(ellipse 40% 50% at 80% 80%, rgba(155,93,229,.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header ── */
    .ph {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; height: 56px;
      background: rgba(13,17,23,.85); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .ph-logo {
      display: flex; align-items: center; gap: 8px;
      font-size: 17px; font-weight: 900; letter-spacing: -.4px;
      color: var(--blue); text-decoration: none;
    }
    .ph-logo svg { color: var(--blue); }
    .ph-badge {
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      color: var(--text2); background: var(--bg3); border: 1px solid var(--border);
      padding: 3px 10px; border-radius: 99px; text-transform: uppercase; letter-spacing: .1em;
    }

    /* ── Container ── */
    .wrap {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px 20px; position: relative; z-index: 1;
      width: 100%; max-width: 560px; margin: 0 auto;
    }

    /* ── Screens ── */
    .screen { display: none; width: 100%; animation: fadeUp .3s ease both; }
    .screen.active { display: block; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

    /* ── Card ── */
    .card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--r-lg); padding: 32px; width: 100%;
    }
    .card-title {
      font-size: 22px; font-weight: 900; margin-bottom: 6px; letter-spacing: -.3px;
    }
    .card-sub { font-size: 13px; color: var(--text2); margin-bottom: 28px; line-height: 1.5; }

    /* ── Form ── */
    .field { margin-bottom: 16px; }
    .field label {
      display: flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      color: var(--text2); text-transform: uppercase; letter-spacing: .12em;
      margin-bottom: 8px;
    }
    .field label svg { width: 12px; height: 12px; }
    .input {
      width: 100%; padding: 14px 16px;
      font-family: var(--font); font-size: 15px; font-weight: 600;
      background: var(--bg3); border: 1.5px solid var(--border);
      border-radius: var(--r); color: var(--text);
      transition: border-color .15s, box-shadow .15s;
    }
    .input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(28,176,246,.12); }
    .input::placeholder { color: var(--text3); font-weight: 500; }
    .input-pin {
      font-family: var(--mono); font-size: 28px; font-weight: 900;
      letter-spacing: .2em; text-align: center;
    }

    /* ── Buttons ── */
    .btn {
      width: 100%; padding: 15px 24px;
      font-family: var(--font); font-size: 15px; font-weight: 800;
      border: none; border-radius: var(--r); cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all .15s; margin-top: 8px;
    }
    .btn-primary {
      background: var(--blue); color: #fff;
      box-shadow: 0 4px 20px rgba(28,176,246,.3);
    }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-primary:active { transform: scale(.98); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn-ghost {
      background: transparent; color: var(--text2);
      border: 1.5px solid var(--border); margin-top: 12px;
    }
    .btn-ghost:hover { border-color: var(--border2); color: var(--text); }

    /* ── Waiting screen ── */
    .wait-icon {
      width: 80px; height: 80px; border-radius: 50%;
      background: rgba(28,176,246,.1); border: 2px solid rgba(28,176,246,.2);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px; animation: iconPulse 2.5s ease infinite;
    }
    .wait-icon svg { color: var(--blue); width: 36px; height: 36px; }
    @keyframes iconPulse {
      0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(28,176,246,.3); }
      50% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(28,176,246,0); }
    }
    .wait-dots { display: flex; gap: 6px; justify-content: center; margin-top: 20px; }
    .wait-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--blue);
      animation: waitBounce 1.4s ease-in-out infinite;
    }
    .wait-dot:nth-child(2) { animation-delay: .2s; }
    .wait-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes waitBounce { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-8px);opacity:1} }
    .player-chip {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(87,204,2,.1); border: 1px solid rgba(87,204,2,.25);
      border-radius: 99px; padding: 8px 16px; margin-bottom: 20px;
    }
    .player-chip svg { color: var(--green); width: 14px; height: 14px; }
    .player-chip span { font-size: 13px; font-weight: 700; color: var(--green); }

    /* ── Play screen ── */
    .q-progress {
      display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
    }
    .q-progress-bar {
      flex: 1; height: 4px; background: var(--bg3); border-radius: 99px; overflow: hidden;
    }
    .q-progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--blue), var(--purple));
      border-radius: 99px; transition: width .4s ease;
    }
    .q-num {
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      color: var(--text2); white-space: nowrap;
    }
    .q-text {
      font-size: 19px; font-weight: 700; line-height: 1.5;
      margin-bottom: 24px; color: var(--text);
    }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 400px) { .options { grid-template-columns: 1fr; } }

    .opt {
      min-height: 90px; padding: 16px;
      border-radius: var(--r); border: none;
      font-family: var(--font); font-size: 15px; font-weight: 700;
      color: #fff; cursor: pointer;
      display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
      text-align: left; position: relative; overflow: hidden;
      transition: transform .12s, box-shadow .12s, filter .2s;
    }
    .opt::before {
      content: '';
      position: absolute; inset: 0;
      background: rgba(255,255,255,0);
      transition: background .15s;
    }
    .opt:hover:not(.opt-disabled)::before { background: rgba(255,255,255,.08); }
    .opt:active:not(.opt-disabled) { transform: scale(.97); }
    .opt-disabled { filter: grayscale(.6) opacity(.6); cursor: not-allowed; }
    .opt-selected { box-shadow: 0 0 0 3px rgba(255,255,255,.5) inset; }
    .opt-key {
      width: 28px; height: 28px; border-radius: 8px;
      background: rgba(0,0,0,.2); display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 12px; font-weight: 800; flex-shrink: 0;
    }
    .opt-colors { background: #e3342f; }
    .opt-colors:nth-child(2) { background: #3490dc; }
    .opt-colors:nth-child(3) { background: #f6993f; }
    .opt-colors:nth-child(4) { background: #38c172; }

    .opt-label { font-size: 14px; font-weight: 700; line-height: 1.4; }

    /* Answer submitted state */
    .answer-submitted {
      text-align: center; padding: 32px 0;
    }
    .answer-icon {
      width: 64px; height: 64px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px; animation: iconPop .4s cubic-bezier(.175,.885,.32,1.275) both;
    }
    @keyframes iconPop { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
    .answer-icon svg { width: 32px; height: 32px; }
    .answer-icon.correct { background: rgba(87,204,2,.15); border: 2px solid rgba(87,204,2,.3); }
    .answer-icon.correct svg { color: var(--green); }
    .answer-icon.pending { background: rgba(28,176,246,.12); border: 2px solid rgba(28,176,246,.25); }
    .answer-icon.pending svg { color: var(--blue); }
    .answer-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
    .answer-sub { font-size: 13px; color: var(--text2); }

    /* ── End screen ── */
    .end-icon {
      width: 96px; height: 96px; border-radius: 50%;
      background: rgba(255,217,0,.1); border: 2px solid rgba(255,217,0,.25);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px; animation: iconPop .5s cubic-bezier(.175,.885,.32,1.275) .1s both;
    }
    .end-icon svg { color: var(--gold); width: 44px; height: 44px; }
    .score-card {
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: var(--r); padding: 20px; text-align: center; margin: 20px 0;
    }
    .score-label {
      font-family: var(--mono); font-size: 10px; color: var(--text2);
      text-transform: uppercase; letter-spacing: .12em; margin-bottom: 8px;
    }
    .score-num {
      font-size: 52px; font-weight: 900; font-family: var(--mono);
      background: linear-gradient(135deg, var(--gold), var(--orange));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; line-height: 1;
    }
    .score-unit { font-size: 14px; font-weight: 600; color: var(--text2); margin-top: 4px; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--bg2); color: var(--text);
      border: 1px solid var(--border2);
      padding: 12px 24px; border-radius: 99px;
      font-size: 13px; font-weight: 700;
      opacity: 0; pointer-events: none; z-index: 999;
      transition: all .25s; white-space: nowrap;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast svg { width: 14px; height: 14px; flex-shrink: 0; }
    #toast.toast-ok { background: rgba(87,204,2,.15); border-color: rgba(87,204,2,.3); color: var(--green); }
    #toast.toast-ok svg { color: var(--green); }
    #toast.toast-err { background: rgba(255,75,75,.12); border-color: rgba(255,75,75,.25); color: var(--red); }
    #toast.toast-err svg { color: var(--red); }
  </style>
</head>
<body>

<header class="ph">
  <a class="ph-logo" href="./index.html">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    Tagybasqa
  </a>
  <div class="ph-badge">Ойын сессиясы</div>
</header>

<div class="wrap">

  <!-- 1. JOIN SCREEN -->
  <div id="joinScreen" class="screen active">
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
        <div style="width:44px;height:44px;border-radius:12px;background:rgba(28,176,246,.1);border:1px solid rgba(28,176,246,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1cb0f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <div>
          <div class="card-title" style="margin-bottom:2px">Ойынға қосылу</div>
          <div style="font-size:13px;color:var(--text2)">PIN-код мен атыңызды енгізіңіз</div>
        </div>
      </div>

      <div class="field">
        <label>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a5 5 0 0 1 5 5v2H7V7a5 5 0 0 1 5-5z"/><rect x="3" y="9" width="18" height="13" rx="2"/><circle cx="12" cy="15" r="1.5"/></svg>
          PIN-код
        </label>
        <input type="text" id="pinInput" class="input input-pin" placeholder="000000" inputmode="numeric" maxlength="6" autocomplete="off">
      </div>

      <div class="field">
        <label>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Атыңыз
        </label>
        <input type="text" id="nameInput" class="input" placeholder="Мысалы: Алибек" maxlength="20" autocomplete="off">
      </div>

      <button class="btn btn-primary" id="joinBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Ойынға кіру
      </button>
    </div>
  </div>

  <!-- 2. WAITING SCREEN -->
  <div id="waitingScreen" class="screen">
    <div class="card" style="text-align:center">
      <div class="wait-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div id="playerChip" class="player-chip" style="display:inline-flex">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span id="waitPlayerName">Ойыншы</span>
      </div>
      <h2 style="font-size:20px;font-weight:900;margin-bottom:10px">Жүргізуші күтілуде</h2>
      <p style="font-size:13px;color:var(--text2);line-height:1.6;max-width:280px;margin:0 auto">
        Жүргізуші ойынды бастаған соң сұрақтар автоматты түрде пайда болады
      </p>
      <div class="wait-dots" style="margin-top:28px">
        <div class="wait-dot"></div>
        <div class="wait-dot"></div>
        <div class="wait-dot"></div>
      </div>
    </div>
  </div>

  <!-- 3. PLAY SCREEN -->
  <div id="playScreen" class="screen">
    <div class="card">
      <div class="q-progress">
        <div class="q-num" id="qNumLabel">1/1</div>
        <div class="q-progress-bar">
          <div class="q-progress-fill" id="qProgressFill" style="width:0%"></div>
        </div>
      </div>
      <div class="q-text" id="questionText">Жүктелуде...</div>
      <div class="options" id="optionsContainer"></div>
      <div id="answerState" style="display:none"></div>
    </div>
  </div>

  <!-- 4. END SCREEN -->
  <div id="endScreen" class="screen">
    <div class="card" style="text-align:center">
      <div class="end-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8m-4-4v4M5 3v4m0 0C5 10.5 7 12 12 12s7-1.5 7-5V3M5 7H3m16 0h2"/></svg>
      </div>
      <h2 style="font-size:22px;font-weight:900;margin-bottom:8px">Ойын аяқталды!</h2>
      <p style="font-size:13px;color:var(--text2);margin-bottom:4px">Нәтижелерді негізгі экраннан қараңыз</p>
      <div class="score-card">
        <div class="score-label">Сіздің нәтижеңіз</div>
        <div class="score-num" id="finalScore">0</div>
        <div class="score-unit">ұпай</div>
      </div>
      <a class="btn btn-primary" href="./leaderboard.html" style="text-decoration:none;margin-top:12px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Белсенділік рейтингі
      </a>
      <button class="btn btn-ghost" onclick="location.reload()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        Басынан бастау
      </button>
    </div>
  </div>

</div>

<div id="toast">
  <svg id="toastIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toastMsg"></span>
</div>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, doc, onSnapshot, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const FB = {
  apiKey: "AIzaSyAywbSZkiReHjTq4oc46Kbw9iZ0iDHVTpY",
  authDomain: "pystart-dd2db.firebaseapp.com",
  projectId: "pystart-dd2db",
  storageBucket: "pystart-dd2db.firebasestorage.app",
  messagingSenderId: "9188811255",
  appId: "1:9188811255:web:6f7280f1f7f67b80d90ef2"
};
const app = !getApps().length ? initializeApp(FB) : getApp();
const db  = getFirestore(app);

const OPT_COLORS = ['#e3342f','#3490dc','#f6993f','#38c172'];
const OPT_KEYS   = ['A','B','C','D'];
const params     = new URLSearchParams(location.search);

let sessionId = null, quizData = null;
let playerId  = localStorage.getItem('tgbq_pid') || Math.random().toString(36).slice(2,10);
localStorage.setItem('tgbq_pid', playerId);
let playerName = '', playerScore = 0, lastQIndex = -1, answered = false;

// Auto-fill PIN from URL
const urlPin = params.get('pin');
if (urlPin) {
  document.getElementById('pinInput').value = urlPin;
  setTimeout(() => document.getElementById('nameInput').focus(), 100);
}

// ── JOIN ─────────────────────────────────────────────────────
document.getElementById('joinBtn').addEventListener('click', joinGame);
document.getElementById('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') joinGame(); });

async function joinGame() {
  const pin  = document.getElementById('pinInput').value.trim();
  playerName = document.getElementById('nameInput').value.trim();
  if (!pin)        { toast('PIN-кодты енгізіңіз', 'err'); return; }
  if (!playerName) { toast('Атыңызды енгізіңіз', 'err'); return; }

  const btn = document.getElementById('joinBtn');
  btn.disabled = true;
  btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="animation:spin .8s linear infinite"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Қосылуда...`;

  try {
    const q    = query(collection(db, 'sessions'), where('pin', '==', pin));
    const snap = await getDocs(q);
    if (snap.empty) { toast('Мұндай PIN жоқ', 'err'); resetJoinBtn(); return; }

    const sessionDoc = snap.docs[0];
    sessionId = sessionDoc.id;
    const sData = sessionDoc.data();

    if (sData.status === 'finished') { toast('Ойын аяқталды', 'err'); resetJoinBtn(); return; }

    await updateDoc(doc(db, 'sessions', sessionId), {
      [`players.${playerId}`]: { name: playerName, joinedAt: Date.now() }
    });

    if (sData.quizId) {
      const qSnap = await getDoc(doc(db, 'quizzes', sData.quizId));
      if (qSnap.exists()) quizData = qSnap.data();
    }

    document.getElementById('waitPlayerName').textContent = playerName;
    listenSession();
    toast(`Қош келдіңіз, ${playerName}!`, 'ok');
  } catch (e) {
    console.error(e);
    toast('Қосылу қатесі', 'err');
    resetJoinBtn();
  }
}

function resetJoinBtn() {
  const btn = document.getElementById('joinBtn');
  btn.disabled = false;
  btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Ойынға кіру`;
}

// ── LISTEN ───────────────────────────────────────────────────
function listenSession() {
  onSnapshot(doc(db, 'sessions', sessionId), (snap) => {
    if (!snap.exists()) return;
    const data = snap.data();

    // Kicked
    if (data.players && data.players[playerId] === undefined && data.status !== 'finished') {
      alert('Сізді ойыннан шығарды.');
      location.reload();
      return;
    }

    if (data.status === 'waiting') {
      showScreen('waitingScreen');
    } else if (data.status === 'playing') {
      showScreen('playScreen');
      renderQuestion(data.currentQuestion);
    } else if (data.status === 'finished') {
      showScreen('endScreen');
      document.getElementById('finalScore').textContent = playerScore;
    }
  });
}

// ── QUESTION ─────────────────────────────────────────────────
function renderQuestion(qIdx) {
  if (!quizData?.questions || qIdx < 0) return;
  const total = quizData.questions.length;
  const q     = quizData.questions[qIdx];

  if (lastQIndex !== qIdx) { answered = false; lastQIndex = qIdx; }

  // Progress
  document.getElementById('qNumLabel').textContent     = `${qIdx + 1} / ${total}`;
  document.getElementById('qProgressFill').style.width = `${((qIdx + 1) / total) * 100}%`;
  document.getElementById('questionText').textContent  = q.text || q.question || '';

  const container   = document.getElementById('optionsContainer');
  const answerState = document.getElementById('answerState');

  if (answered) {
    container.style.display   = 'none';
    answerState.style.display = 'block';
    return;
  }

  container.style.display   = 'grid';
  answerState.style.display = 'none';

  container.innerHTML = (q.options || []).map((opt, i) => {
    const text  = typeof opt === 'string' ? opt : (opt.text || '');
    const color = OPT_COLORS[i % OPT_COLORS.length];
    const key   = OPT_KEYS[i] || String(i + 1);
    return `
      <button class="opt" data-idx="${i}" style="background:${color};box-shadow:0 4px 16px ${color}44">
        <div class="opt-key">${key}</div>
        <div class="opt-label">${esc(text)}</div>
      </button>`;
  }).join('');

  container.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => handleAnswer(+btn.dataset.idx, q));
  });
}

async function handleAnswer(idx, question) {
  if (answered) return;
  answered = true;

  // Visually lock all options
  document.querySelectorAll('.opt').forEach((b, i) => {
    if (i !== idx) b.classList.add('opt-disabled');
    else b.classList.add('opt-selected');
  });

  const isCorrect = typeof question.options[idx] === 'object'
    ? question.options[idx].correct === true
    : false;

  if (isCorrect) {
    playerScore += question.points || 100;
  }

  // Show answer submitted state after short delay
  setTimeout(() => {
    document.getElementById('optionsContainer').style.display = 'none';
    const as = document.getElementById('answerState');
    as.style.display = 'block';
    as.innerHTML = `
      <div class="answer-submitted">
        <div class="answer-icon ${isCorrect ? 'correct' : 'pending'}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            ${isCorrect
              ? '<polyline points="20 6 9 17 4 12"/>'
              : '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'}
          </svg>
        </div>
        <div class="answer-title">${isCorrect ? 'Дұрыс жауап!' : 'Жауап қабылданды'}</div>
        <div class="answer-sub">${isCorrect ? `+${question.points || 100} ұпай` : 'Жүргізушіні күтіңіз'}</div>
      </div>`;
  }, 400);

  // Save detailed result — per-answer + cumulative score
  try {
    const resultRef = doc(db, 'quizResults', `${sessionId}_${playerId}`);
    const existing  = await getDoc(resultRef);
    const prev      = existing.exists() ? (existing.data().answers || []) : [];
    await setDoc(resultRef, {
      sessionId,
      playerId,
      playerName,
      score:     playerScore,
      timestamp: Date.now(),
      answers:   [...prev, {
        questionIndex: lastQIndex,
        selectedIndex: idx,
        correct:       isCorrect,
        points:        isCorrect ? (question.points || 100) : 0
      }]
    }, { merge: true });

    // Also update activity summary per student (by name, cross-session)
    const actRef = doc(db, 'studentActivity', playerName.toLowerCase().replace(/\s+/g,'_'));
    await setDoc(actRef, {
      name:          playerName,
      totalScore:    isCorrect ? 1 : 0,   // will be incremented via merge below
      totalAnswered: 1,
      totalCorrect:  isCorrect ? 1 : 0,
      lastSeen:      Date.now(),
      sessions:      [sessionId]
    }, { merge: false }).catch(() => {});   // handled below with increment

    // Use increment for atomic counters
    const { increment, arrayUnion } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");
    await setDoc(actRef, {
      name:          playerName,
      totalAnswered: increment(1),
      totalCorrect:  increment(isCorrect ? 1 : 0),
      totalPoints:   increment(isCorrect ? (question.points || 100) : 0),
      lastSeen:      Date.now(),
      sessions:      arrayUnion(sessionId)
    }, { merge: true });
  } catch (e) { console.error('Save error:', e); }
}

// ── UTILS ─────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function toast(msg, type = '') {
  const t    = document.getElementById('toast');
  const icon = document.getElementById('toastIcon');
  const text = document.getElementById('toastMsg');
  text.textContent = msg;
  t.className = type === 'ok' ? 'show toast-ok' : type === 'err' ? 'show toast-err' : 'show';
  const paths = {
    ok:  '<polyline points="20 6 9 17 4 12"/>',
    err: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
    '': '<polyline points="20 6 9 17 4 12"/>'
  };
  icon.innerHTML = paths[type] || paths[''];
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.className = ''; }, 2800);
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>

@keyframes spin { to { transform: rotate(360deg); } }
