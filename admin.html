<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Загрузка уроков в Firebase</title>
</head>

<body style="font-family: sans-serif; padding: 40px;">
    <h2>Загрузка базы уроков</h2>
    <button id="uploadBtn" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">Загрузить уроки в
        Firebase</button>
    <p id="status"></p>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAywbSZkiReHjTq4oc46Kbw9iZ0iDHVTpY",
            authDomain: "pystart-dd2db.firebaseapp.com",
            projectId: "pystart-dd2db",
            storageBucket: "pystart-dd2db.firebasestorage.app",
            messagingSenderId: "9188811255",
            appId: "1:9188811255:web:6f7280f1f7f67b80d90ef2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        // Функция загрузки курса из базы
        async function loadCourseData() {
            try {
                const courseRef = doc(db, "courses", "python");
                const courseSnap = await getDoc(courseRef);

                if (courseSnap.exists()) {
                    LESSONS = courseSnap.data().data || [];
                    console.log("Уроки загружены:", LESSONS.length);
                } else {
                    console.error("Курс не найден в базе!");
                }
            } catch (e) {
                console.error("Ошибка загрузки курса:", e);
            }
        }

        // Запускаем скачивание сразу при открытии страницы
        loadCourseData();

        let LESSONS = []; // Теперь мы будем заполнять её из базы

        document.getElementById('uploadBtn').addEventListener('click', async () => {
            const statusEl = document.getElementById('status');
            statusEl.textContent = "Загрузка...";
            try {
                // Создаем в коллекции "courses" документ "python" и кладем туда массив
                await setDoc(doc(db, "courses", "python"), { data: LESSONS });
                statusEl.textContent = "✅ Уроки успешно загружены в Firebase!";
                statusEl.style.color = "green";
            } catch (error) {
                console.error(error);
                statusEl.textContent = "❌ Ошибка: " + error.message;
                statusEl.style.color = "red";
            }
        });
    </script>
</body>

</html>
