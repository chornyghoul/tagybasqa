<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Студент — Tagybasqa</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Onest:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1923; --ink2:#2a3a48; --ink3:#5a7080;
  --paper:#f7f9fb; --paper2:#eef2f6; --paper3:#e2e8ef;
  --blue:#1a6ef5; --bdim:rgba(26,110,245,.1);
  --green:#12b76a; --gdim:rgba(18,183,106,.12);
  --gold:#f59e0b; --red:#ef4444; --purple:#8b5cf6;
  --font:'Onest',sans-serif; --mono:'JetBrains Mono',monospace;
  --r:10px; --r2:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;-webkit-font-smoothing:antialiased}
body{font-family:var(--font);background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;min-height:100dvh}

/* JOIN */
#joinScreen{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.jcard{background:#fff;border-radius:20px;padding:32px;max-width:380px;width:100%;
  box-shadow:0 8px 40px rgba(0,0,0,.1)}
.jlogo{font-size:15px;font-weight:900;color:var(--blue);display:flex;align-items:center;gap:8px;margin-bottom:24px}
.jtitle{font-size:22px;font-weight:900;margin-bottom:4px;letter-spacing:-.02em}
.jsub{font-size:13px;color:var(--ink3);margin-bottom:24px;line-height:1.6}
.jfield{margin-bottom:14px}
.jfield label{display:block;font-family:var(--mono);font-size:9px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.jinp{width:100%;padding:13px 14px;border:1.5px solid var(--paper3);border-radius:var(--r);
  font-family:var(--font);font-size:15px;font-weight:600;color:var(--ink);
  background:var(--paper);outline:none;transition:border-color .15s;appearance:none}
.jinp:focus{border-color:var(--blue);background:#fff}
.jinp::placeholder{color:var(--ink3);font-weight:400}
.jinp-pin{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.3em;text-align:center}
.jbtn{width:100%;padding:14px;border:none;border-radius:var(--r);background:var(--blue);color:#fff;
  font-family:var(--font);font-size:15px;font-weight:800;cursor:pointer;margin-top:8px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 16px rgba(26,110,245,.3);transition:all .15s}
.jbtn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.jbtn:active{transform:scale(.98)}
.jbtn:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none}

/* WAIT */
#waitScreen{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;padding:40px;text-align:center}
.wait-pulse{width:68px;height:68px;border-radius:50%;background:var(--bdim);
  border:2px solid rgba(26,110,245,.2);display:flex;align-items:center;justify-content:center;
  animation:pulse 2s ease infinite}
.wait-pulse svg{color:var(--blue);width:30px;height:30px}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(26,110,245,.2)}
  50%{transform:scale(1.03);box-shadow:0 0 0 10px rgba(26,110,245,0)}}
.chip-green{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;
  background:var(--gdim);border:1px solid rgba(18,183,106,.2);border-radius:99px;
  font-size:14px;font-weight:700;color:var(--green)}
.dots{display:flex;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--blue);
  animation:dotb 1.4s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes dotb{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-7px);opacity:1}}

/* LESSON */
#lessonScreen{display:none;flex:1;flex-direction:column;min-height:0;overflow:hidden}
.ls-bar{height:46px;background:#fff;border-bottom:1px solid var(--paper3);
  display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0}
.ls-prog{flex:1;height:4px;background:var(--paper3);border-radius:99px;overflow:hidden}
.ls-prog-fill{height:100%;background:var(--blue);border-radius:99px;transition:width .5s ease}
.ls-cnt{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink3);white-space:nowrap}
.ls-score{padding:4px 10px;background:var(--bdim);border-radius:99px;
  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--blue);white-space:nowrap}
.ls-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;justify-content:center;padding:16px;background:var(--paper)}
.ls-card{background:#fff;border-radius:var(--r2);width:100%;max-width:660px;
  overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07);
  animation:slideUp .3s ease both;align-self:flex-start}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── BLOCK RENDERERS ── */
/* Generic content wrapper */
.bc{padding:22px 20px;display:flex;flex-direction:column;gap:14px}

/* Cover */
.b-cover{background:linear-gradient(135deg,#0f1f40,#1a3a6e,#0d2040);padding:36px 24px;text-align:center}
.b-cover-tag{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.3);margin-bottom:14px}
.b-cover-title{font-size:clamp(22px,6vw,34px);font-weight:900;color:#fff;
  letter-spacing:-.02em;line-height:1.15;margin-bottom:10px}
.b-cover-sub{font-size:clamp(12px,3.5vw,15px);color:rgba(255,255,255,.5);margin-bottom:20px}
.b-cover-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.b-cover-chip{padding:4px 12px;border:1px solid rgba(255,255,255,.12);border-radius:99px;
  font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.4)}

/* Heading / subheading */
.b-h1{font-size:clamp(20px,5vw,26px);font-weight:900;color:var(--ink);
  letter-spacing:-.02em;line-height:1.2}
.b-h2{font-size:clamp(16px,4vw,20px);font-weight:800;color:var(--ink2);line-height:1.3}

/* Text */
.b-text{font-size:clamp(13px,3.5vw,15px);color:var(--ink2);line-height:1.8;font-weight:500}

/* Callout */
.b-callout{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:var(--r);border-left:3px solid}
.b-callout-text{font-size:13px;line-height:1.65;font-weight:500}
.b-callout.info{background:#eff6ff;border-color:var(--blue)}
.b-callout.warning{background:#fffbeb;border-color:var(--gold)}
.b-callout.success{background:#f0fdf4;border-color:var(--green)}
.b-callout.danger{background:#fef2f2;border-color:var(--red)}

/* Code */
.b-code-wrap{border-radius:var(--r2);overflow:hidden}
.b-code-head{background:#1a2535;padding:8px 14px;display:flex;align-items:center;justify-content:space-between}
.b-code-dots{display:flex;gap:5px}
.b-code-dot{width:10px;height:10px;border-radius:50%}
.b-code-lang{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.3);text-transform:uppercase}
.b-code-pre{background:#0f1923;padding:16px;overflow-x:auto}
.b-code-pre code{font-family:var(--mono);font-size:clamp(11px,2.8vw,13px);
  line-height:1.7;color:#e2e8ef;white-space:pre;display:block}
.b-code-out{background:#1a2535;padding:10px 14px}
.b-code-out-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.3);margin-bottom:5px}
.b-code-out pre{font-family:var(--mono);font-size:clamp(11px,2.8vw,13px);
  color:#86efac;line-height:1.6;white-space:pre-wrap}

/* Slide */
.b-slide{background:linear-gradient(135deg,var(--paper2),var(--paper3));
  padding:24px;border-radius:var(--r);text-align:center}
.b-slide-title{font-size:clamp(17px,4.5vw,22px);font-weight:900;color:var(--ink);margin-bottom:8px}
.b-slide-body{font-size:13px;color:var(--ink2);line-height:1.7}

/* Task */
.b-task{background:var(--bdim);border:1.5px solid rgba(26,110,245,.18);border-radius:var(--r2);padding:16px}
.b-task-label{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--blue);margin-bottom:8px}
.b-task-text{font-size:clamp(14px,3.5vw,16px);font-weight:700;color:var(--ink);line-height:1.5}
.b-task-hint{font-size:12px;color:var(--ink3);margin-top:8px;font-style:italic}

/* Checklist */
.b-checklist{display:flex;flex-direction:column;gap:8px}
.b-check-item{display:flex;align-items:center;gap:12px;padding:10px 12px;
  background:var(--paper);border:1.5px solid var(--paper3);border-radius:var(--r);cursor:pointer;
  transition:all .15s;user-select:none}
.b-check-item.done{background:var(--gdim);border-color:rgba(18,183,106,.25)}
.b-check-box{width:20px;height:20px;border-radius:5px;border:2px solid var(--paper3);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .15s}
.b-check-item.done .b-check-box{background:var(--green);border-color:var(--green);color:#fff}
.b-check-lbl{font-size:13px;font-weight:600;color:var(--ink2);line-height:1.4}
.b-check-item.done .b-check-lbl{color:var(--green)}

/* Poll */
.b-poll{display:flex;flex-direction:column;gap:8px}
.b-poll-opt{padding:12px 14px;border:1.5px solid var(--paper3);border-radius:var(--r);
  cursor:pointer;font-size:14px;font-weight:600;color:var(--ink2);background:#fff;
  transition:all .15s;display:flex;align-items:center;gap:10px}
.b-poll-opt:hover{border-color:var(--purple);background:rgba(139,92,246,.04)}
.b-poll-opt.voted{border-color:var(--purple);background:rgba(139,92,246,.08);color:var(--purple)}
.b-poll-bar{flex:1;height:6px;background:var(--paper3);border-radius:99px;overflow:hidden}
.b-poll-fill{height:100%;background:var(--purple);border-radius:99px;transition:width .5s ease}
.b-poll-pct{font-family:var(--mono);font-size:11px;color:var(--ink3);min-width:32px;text-align:right}

/* Quiz */
.b-quiz{padding:20px;display:flex;flex-direction:column;gap:14px}
.b-quiz-badge{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:#c2410c;background:#fff7ed;padding:3px 10px;
  border-radius:99px;display:inline-block}
.b-quiz-q{font-size:clamp(15px,4vw,18px);font-weight:800;color:var(--ink);line-height:1.4}
.b-quiz-timer{height:3px;background:var(--paper3);border-radius:99px;overflow:hidden}
.b-quiz-timer-fill{height:100%;border-radius:99px;transition:width 1s linear;background:var(--blue)}
.b-quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:380px){.b-quiz-opts{grid-template-columns:1fr}}
.b-opt{padding:13px 12px;border-radius:var(--r2);border:2px solid;cursor:pointer;
  font-size:clamp(13px,3.5vw,15px);font-weight:700;font-family:var(--font);
  display:flex;align-items:center;gap:9px;text-align:left;transition:all .12s;appearance:none}
.b-opt-key{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-family:var(--mono);font-size:10px;font-weight:700;flex-shrink:0}
.oa{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}.oa .b-opt-key{background:#bfdbfe;color:#1d4ed8}
.ob{background:#fef3c7;border-color:#fde68a;color:#92400e}.ob .b-opt-key{background:#fde68a;color:#92400e}
.oc{background:#f0fdf4;border-color:#bbf7d0;color:#166534}.oc .b-opt-key{background:#bbf7d0;color:#166534}
.od{background:#faf5ff;border-color:#ddd6fe;color:#5b21b6}.od .b-opt-key{background:#ddd6fe;color:#5b21b6}
.b-opt:hover:not(:disabled){transform:scale(1.02);box-shadow:0 2px 10px rgba(0,0,0,.1)}
.b-opt:active:not(:disabled){transform:scale(.97)}
.b-opt:disabled{cursor:default;transform:none}
.b-opt.ok{border-color:var(--green)!important;background:var(--gdim)!important}
.b-opt.err{opacity:.4;border-color:var(--red)!important}

/* Answered state */
.b-answered{text-align:center;padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.b-ans-icon{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  animation:pop .4s cubic-bezier(.175,.885,.32,1.275) both}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.b-ans-title{font-size:18px;font-weight:800}
.b-ans-sub{font-size:13px;color:var(--ink3)}

/* End */
.b-end{background:linear-gradient(135deg,#0d2012,#0a3320);padding:36px 22px;text-align:center}
.b-end-trophy{font-size:52px;display:block;margin-bottom:14px;animation:fl 2.5s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.b-end-title{font-size:clamp(18px,5vw,26px);font-weight:900;color:#fff;margin-bottom:6px}
.b-end-score{font-family:var(--mono);font-size:13px;color:rgba(255,255,255,.45);margin-bottom:20px}
.b-end-pts{display:flex;flex-direction:column;gap:7px}
.b-end-pt{background:rgba(18,183,106,.1);border:1px solid rgba(18,183,106,.2);border-radius:var(--r);
  padding:11px 14px;display:flex;align-items:center;gap:10px;text-align:left}
.b-end-check{color:var(--green);font-size:14px;flex-shrink:0}
.b-end-text{font-size:13px;color:rgba(255,255,255,.75);line-height:1.4}

/* Toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(12px);
  padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;
  pointer-events:none;z-index:999;transition:all .22s;white-space:nowrap;
  box-shadow:0 6px 20px rgba(0,0,0,.2);background:var(--ink);color:#fff}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.t-ok{background:var(--green)!important}
.t-err{background:var(--red)!important}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- JOIN -->
<div id="joinScreen">
  <div class="jcard">
    <div class="jlogo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      Tagybasqa
    </div>
    <div class="jtitle">Сабаққа қосылу</div>
    <div class="jsub">Мұғалімнің PIN кодын енгізіп, атыңызды жазыңыз</div>
    <div class="jfield">
      <label>PIN код</label>
      <input class="jinp jinp-pin" id="pinInput" placeholder="000000" inputmode="numeric" maxlength="6" autocomplete="off">
    </div>
    <div class="jfield">
      <label>Атыңыз</label>
      <input class="jinp" id="nameInput" placeholder="Мысалы: Айгерім" maxlength="28" autocomplete="given-name">
    </div>
    <button class="jbtn" id="joinBtn" onclick="joinLesson()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Сабаққа кіру
    </button>
  </div>
</div>

<!-- WAIT -->
<div id="waitScreen">
  <div class="wait-pulse">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
  </div>
  <div class="chip-green" id="waitChip">Ойыншы</div>
  <div style="font-size:18px;font-weight:800;color:var(--ink)">Мұғалімді күтіңіз</div>
  <div style="font-size:13px;color:var(--ink3);line-height:1.6;max-width:260px;text-align:center">
    Мұғалім сабақты бастаған соң слайдтар автоматты пайда болады
  </div>
  <div class="dots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="ls-bar">
    <div class="ls-prog"><div class="ls-prog-fill" id="progFill" style="width:0%"></div></div>
    <div class="ls-cnt" id="slideCount">—</div>
    <div class="ls-score" id="scoreEl">0 ұп.</div>
  </div>
  <div class="ls-area" id="slideArea"></div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getFirestore, doc, getDoc, updateDoc, setDoc, onSnapshot,
  collection, query, where, getDocs
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const FB = {
  apiKey:"AIzaSyAywbSZkiReHjTq4oc46Kbw9iZ0iDHVTpY",
  authDomain:"pystart-dd2db.firebaseapp.com",
  projectId:"pystart-dd2db",
  storageBucket:"pystart-dd2db.firebasestorage.app",
  messagingSenderId:"9188811255",
  appId:"1:9188811255:web:6f7280f1f7f67b80d90ef2"
};
const app = !getApps().length ? initializeApp(FB) : getApp();
const db  = getFirestore(app);

// ── STATE ────────────────────────────────────────────────────
const uid = (() => {
  let id = localStorage.getItem('tgbq_uid');
  if (!id) { id = Math.random().toString(36).slice(2,10); localStorage.setItem('tgbq_uid',id); }
  return id;
})();
let playerName   = '';
let sessionId    = null;
let lessonBlocks = [];     // actual blocks from Firestore
let totalBlocks  = 0;
let score        = 0;
let currentIdx   = -1;
let answered     = false;
let quizTimer    = null;
let sessionUnsub = null;
let pollVotes    = {};     // blockIdx → chosen option index
let gameQuestions = [];    // questions of the launched saved quiz
let gameActive    = false;
let gameIdx       = -1;
let gameAnswered  = false;
let gameTimer     = null;

// Auto-fill PIN from URL
const urlPin = new URLSearchParams(location.search).get('pin');
if (urlPin) document.getElementById('pinInput').value = urlPin;

// ── JOIN ─────────────────────────────────────────────────────
window.joinLesson = async function() {
  const pin  = document.getElementById('pinInput').value.trim().replace(/\s/g,'');
  playerName = document.getElementById('nameInput').value.trim();
  if (pin.length < 6)  { toast('PIN кодты толық енгізіңіз','err'); return; }
  if (!playerName)     { toast('Атыңызды енгізіңіз','err'); return; }

  setJoinLoading(true);
  try {
    const q    = query(collection(db,'openLessonSessions'), where('pin','==',pin));
    const snap = await getDocs(q);
    if (snap.empty)                        { toast('Мұндай PIN табылмады','err'); setJoinLoading(false); return; }
    const sDoc = snap.docs[0];
    sessionId  = sDoc.id;
    const sData = sDoc.data();
    if (sData.status === 'finished')       { toast('Бұл сабақ аяқталды','err'); setJoinLoading(false); return; }

    // Load lesson blocks
    if (sData.lessonId) {
      for (const col of ['interactiveLessons','lessons','openLessons']) {
        try {
          const ls = await getDoc(doc(db, col, sData.lessonId));
          if (ls.exists()) { lessonBlocks = ls.data().blocks || []; break; }
        } catch(e) {}
      }
    }
    // Fallback: blocks might be stored on session directly
    if (!lessonBlocks.length && sData.blocks) lessonBlocks = sData.blocks;
    totalBlocks = lessonBlocks.length;

    // Pre-load the saved quiz attached to this session (if teacher selected one)
    if (sData.quizId) {
      try {
        const qDoc = await getDoc(doc(db,'quizzes',sData.quizId));
        if (qDoc.exists()) gameQuestions = qDoc.data().questions || [];
      } catch(e) { console.warn('load quiz:', e); }
    }

    // Register player
    await updateDoc(doc(db,'openLessonSessions',sessionId), {
      [`players.${uid}`]: { name:playerName, joinedAt:Date.now(), score:0 }
    });

    document.getElementById('waitChip').textContent = playerName;
    document.getElementById('joinScreen').style.display = 'none';
    document.getElementById('waitScreen').style.display = 'flex';
    toast(`Қош келдіңіз, ${playerName}!`,'ok');

    // If session already has a current slide, show it right away
    if (typeof sData.currentSlide === 'number' && sData.currentSlide >= 0) {
      showLesson();
      renderBlock(sData.currentSlide, sData.currentQuizState);
    }

    startListening();
  } catch(e) {
    console.error(e);
    toast('Қате: ' + e.message,'err');
    setJoinLoading(false);
  }
};

function setJoinLoading(on) {
  const btn = document.getElementById('joinBtn');
  btn.disabled = on;
  btn.innerHTML = on
    ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="animation:spin .8s linear infinite"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Қосылуда...`
    : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Сабаққа кіру`;
}

// ── LISTEN ───────────────────────────────────────────────────
function startListening() {
  sessionUnsub = onSnapshot(doc(db,'openLessonSessions',sessionId), snap => {
    if (!snap.exists()) return;
    const d = snap.data();

    if (d.status === 'finished') { showEnd(); return; }

    // ── Saved-quiz game launched by teacher ──
    if (d.activeGame) {
      const g = d.activeGame;
      if (g.qIndex !== gameIdx) {
        gameIdx = g.qIndex;
        gameActive = true;
        gameAnswered = false;
        clearInterval(gameTimer);
        showLesson();
        renderGameQuestion(g);
      } else if (g.revealed && !gameAnswered) {
        revealGameOnStudent(g.correct);
      } else if (g.revealed) {
        revealGameOnStudent(g.correct);
      }
      return;
    } else if (gameActive) {
      // Game just ended — resume normal lesson slide
      gameActive = false;
      gameIdx = -1;
      clearInterval(gameTimer);
      if (currentIdx >= 0) { showLesson(); renderBlock(currentIdx, d.currentQuizState); }
    }

    const idx = d.currentSlide ?? -1;
    if (idx >= 0 && idx !== currentIdx) {
      currentIdx = idx;
      answered   = false;
      clearInterval(quizTimer);
      showLesson();
      renderBlock(idx, d.currentQuizState);
    } else if (idx === currentIdx && d.currentQuizState?.revealed && !answered) {
      // Teacher revealed answer — show correct/wrong on student
      revealOnStudent(d.currentQuizState.correct);
    }
  });
}

function showLesson() {
  document.getElementById('waitScreen').style.display  = 'none';
  document.getElementById('lessonScreen').style.display = 'flex';
}

// ── RENDER BLOCK ─────────────────────────────────────────────
function renderBlock(idx, quizState) {
  const b = lessonBlocks[idx];
  if (!b) { showNoBlock(idx); return; }

  // Progress
  document.getElementById('progFill').style.width  = `${totalBlocks ? (idx+1)/totalBlocks*100 : 0}%`;
  document.getElementById('slideCount').textContent = `${idx+1}/${totalBlocks||'?'}`;
  document.getElementById('scoreEl').textContent    = `${score} ұп.`;

  const area = document.getElementById('slideArea');
  area.innerHTML = `<div class="ls-card" id="currentCard">${buildHTML(b, idx, quizState)}</div>`;
  area.scrollTop = 0;

  // Start quiz timer
  if (b.type === 'quiz' && !answered && !(quizState?.revealed)) {
    startQuizCountdown(b.timeLimit || b.time || 30, idx);
  }
  // If already revealed on load
  if (b.type === 'quiz' && quizState?.revealed) {
    revealOnStudent(quizState.correct);
  }
}

function showNoBlock(idx) {
  document.getElementById('slideArea').innerHTML = `
    <div class="ls-card">
      <div class="bc" style="text-align:center;padding:40px 20px;color:var(--ink3)">
        <div style="font-size:28px;margin-bottom:12px">⏳</div>
        <div style="font-family:var(--mono);font-size:12px">Мұғалімді күтіңіз...</div>
      </div>
    </div>`;
}

// ── BUILD HTML ────────────────────────────────────────────────
function buildHTML(b, idx, quizState) {
  const t = b.type;
  switch(t) {

    case 'heading':
      return `<div class="bc"><div class="b-h1">${esc(b.content||'')}</div></div>`;

    case 'subheading':
      return `<div class="bc"><div class="b-h2">${esc(b.content||'')}</div></div>`;

    case 'text':
      return `<div class="bc"><div class="b-text">${esc(b.content||'').replace(/\n/g,'<br>')}</div></div>`;

    case 'slide':
      return `<div class="bc">
        <div class="b-slide">
          ${b.slideTitle ? `<div class="b-slide-title">${esc(b.slideTitle)}</div>` : ''}
          <div class="b-slide-body">${esc(b.content||'').replace(/\n/g,'<br>')}</div>
        </div></div>`;

    case 'callout': {
      const icons = {info:'ℹ️',warning:'⚠️',success:'✅',danger:'❗'};
      const ct = b.calloutType||'info';
      return `<div class="bc"><div class="b-callout ${ct}">
        <span style="font-size:18px;flex-shrink:0">${icons[ct]||'ℹ️'}</span>
        <div class="b-callout-text">${esc(b.content||'').replace(/\n/g,'<br>')}</div>
      </div></div>`;
    }

    case 'code': {
      const code = (b.code||b.content||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return `<div class="bc" style="gap:0;padding:0">
        <div class="b-code-wrap">
          <div class="b-code-head">
            <div class="b-code-dots">
              <div class="b-code-dot" style="background:#ff5f57"></div>
              <div class="b-code-dot" style="background:#febc2e"></div>
              <div class="b-code-dot" style="background:#28c840"></div>
            </div>
            <span class="b-code-lang">${esc(b.language||'python')}</span>
          </div>
          <div class="b-code-pre"><code>${code}</code></div>
        </div>
      </div>`;
    }

    case 'task':
      return `<div class="bc">
        <div class="b-task">
          <div class="b-task-label">✏️ Тапсырма</div>
          <div class="b-task-text">${esc(b.taskText||b.content||'').replace(/\n/g,'<br>')}</div>
          ${b.hint ? `<div class="b-task-hint">💡 ${esc(b.hint)}</div>` : ''}
        </div></div>`;

    case 'checklist':
      return `<div class="bc">
        <div class="b-checklist" id="checklist-${idx}">
          ${(b.items||[]).map((item,i)=>`
            <div class="b-check-item" onclick="toggleCheck(${idx},${i},this)">
              <div class="b-check-box">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
              <span class="b-check-lbl">${esc(item)}</span>
            </div>`).join('')}
        </div></div>`;

    case 'poll': {
      const opts = b.pollOptions||b.options||[];
      const voted = pollVotes[idx];
      return `<div class="bc">
        <div style="font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--purple)">🗳 Голосование</div>
        <div class="b-h2">${esc(b.question||b.content||'')}</div>
        <div class="b-poll" id="poll-${idx}">
          ${opts.map((o,i)=>{ const pct = voted!==undefined ? (voted===i?100:0) : 0;
            return `<button class="b-poll-opt${voted!==undefined&&voted===i?' voted':''}"
              onclick="submitPoll(${idx},${i},${opts.length})" ${voted!==undefined?'disabled':''}>
              <span style="flex:0 0 auto;font-weight:700">${esc(o)}</span>
              <div class="b-poll-bar"><div class="b-poll-fill" id="pf-${idx}-${i}" style="width:${pct}%"></div></div>
              <span class="b-poll-pct" id="pp-${idx}-${i}">${voted!==undefined?pct+'%':''}</span>
            </button>`}).join('')}
        </div></div>`;
    }

    case 'quiz': {
      if (answered) return answeredHTML(false); // placeholder, real state from revealOnStudent
      const qs   = b.questions || (b.question ? [b] : []);
      const q    = qs[0] || b;
      const opts = q.options||q.answers||[];
      const colors = ['oa','ob','oc','od'];
      const keys   = ['A','B','C','D'];
      return `<div class="b-quiz">
        <span class="b-quiz-badge">⚡ КВИЗ СҰРАҒЫ</span>
        <div class="b-quiz-q">${esc(q.question||q.text||q.content||'').replace(/\n/g,'<br>')}</div>
        <div class="b-quiz-timer"><div class="b-quiz-timer-fill" id="qTimerFill" style="width:100%"></div></div>
        <div class="b-quiz-opts" id="quizOpts">
          ${opts.map((o,i)=>{
            const txt = typeof o==='string'?o:(o.text||'');
            return `<button class="b-opt ${colors[i]||'oa'}" onclick="submitQuiz(${idx},${i},this)">
              <div class="b-opt-key">${keys[i]||i+1}</div>
              ${esc(txt)}
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }

    case 'video': {
      const ytId = (b.url||'').match(/(?:v=|youtu\.be\/)([^&?/]+)/)?.[1];
      return `<div class="bc">
        ${ytId
          ? `<div style="border-radius:var(--r2);overflow:hidden;aspect-ratio:16/9">
               <iframe style="width:100%;height:100%;border:none" src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe>
             </div>`
          : `<div style="padding:24px;text-align:center;color:var(--ink3);font-family:var(--mono);font-size:12px">Видео URL жоқ</div>`}
      </div>`;
    }

    case 'image':
      return `<div class="bc">
        <img src="${esc(b.url||'')}" alt="" style="max-width:100%;border-radius:var(--r2);display:block">
      </div>`;

    case 'divider':
      return `<div class="bc"><div style="text-align:center;color:var(--paper3);font-size:24px">• • •</div></div>`;

    default:
      return `<div class="bc"><div class="b-text">${esc(b.content||b.text||b.slideTitle||t)}</div></div>`;
  }
}

function answeredHTML(correct, waitingReveal = false) {
  const bg  = correct ? 'var(--gdim)' : 'rgba(239,68,68,.08)';
  const bdr = correct ? 'rgba(18,183,106,.3)' : 'rgba(239,68,68,.25)';
  const clr = correct ? 'var(--green)' : 'var(--red)';
  const icon = correct
    ? '<polyline points="20 6 9 17 4 12"/>'
    : '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>';
  const title = waitingReveal ? 'Жауап жіберілді' : correct ? 'Дұрыс жауап! ✓' : 'Қате жауап ✗';
  const sub   = waitingReveal ? 'Мұғалімнің жауапты ашуын күтіңіз' : correct ? `+${100} ұпай алдыңыз` : 'Дұрыс жауап жоғарыда белгіленеді';
  return `<div class="b-answered">
    <div class="b-ans-icon" style="background:${bg};border:2px solid ${bdr}">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="${clr}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>
    </div>
    <div class="b-ans-title" style="color:${clr}">${title}</div>
    <div class="b-ans-sub">${sub}</div>
  </div>`;
}

// ── QUIZ ─────────────────────────────────────────────────────
let _lastQuizIdx   = -1;
let _lastQuizChosen = -1;

window.submitQuiz = async function(blockIdx, chosen, btn) {
  if (answered) return;
  answered = true;
  clearInterval(quizTimer);
  _lastQuizIdx    = blockIdx;
  _lastQuizChosen = chosen;

  // Visually select
  document.querySelectorAll('#quizOpts .b-opt').forEach((b,i) => {
    b.disabled = true;
    if (i === chosen) b.classList.add('selected');
  });

  // Save to Firestore
  const b  = lessonBlocks[blockIdx];
  const q  = (b.questions||[b])[0];
  const correctIdx = q.correctIndex ?? q.correct ?? 0;
  // Check correct: support both {correct:true} options and correctIndex
  const isCorrect = (() => {
    const opts = q.options||q.answers||[];
    if (typeof opts[chosen] === 'object') return !!opts[chosen].correct;
    return chosen === correctIdx;
  })();

  if (isCorrect) score += q.points || 100;

  try {
    await setDoc(doc(db,'liveAnswers',`${sessionId}_${uid}_${blockIdx}`),{
      sessionId, uid, playerName, slideIdx:blockIdx,
      answer:chosen, correct:isCorrect, timestamp:Date.now()
    });
    await updateDoc(doc(db,'openLessonSessions',sessionId),{
      [`players.${uid}.score`]: score
    });
  } catch(e) { console.warn('save answer:', e); }

  // Show "waiting" state
  const card = document.getElementById('currentCard');
  if (card) card.innerHTML = `<div class="b-quiz">${answeredHTML(isCorrect, true)}</div>`;
  document.getElementById('scoreEl').textContent = `${score} ұп.`;
};

function revealOnStudent(correctIdx) {
  if (!answered) return; // not answered yet — don't show
  // Re-render with result
  const b   = lessonBlocks[currentIdx];
  const q   = (b?.questions||[b])[0];
  const opts = q?.options||q?.answers||[];
  const chosen = _lastQuizChosen;
  const isCorrect = (() => {
    if (typeof opts[chosen]==='object') return !!opts[chosen].correct;
    return chosen === correctIdx;
  })();
  const card = document.getElementById('currentCard');
  if (card) card.innerHTML = `<div class="b-quiz">${answeredHTML(isCorrect, false)}</div>`;
}

// ── SAVED QUIZ GAME (launched mid-lesson by teacher) ───────────
function renderGameQuestion(g) {
  const q = gameQuestions[g.qIndex] || {};
  const opts = q.options || q.answers || [];
  const colors = ['oa','ob','oc','od'];
  const keys   = ['A','B','C','D'];

  document.getElementById('progFill').style.width  = `${gameQuestions.length ? (g.qIndex+1)/gameQuestions.length*100 : 0}%`;
  document.getElementById('slideCount').textContent = `🎮 ${g.qIndex+1}/${g.total||gameQuestions.length}`;
  document.getElementById('scoreEl').textContent    = `${score} ұп.`;

  const area = document.getElementById('slideArea');
  area.innerHTML = `<div class="ls-card" id="currentCard">
    <div class="b-quiz">
      <span class="b-quiz-badge">🎮 ЖАРАМДЫ КВИЗ</span>
      <div class="b-quiz-q">${esc(q.question||q.text||'').replace(/\n/g,'<br>')}</div>
      <div class="b-quiz-timer"><div class="b-quiz-timer-fill" id="qTimerFill" style="width:100%"></div></div>
      <div class="b-quiz-opts" id="quizOpts">
        ${opts.map((o,i)=>{
          const txt = typeof o==='string'?o:(o.text||'');
          return `<button class="b-opt ${colors[i]||'oa'}" onclick="submitGameAnswer(${g.qIndex},${i})">
            <div class="b-opt-key">${keys[i]||i+1}</div>
            ${esc(txt)}
          </button>`;
        }).join('')}
      </div>
    </div>
  </div>`;
  area.scrollTop = 0;

  if (!g.revealed) startGameCountdown(q.timeLimit || q.time || 20, g.qIndex);
}

window.submitGameAnswer = async function(qIndex, chosen) {
  if (gameAnswered) return;
  gameAnswered = true;
  clearInterval(gameTimer);

  document.querySelectorAll('#quizOpts .b-opt').forEach((b,i) => {
    b.disabled = true;
    if (i === chosen) b.classList.add('selected');
  });

  const q = gameQuestions[qIndex] || {};
  const opts = q.options || q.answers || [];
  const correctIdx = q.correctIndex ?? q.correct ?? 0;
  const isCorrect = (() => {
    if (typeof opts[chosen] === 'object') return !!opts[chosen].correct;
    return chosen === correctIdx;
  })();
  if (isCorrect) score += q.points || 100;

  try {
    await setDoc(doc(db,'liveAnswers',`${sessionId}_${uid}_game${qIndex}`),{
      sessionId, uid, playerName, gameQuestion:qIndex,
      answer:chosen, correct:isCorrect, timestamp:Date.now()
    });
    await updateDoc(doc(db,'openLessonSessions',sessionId),{
      [`players.${uid}.score`]: score
    });
  } catch(e) { console.warn('save game answer:', e); }

  const card = document.getElementById('currentCard');
  if (card) card.innerHTML = `<div class="b-quiz">${answeredHTML(isCorrect, true)}</div>`;
  document.getElementById('scoreEl').textContent = `${score} ұп.`;
};

function revealGameOnStudent(correctIdx) {
  if (!gameAnswered) return;
  const card = document.getElementById('currentCard');
  if (card && !card.dataset.revealed) {
    card.dataset.revealed = '1';
    card.innerHTML = `<div class="b-quiz">${answeredHTML(true, false)}</div>`;
  }
}

function startGameCountdown(sec, qIndex) {
  let rem = sec;
  const fill = () => document.getElementById('qTimerFill');
  if (fill()) {
    fill().style.transition = `width ${sec}s linear`;
    setTimeout(()=>{ if(fill()) fill().style.width='0%'; }, 50);
  }
  gameTimer = setInterval(()=>{
    rem--;
    if (rem <= 0) {
      clearInterval(gameTimer);
      if (!gameAnswered) {
        gameAnswered = true;
        const card = document.getElementById('currentCard');
        if (card) card.innerHTML = `<div class="b-quiz"><div class="b-answered">
          <div class="b-ans-title" style="color:var(--red)">Уақыт аяқталды</div>
          <div class="b-ans-sub">Жауап беруге үлгермедіңіз</div>
        </div></div>`;
        setDoc(doc(db,'liveAnswers',`${sessionId}_${uid}_game${qIndex}`),{
          sessionId, uid, playerName, gameQuestion:qIndex,
          answer:-1, correct:false, timeout:true, timestamp:Date.now()
        }).catch(()=>{});
      }
    }
  }, 1000);
}

function startQuizCountdown(sec, blockIdx) {
  let rem = sec;
  const fill = () => document.getElementById('qTimerFill');
  if (fill()) {
    fill().style.transition = `width ${sec}s linear`;
    setTimeout(()=>{ if(fill()) fill().style.width='0%'; }, 50);
  }
  quizTimer = setInterval(()=>{
    rem--;
    if (rem <= 0) {
      clearInterval(quizTimer);
      if (!answered) {
        // Time up — auto-submit with wrong answer
        answered = true;
        const card = document.getElementById('currentCard');
        if (card) card.innerHTML = `<div class="b-quiz">
          <div class="b-answered">
            <div class="b-ans-icon" style="background:rgba(239,68,68,.08);border:2px solid rgba(239,68,68,.25)">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            </div>
            <div class="b-ans-title" style="color:var(--red)">Уақыт аяқталды</div>
            <div class="b-ans-sub">Жауап беруге үлгермедіңіз</div>
          </div>
        </div>`;
        // save timeout
        setDoc(doc(db,'liveAnswers',`${sessionId}_${uid}_${blockIdx}`),{
          sessionId, uid, playerName, slideIdx:blockIdx,
          answer:-1, correct:false, timeout:true, timestamp:Date.now()
        }).catch(()=>{});
      }
    }
  }, 1000);
}

// ── POLL ─────────────────────────────────────────────────────
window.submitPoll = async function(blockIdx, chosen, total) {
  if (pollVotes[blockIdx] !== undefined) return;
  pollVotes[blockIdx] = chosen;
  // Update UI
  for (let i=0;i<total;i++) {
    const pct = i === chosen ? 100 : 0;
    const fill = document.getElementById(`pf-${blockIdx}-${i}`);
    const pctEl = document.getElementById(`pp-${blockIdx}-${i}`);
    if (fill) fill.style.width = pct+'%';
    if (pctEl) pctEl.textContent = pct+'%';
  }
  document.querySelectorAll(`#poll-${blockIdx} .b-poll-opt`).forEach((b,i)=>{
    b.disabled = true;
    if (i===chosen) b.classList.add('voted');
  });
  // Save
  try {
    await setDoc(doc(db,'pollAnswers',`${sessionId}_${uid}_${blockIdx}`),{
      sessionId, uid, playerName, blockIdx, chosen, timestamp:Date.now()
    });
  } catch(e) {}
};

// ── CHECKLIST ────────────────────────────────────────────────
const checkStates = {};
window.toggleCheck = function(blockIdx, itemIdx, el) {
  if (!checkStates[blockIdx]) checkStates[blockIdx] = new Set();
  const set = checkStates[blockIdx];
  const done = set.has(itemIdx);
  if (done) set.delete(itemIdx); else set.add(itemIdx);
  el.classList.toggle('done', !done);
  const svg = el.querySelector('svg');
  if (svg) svg.style.display = done ? 'none' : 'block';
};

// ── END ──────────────────────────────────────────────────────
function showEnd() {
  if (sessionUnsub) sessionUnsub();
  const area = document.getElementById('slideArea');
  showLesson();
  document.getElementById('progFill').style.width = '100%';
  document.getElementById('scoreEl').textContent  = `${score} ұп.`;
  area.innerHTML = `<div class="ls-card">
    <div class="b-end">
      <span class="b-end-trophy">🏆</span>
      <div class="b-end-title">Сабақ аяқталды!</div>
      <div class="b-end-score">Сіздің ұпайыңыз: <b style="color:var(--gold)">${score} ұпай</b></div>
      <div class="b-end-pts">
        <div class="b-end-pt"><span class="b-end-check">✓</span><span class="b-end-text">Барлық блоктардан өттіңіз</span></div>
        <div class="b-end-pt"><span class="b-end-check">✓</span><span class="b-end-text">Нәтижелер мұғалімге жіберілді</span></div>
      </div>
    </div>
  </div>`;
}

// ── UTILS ────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = type ? `show t-${type}` : 'show';
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.className='', 3000);
}

// Keyboard shortcuts for quiz
document.addEventListener('keydown', e => {
  const map = {'a':0,'A':0,'1':0,'б':0,'b':1,'B':1,'2':1,'в':1,'c':2,'C':2,'3':2,'с':2,'d':3,'D':3,'4':3,'д':3};
  const i   = map[e.key];
  if (i !== undefined && !answered) {
    const btns = document.querySelectorAll('#quizOpts .b-opt');
    if (btns[i]) btns[i].click();
  }
});

// Enter on name field
document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.joinLesson();
});
